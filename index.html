<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>OOTP Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pretendard:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#1c1c20;--card:#27272a;--ink:#fafafa;--muted:#a1a1aa;--rule:#3f3f46;--accent:hsl(265,55%,60%)}
:root[data-theme="light"]{--bg:#fafafa;--card:#fff;--ink:#0a0a0d;--muted:#71717a;--rule:#e4e4e7;--accent:hsl(265,55%,50%)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Inter","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:32px 20px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1{font-size:22px;margin:0 0 4px}p.sub{color:var(--muted);margin:0 0 24px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:900px}
a.card{display:block;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card b{display:block;font-size:17px;margin-bottom:4px}a.card span{color:var(--muted);font-size:13px}
a.card.soon{opacity:.5;pointer-events:none}
</style></head><body>
<h1>OOTP Lab</h1><p class="sub">친구와 검증하는 도구들. 각 페이지는 따로 돌아가요.</p>
<div class="grid">
  <a class="card" href="game/"><b>게임 앱 (v1 스켈레톤)</b><span>사이드바·탭바·뒤로/앞으로·브레드크럼. 실제 게임 UI 시작점.</span></a>
  <a class="card" href="judge/"><b>드래프트 선수 판정</b><span>생성된 선수와 16~40세 커리어가 자연스러운지 10명씩 판정해요</span></a>
  <a class="card" href="growth/"><b>성장 시연</b><span>표준 선수에 시나리오 요인을 넣어 예산·비용·환경 효과를 본다</span></a>
  <a class="card soon" href="#"><b>스카우트 리포트 (준비 중)</b><span>스카우트 오차가 들어간 보고서 시연</span></a>
</div>
</body></html>
