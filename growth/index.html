<title>성장 시연</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#F3F6F4;--card:#FFFFFF;--ink:#1B2A24;--muted:#66766E;--rule:#D5DCD7;--soft:#E9EFEB;
  --accent:#1F6F4A;--accent-ink:#FFFFFF;--accent-soft:#DDEFE4;--lo:#C0392B;--hi:#1E8E4A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101B24;--card:#16232E;--ink:#E4ECE7;--muted:#90A6B9;--rule:#304453;--soft:#1C2A36;
    --accent:#A6EDB6;--accent-ink:#0F2418;--accent-soft:#1E3A2C;--lo:#F08A8A;--hi:#6FE09A;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px;line-height:1.5;padding:20px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 20px;margin-bottom:14px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.player{display:flex;flex-wrap:wrap;gap:14px 28px;font-size:14px}
.player b{color:var(--ink);font-weight:600}
.scenarios{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.scenarios label{display:flex;gap:8px;align-items:center;cursor:pointer;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;font-size:13px;background:var(--soft)}
.scenarios label input{accent-color:var(--accent);cursor:pointer}
.scenarios label.on{background:var(--accent-soft);border-color:var(--accent)}
.scenarios .swatch{display:inline-block;width:14px;height:14px;border-radius:3px}
.controls{display:flex;gap:14px;align-items:center;margin:8px 0 4px;font-size:14px}
.controls select{font:inherit;font-size:14px;padding:5px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink)}
.chart{width:100%;aspect-ratio:900/280;display:block}
.chart text{font:11px "IBM Plex Mono",monospace;fill:var(--muted)}
.chart .agebig{font:600 18px "IBM Plex Mono",monospace;fill:var(--ink)}
.sliderrow{margin:6px 0 4px;padding:0 30px}
.sliderrow input{width:100%;accent-color:var(--accent)}
.factors{color:var(--muted);font-size:12px;margin:6px 0 0}
.factors span{display:inline-block;margin-right:14px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;margin-top:8px;table-layout:fixed}
.heat table{table-layout:fixed}
th,td{text-align:center;padding:3px 4px;border-bottom:1px solid var(--soft);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:11px}
th:first-child,td:first-child{text-align:left;width:96px}
td.n{font-family:"IBM Plex Mono",monospace;font-weight:500}
td.hi{color:var(--hi);background:rgba(30,142,74,.10);font-weight:600}
td.lo{color:var(--lo);background:rgba(192,57,43,.10);font-weight:600}
td.now,th.now{background:var(--accent-soft)}
tr.g th{text-align:left;padding-top:8px;color:var(--muted);font-size:11px;letter-spacing:.04em;border-bottom:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:22px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0}
.diff{color:var(--muted);font-size:12px;margin-left:6px}
.diff.hi{color:var(--hi)}
.diff.lo{color:var(--lo)}
</style>

<div class="wrap">
<h1>성장 시연</h1>
<p class="sub">표준 선수 하나로 요인 시나리오를 비교한다. 요인이 전부 1.0이면 판정 앱의 곡선과 같다. <a href="../">← OOTP Lab</a> · <a href="../judge/">판정 앱</a></p>

<div class="card">
  <h2>이 선수</h2>
  <p class="player" id="player"></p>
</div>

<div class="card">
  <h2>시나리오</h2>
  <div class="scenarios" id="scenarios"></div>
  <p class="factors" id="active-factors"></p>
</div>

<div class="card">
  <h2>능력 곡선</h2>
  <div class="controls">
    <label>능력 <select id="ability"></select></label>
    <span class="hint" id="ab-note"></span>
  </div>
  <svg class="chart" id="chart" viewBox="0 0 900 280"></svg>
  <div class="sliderrow"><input type="range" id="age" min="16" max="40" step="1" value="27"></div>
  <div class="legend" id="legend"></div>
</div>

<div class="card">
  <h2>나이 × 능력 (기본 시나리오 기준)</h2>
  <div class="controls">
    <label>비교 <select id="compare"></select></label>
    <span class="hint">차이(기본 대비)만 색으로 표시</span>
  </div>
  <div class="heat"><table id="heat"></table></div>
</div>
</div>

<script>
(function(){
  const pool = JSON.parse(document.getElementById('pool').textContent);
  const AGES = pool.scenarios[0].ages.map(a => a.age);
  const abilities = pool.ability_labels;
  const SET_NAMES = {bat:'타격', run:'주루', field:'수비', pitch:'투구', common:'공통'};
  const groups = ['bat','run','field','pitch','common'];
  let selected = new Set(['baseline', 'contact_focus']);
  let currentAbility = 'contact';
  let age = 27;
  let compareId = 'contact_focus';
  const $ = id => document.getElementById(id);

  // 이 선수
  const talText = pool.talents.map(([id, label, v]) => `${label.replace(' 재능','')} <b>${v}</b>`).join(' · ');
  $('player').innerHTML = `<span><b>${pool.player_label}</b></span><span>${talText}</span>`;

  // 능력 드롭다운
  for (const [set, name] of Object.entries(SET_NAMES).map(([k,v]) => [k, v])) {}
  const abSel = $('ability');
  let abHtml = '';
  for (const g of groups) {
    const list = abilities.filter(a => a[2] === g);
    if (!list.length) continue;
    abHtml += `<optgroup label="${SET_NAMES[g]}">`;
    for (const [id, label] of list) abHtml += `<option value="${id}" ${id === currentAbility ? 'selected' : ''}>${label}</option>`;
    abHtml += `</optgroup>`;
  }
  abSel.innerHTML = abHtml;
  abSel.addEventListener('change', e => { currentAbility = e.target.value; renderChart(); renderNote(); });

  // 시나리오 체크박스
  $('scenarios').innerHTML = pool.scenarios.map(s => `<label class="${selected.has(s.id) ? 'on' : ''}" data-id="${s.id}"><input type="checkbox" ${selected.has(s.id) ? 'checked' : ''}><span class="swatch" style="background:${s.color}"></span><span>${s.label}</span></label>`).join('');
  document.querySelectorAll('.scenarios label').forEach(el => {
    const id = el.dataset.id;
    el.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) selected.add(id); else selected.delete(id);
      el.classList.toggle('on', e.target.checked);
      renderChart(); renderActiveFactors();
    });
  });

  // 비교 시나리오 드롭다운(비교용 열지도)
  $('compare').innerHTML = pool.scenarios.filter(s => s.id !== 'baseline').map(s => `<option value="${s.id}" ${s.id === compareId ? 'selected' : ''}>${s.label}</option>`).join('');
  $('compare').addEventListener('change', e => { compareId = e.target.value; renderHeat(); });

  $('age').addEventListener('input', e => { age = +e.target.value; renderChart(); renderHeat(); });

  function renderActiveFactors(){
    const items = [];
    for (const id of selected) {
      const s = pool.scenarios.find(x => x.id === id); if (!s) continue;
      const bits = [];
      if (s.factors.player_factor !== 1) bits.push(`선수 ${s.factors.player_factor}`);
      for (const [k, v] of Object.entries(s.factors.env)) bits.push(`환경.${k} ${v}`);
      for (const [k, v] of Object.entries(s.factors.alloc)) bits.push(`분배.${k} ${v}`);
      items.push(`<span><span style="color:${s.color};font-weight:600">■</span> ${s.label}${bits.length ? ' — ' + bits.join(' · ') : ' — 요인 전부 1.0'}</span>`);
    }
    $('active-factors').innerHTML = items.join('');
  }

  function renderNote(){
    const ab = abilities.find(a => a[0] === currentAbility);
    const ceil = pool.ceilings[currentAbility];
    const isBudget = ab && (ab[2] === 'bat' || ab[2] === 'run' || ab[2] === 'field' || ab[2] === 'pitch' || ab[2] === 'common');
    // family 정보는 pool에 없지만 신체/기술 구분은 능력 id로 대략 안내
    const bodyIds = new Set(['speed','power','arm_str','velocity','stamina','recovery','range']);
    const kind = bodyIds.has(currentAbility) ? '신체 계열 — 분배 요인은 속도, 예산 밖' : '예산 계열(기술·판단)';
    $('ab-note').textContent = `${kind} · 재능 천장 ${ceil.toFixed(1)}(내부)`;
  }

  const W = 900, H = 280, padL = 40, padR = 30, padT = 20, padB = 24;
  const xOf = a => padL + (a - 16) / 24 * (W - padL - padR);
  const yOf = v => padT + (100 - v) / 99 * (H - padT - padB);

  function renderChart(){
    let s = '';
    // grid
    for (const v of [0, 25, 50, 75, 100]) s += `<line x1="${padL}" x2="${W-padR}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="var(--rule)" stroke-dasharray="3 4"/><text x="${padL-6}" y="${yOf(v)+4}" text-anchor="end">${v}</text>`;
    for (const a of [16,20,25,30,35,40]) s += `<line x1="${xOf(a)}" x2="${xOf(a)}" y1="${H-padB}" y2="${H-padB+4}" stroke="var(--rule)"/><text x="${xOf(a)}" y="${H-8}" text-anchor="middle">${a}</text>`;
    // 천장 선
    const ceil = pool.ceilings[currentAbility];
    if (ceil) s += `<line x1="${padL}" x2="${W-padR}" y1="${yOf(ceil)}" y2="${yOf(ceil)}" stroke="var(--muted)" stroke-dasharray="2 4"/><text x="${W-padR+4}" y="${yOf(ceil)+4}">천장</text>`;
    // 곡선들
    const legend = [];
    for (const id of selected) {
      const sc = pool.scenarios.find(x => x.id === id); if (!sc) continue;
      const pts = sc.ages.map(r => `${xOf(r.age)},${yOf(r.abilities[currentAbility])}`).join(' ');
      s += `<polyline points="${pts}" fill="none" stroke="${sc.color}" stroke-width="${id==='baseline'?2.5:2}" stroke-linejoin="round"/>`;
      legend.push(`<span><i style="background:${sc.color}"></i>${sc.label}</span>`);
    }
    // 나이 세로선
    const x = xOf(age);
    s += `<line x1="${x}" x2="${x}" y1="${padT}" y2="${H-padB}" stroke="var(--ink)" stroke-width="1" opacity="0.4"/><text class="agebig" x="${x}" y="${padT-4}" text-anchor="middle">${age}세</text>`;
    $('chart').innerHTML = s;
    $('legend').innerHTML = legend.join('');
    renderNote();
    renderActiveFactors();
  }

  function renderHeat(){
    const base = pool.scenarios.find(s => s.id === 'baseline');
    const comp = pool.scenarios.find(s => s.id === compareId);
    if (!base || !comp) return;
    const ageIdx = AGES.indexOf(age);
    let h = '<colgroup><col style="width:100px">' + AGES.filter((_,i)=>i%2===0).map(()=>'<col>').join('') + '</colgroup>';
    h += '<thead><tr><th></th>' + AGES.filter((_,i)=>i%2===0).map(a=>`<th class="${a===age?'now':''}">${a}</th>`).join('') + '</tr></thead><tbody>';
    for (const g of groups) {
      const list = abilities.filter(a => a[2] === g);
      if (!list.length) continue;
      h += `<tr class="g"><th colspan="${AGES.filter((_,i)=>i%2===0).length+1}">${SET_NAMES[g]}</th></tr>`;
      for (const [id, label] of list) {
        h += `<tr><td>${label}</td>`;
        for (let i=0;i<AGES.length;i+=2) {
          const a = AGES[i];
          const b = base.ages[i].abilities[id];
          const c = comp.ages[i].abilities[id];
          const bd = comp.ages[i].display[id];
          const diff = c - b;
          const cls = Math.abs(diff) < 0.5 ? '' : diff > 0 ? 'hi' : 'lo';
          h += `<td class="n ${cls} ${a===age?'now':''}">${bd}</td>`;
        }
        h += '</tr>';
      }
    }
    $('heat').innerHTML = h + '</tbody>';
  }

  renderChart();
  renderHeat();
  renderActiveFactors();
})();
</script>
