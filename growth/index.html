<title>성장 시연</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#F3F6F4;--card:#FFFFFF;--ink:#1B2A24;--muted:#66766E;--rule:#D5DCD7;--soft:#E9EFEB;
  --accent:#1F6F4A;--accent-ink:#FFFFFF;--accent-soft:#DDEFE4;
  --base:#66766E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101B24;--card:#16232E;--ink:#E4ECE7;--muted:#90A6B9;--rule:#304453;--soft:#1C2A36;
    --accent:#A6EDB6;--accent-ink:#0F2418;--accent-soft:#1E3A2C;
    --base:#90A6B9;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px;line-height:1.5;padding:20px}
.wrap{max-width:1400px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.player{display:flex;flex-wrap:wrap;gap:12px 24px;font-size:13px}
.player b{color:var(--ink);font-weight:600}
.scenarios{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.scenarios label{display:flex;gap:8px;align-items:center;cursor:pointer;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;font-size:13px;background:var(--soft)}
.scenarios label input{accent-color:var(--accent);cursor:pointer}
.scenarios label.on{background:var(--accent-soft);border-color:var(--accent)}
.scenarios .swatch{display:inline-block;width:14px;height:14px;border-radius:3px}
.grid{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;table-layout:fixed;width:100%;min-width:900px}
th,td{padding:5px 6px;border-bottom:1px solid var(--soft);white-space:nowrap;text-align:center}
thead th{background:var(--card);color:var(--muted);font-weight:500;font-size:12px;position:sticky;top:0;z-index:2}
th.name,td.name{text-align:left;font-family:inherit;color:var(--ink);position:sticky;left:0;background:var(--card);z-index:3;width:130px;padding-left:0}
thead th.name{z-index:4}
tr.g th{text-align:left;padding-top:10px;color:var(--muted);font-size:11px;letter-spacing:.04em;border-bottom:0;font-weight:600;background:var(--card)}
td.val{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}
td.val small{display:block;font-size:10px;font-weight:500;line-height:1.2;margin-top:0}
tr.base td.val{color:var(--ink)}
tr.base td.val small{color:var(--muted)}
tr.sc td.name{padding-left:12px;font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;padding-top:6px;padding-bottom:6px}
tr.sc td.name .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
tr.sc td.val small{font-weight:400}
tr.sc td.eq{color:var(--muted);opacity:.45}
tr.sc td.eq small{color:transparent}
.legend{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.7}
.legend b{color:var(--ink);font-weight:600}
</style>

<div class="wrap">
<h1>성장 시연</h1>
<p class="sub">표준 선수 하나를 시나리오 요인으로 시뮬. 기본 = 요인 전부 1.0(판정 앱 곡선). <a href="../">← OOTP Lab</a> · <a href="../judge/">판정 앱</a></p>

<div class="card">
  <h2>이 선수</h2>
  <p class="player" id="player"></p>
</div>

<div class="card">
  <h2>시나리오</h2>
  <div class="scenarios" id="scenarios"></div>
</div>

<div class="card">
  <h2>능력 × 나이 (성장기 위주)</h2>
  <div class="grid"><table id="grid"></table></div>
  <p class="legend">
    각 능력마다 <b>기본</b>이 첫 줄이고, 켠 시나리오가 아래로 한 줄씩 붙는다. 숫자는 표시값(1~20), 아래 작은 숫자는 기본 대비 내부 차이. 값은 시나리오 색으로 표시된다.<br>
    파워·주력·구속·체력 같은 신체 능력은 <b>천장까지 가는 속도만</b> 요인이 바꾸고 천장은 못 넘는다. 초반 나이에 조금 빨리 도달하지만 정점 뒤엔 같은 값에 붙는다.
  </p>
</div>

<script>
(function(){
  const pool = JSON.parse(document.getElementById('pool').textContent);
  const AGES = pool.scenarios[0].ages.map(a => a.age);
  // 성장기 위주: 16~30 짝수
  const SHOW = [16, 18, 20, 22, 24, 26, 28, 30];
  const abilities = pool.ability_labels;
  const SET_NAMES = {bat:'타격', run:'주루', field:'수비', pitch:'투구', common:'공통'};
  const groups = ['bat','run','field','pitch','common'];
  const OPTIONAL = pool.scenarios.filter(s => s.id !== 'baseline');
  let selected = new Set(['contact_focus']);
  const $ = id => document.getElementById(id);

  const talText = pool.talents.map(([id, label, v]) => `${label.replace(' 재능','')} <b>${v}</b>`).join(' · ');
  $('player').innerHTML = `<span><b>${pool.player_label}</b></span><span>${talText}</span>`;

  $('scenarios').innerHTML = OPTIONAL.map(s => `<label class="${selected.has(s.id) ? 'on' : ''}" data-id="${s.id}"><input type="checkbox" ${selected.has(s.id) ? 'checked' : ''}><span class="swatch" style="background:${s.color}"></span><span>${s.label}</span></label>`).join('');
  document.querySelectorAll('.scenarios label').forEach(el => {
    const id = el.dataset.id;
    el.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) selected.add(id); else selected.delete(id);
      el.classList.toggle('on', e.target.checked);
      renderGrid();
    });
  });

  function renderGrid(){
    const base = pool.scenarios.find(s => s.id === 'baseline');
    const active = OPTIONAL.filter(s => selected.has(s.id));  // 사이드바 순서 유지 → 흔들림 없음
    const ageIdx = a => AGES.indexOf(a);
    // 열: 이름 + 나이들
    let head = '<colgroup><col style="width:130px">' + SHOW.map(() => '<col style="width:66px">').join('') + '</colgroup>';
    head += '<thead><tr><th class="name">능력</th>' + SHOW.map(a => `<th>${a}세</th>`).join('') + '</tr></thead><tbody>';
    let body = '';
    for (const g of groups) {
      const list = abilities.filter(a => a[2] === g);
      if (!list.length) continue;
      body += `<tr class="g"><th class="name">${SET_NAMES[g]}</th>` + SHOW.map(() => '<th></th>').join('') + `</tr>`;
      for (const [id, label] of list) {
        // 기본 줄
        body += `<tr class="base"><td class="name">${label}</td>`;
        for (const a of SHOW) {
          const b = base.ages[ageIdx(a)];
          body += `<td class="val">${b.display[id]}</td>`;
        }
        body += '</tr>';
        // 시나리오 줄들
        for (const sc of active) {
          body += `<tr class="sc"><td class="name"><span class="dot" style="background:${sc.color}"></span>${sc.label.split('(')[0].trim()}</td>`;
          for (const a of SHOW) {
            const b = base.ages[ageIdx(a)].abilities[id];
            const v = sc.ages[ageIdx(a)].abilities[id];
            const vd = sc.ages[ageIdx(a)].display[id];
            const diff = v - b;
            if (Math.abs(diff) < 0.1) {
              body += `<td class="val eq">${vd}<small>·</small></td>`;
            } else {
              const sign = diff > 0 ? '+' : '';
              body += `<td class="val" style="color:${sc.color}">${vd}<small style="color:${sc.color}">${sign}${diff.toFixed(1)}</small></td>`;
            }
          }
          body += `</tr>`;
        }
      }
    }
    $('grid').innerHTML = head + body + '</tbody>';
  }

  renderGrid();
})();
</script>
