<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OOTP Game (v1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Pretendard:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
/* ============================================================
 * 게임 앱 컴포넌트 CSS.
 * 모든 색·간격·타이포는 shared/tokens.css의 role 토큰을 참조.
 * 여기에는 원시값(hex/px)과 :root 정의가 없다 (Phase 1, 2026-09-10).
 * ============================================================ */

/* ── 셸 전용 reset (tokens.css의 reset보다 우선하는 게임 앱 특유 규칙) ── */
*, *::before, *::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background: var(--bg-primary);
  color: var(--text-normal);
  font-family: var(--font-interface);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}
button{
  font: inherit; color: inherit; cursor: pointer;
  border: 0; background: transparent; padding: 0; margin: 0;
}
a{color: inherit; text-decoration: none}
input, select, textarea{
  font: inherit; color: inherit;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: var(--size-6) var(--size-8);
}
input:focus, select:focus{
  outline: none;
  border-color: var(--accent);
}
::selection{background: var(--accent); color: var(--text-on-accent)}

/* ============================================================
 * APP SHELL — grid areas
 *   ┌──────── topbar (전체 폭) ────────┐
 *   │                                  │
 *   ├── sidebar ────┬── main ──────────┤
 *   │               │                  │
 *   └───────────────┴──────────────────┘
 * ============================================================ */
.app{
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--tabbar-h) 1fr;
  grid-template-areas:
    "topbar  topbar"
    "sidebar main";
  height: 100vh;
}
.app.sidebar-collapsed{grid-template-columns: var(--sidebar-w-collapsed) 1fr}

/* ── Topbar (전체 폭, 3열: 브랜드 · 탭바 · 컨트롤) ── */
.topbar{
  grid-area: topbar;
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr) auto;
  align-items: stretch;
  border-bottom: 1px solid var(--border-strong);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25), 0 2px 6px rgba(0, 0, 0, 0.15);
  background: var(--bg-tertiary);
  min-width: 0;
  z-index: 2;
}
.app.sidebar-collapsed .topbar{grid-template-columns: var(--sidebar-w-collapsed) minmax(0, 1fr) auto}
.topbar-brand{
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--size-8) 0 var(--size-16);
  border-right: 1px solid var(--border);
  background: var(--bg-secondary);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  color: var(--text-normal);
  min-width: 0;
}
.app.sidebar-collapsed .topbar-brand{padding: 0; justify-content: center}
.app.sidebar-collapsed .topbar-brand .brand-full{display: none}
.topbar-toggle{
  padding: var(--size-4) var(--size-6);
  border-radius: var(--radius-s);
  color: var(--text-muted);
  font-size: var(--text-md);
  line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px;
}
.topbar-toggle:hover{background: var(--bg-hover); color: var(--text-normal)}
.app.sidebar-collapsed .topbar-toggle{transform: rotate(180deg)}
.topbar-right{
  display: flex; align-items: center; justify-content: flex-end;
  gap: var(--size-8);
  padding: 0 var(--size-16);
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  min-width: 0;
  white-space: nowrap;
}
.topbar-team{
  font-size: var(--text-sm);
  color: var(--text-normal);
  font-weight: var(--weight-medium);
}
.topbar-season{
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--text-muted);
}
.topbar-team::after{
  content: '·';
  color: var(--text-faint);
  margin-left: var(--size-8);
}
.topbar-advance{
  display: inline-flex; align-items: center; gap: var(--size-6);
  padding: var(--size-4) var(--size-10);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--text-normal);
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
}
.topbar-advance:hover{background: var(--bg-hover); border-color: var(--border-strong)}

/* ── Sidebar ── */
.sidebar{
  grid-area: sidebar;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

.sidebar-nav{
  flex: 1;
  padding: var(--size-8) var(--size-6);
  display: flex; flex-direction: column; gap: var(--size-2);
  overflow-y: auto;
}
.nav-group-label{
  padding: var(--size-12) var(--size-10) var(--size-4);
  font-size: var(--text-xxs);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-faint);
}
.app.sidebar-collapsed .nav-group-label{display: none}
.nav-divider{
  height: 1px; background: var(--border);
  margin: var(--size-8) var(--size-8);
}
.sidebar-item{
  display: flex; align-items: center; gap: var(--size-10);
  padding: var(--size-6) var(--size-10);
  border-radius: var(--radius-s);
  color: var(--text-muted);
  font-size: var(--text-base);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.sidebar-item:hover{background: var(--bg-hover); color: var(--text-normal)}
.sidebar-item.active{background: var(--bg-selected); color: var(--text-normal); font-weight: var(--weight-medium)}
.sidebar-item .item-glyph{
  width: 14px; height: 14px;
  flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: var(--text-xxs);
  font-weight: var(--weight-semibold);
  color: var(--text-faint);
  border: 1px solid currentColor;
  border-radius: var(--radius-s);
}
.sidebar-item.active .item-glyph{color: var(--accent)}
.app.sidebar-collapsed .sidebar-item{justify-content: center; padding: var(--size-8) 0}
.app.sidebar-collapsed .sidebar-item .item-label{display: none}

/* sidebar-footer 제거됨 — topbar로 이동 */
.button{
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--size-6);
  padding: var(--size-6) var(--size-12);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--text-normal);
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.button:hover{background: var(--bg-hover); border-color: var(--border-strong)}
.button-primary{
  background: var(--accent); color: var(--text-on-accent); border-color: transparent;
}
.button-primary:hover{background: var(--accent); filter: brightness(1.1); border-color: transparent}
.button-ghost{background: transparent; border-color: transparent; color: var(--text-muted)}
.button-ghost:hover{background: var(--bg-hover); color: var(--text-normal)}
.app.sidebar-collapsed .button .button-label{display: none}

/* ── Main ── */
.main{
  grid-area: main;
  display: grid;
  grid-template-rows: var(--navbar-h) 1fr;
  min-width: 0;
  overflow: hidden;
}

.tabbar{
  display: flex; align-items: stretch;
  background: var(--bg-primary);
  overflow-x: auto;
  scrollbar-width: none;
  min-width: 0;
  height: var(--tabbar-h);
}
.tabbar::-webkit-scrollbar{display: none}

.tab{
  display: flex; align-items: center; gap: var(--size-8);
  padding: 0 var(--size-8) 0 var(--size-12);
  height: var(--tabbar-h);
  font-size: var(--text-sm);
  color: var(--text-muted);
  font-weight: var(--weight-regular);
  border-right: 1px solid var(--border);
  /* 크롬 감각: 탭 늘어나면 flex-shrink로 균등 축소. 최소는 아이콘+× 보일 정도. */
  flex: 1 1 180px;
  min-width: 44px;
  max-width: 200px;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease);
  position: relative;
  overflow: hidden;
}
.tab:hover{background: var(--bg-hover); color: var(--text-normal)}
.tab.active{
  background: var(--bg-secondary);
  color: var(--text-normal);
  font-weight: var(--weight-medium);
}
.tab.active::before{
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px; background: var(--accent);
}
.tab .tab-glyph{
  font-family: var(--font-mono);
  font-size: var(--text-xxs);
  font-weight: var(--weight-semibold);
  color: var(--text-faint);
  width: 16px; text-align: center;
  flex: 0 0 auto;
}
.tab.active .tab-glyph{color: var(--accent)}
.tab .tab-name{
  overflow: hidden; text-overflow: ellipsis;
  flex: 1 1 auto; min-width: 0;
}
/* 탭이 매우 작아지면 비활성 탭의 close 버튼과 이름 숨김 (아이콘만 남음) */
.tab:not(.active){container-type: inline-size}
@container (max-width: 80px) {
  .tab-name{display: none}
  .tab-close{display: none}
}
.tab .tab-close{
  width: 18px; height: 18px;
  border-radius: var(--radius-s);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1;
  color: var(--text-muted);
  flex: 0 0 auto;
}
.tab .tab-close:hover{background: var(--bg-active); color: var(--text-normal)}
.tab-new{
  padding: 0 var(--size-12);
  font-size: var(--text-lg);
  line-height: 1;
  color: var(--text-muted);
}
.tab-new:hover{background: var(--bg-hover); color: var(--text-normal)}

.navbar{
  display: flex; align-items: center;
  gap: var(--size-4);
  padding: 0 var(--size-12);
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border);
  font-size: var(--text-sm);
}
.navbar-btn{
  padding: var(--size-4) var(--size-6);
  border-radius: var(--radius-s);
  color: var(--text-muted);
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px;
  font-size: var(--text-md);
  line-height: 1;
}
.navbar-btn:hover:not(:disabled){background: var(--bg-hover); color: var(--text-normal)}
.navbar-btn:disabled{opacity: .35; cursor: not-allowed}
.crumbs{
  display: flex; align-items: center; gap: var(--size-4);
  overflow: hidden; flex: 1;
  margin-left: var(--size-6);
}
.crumb{
  color: var(--text-muted);
  padding: var(--size-2) var(--size-6);
  border-radius: var(--radius-s);
  white-space: nowrap;
}
.crumb:hover{background: var(--bg-hover); color: var(--text-normal)}
.crumb.last{color: var(--text-normal); font-weight: var(--weight-medium); pointer-events: none}
.crumb.last:hover{background: transparent}
.crumb-sep{color: var(--text-faint); font-size: var(--text-xs)}

.content{
  overflow: auto;
  padding: var(--size-24) var(--size-32);
  min-width: 0;
  background: var(--bg-primary);
}

/* ============================================================
 * COMPONENTS
 * ============================================================ */

/* Typography helpers */
.page-title{
  font-size: var(--text-2xl);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-tight);
  color: var(--text-normal);
  margin: 0 0 var(--size-4);
}
.page-sub{
  color: var(--text-muted);
  font-size: var(--text-sm);
  margin: 0 0 var(--size-24);
}
.section-title{
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 var(--size-10);
}

/* Card */
.card{
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  padding: var(--size-16) var(--size-20);
  margin-bottom: var(--size-12);
}

/* Filter bar */
.filterbar{
  display: flex; align-items: center; gap: var(--size-8);
  margin-bottom: var(--size-12);
  padding: 0;
}
.filterbar .search{
  flex: 1;
  max-width: 320px;
  padding: var(--size-6) var(--size-10);
  font-size: var(--text-sm);
}
.filterbar select{
  padding: var(--size-6) var(--size-10);
  font-size: var(--text-sm);
}
.filterbar .count{
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

/* Data list */
.dlist{
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  overflow: hidden;
}
.dlist-row{
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
  gap: var(--size-12);
  padding: var(--size-10) var(--size-16);
  align-items: center;
  border-bottom: 1px solid var(--border);
  font-size: var(--text-base);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.dlist-row:last-child{border-bottom: 0}
.dlist-row:hover{background: var(--bg-hover)}
.dlist-row.head{
  background: var(--bg-tertiary);
  color: var(--text-muted);
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  padding: var(--size-8) var(--size-16);
  cursor: default;
}
.dlist-row.head:hover{background: var(--bg-tertiary)}
.dlist-row.head .sort-th{
  display: inline-flex; align-items: center; gap: var(--size-4);
  cursor: pointer;
  user-select: none;
}
.dlist-row.head .sort-th:hover{color: var(--text-normal)}
.dlist-row.head .sort-th.active{color: var(--text-normal)}
.dlist-row.head .sort-indicator{
  opacity: 0.6;
  font-size: var(--text-xxs);
}
.dlist-row.head .sort-th.active .sort-indicator{opacity: 1; color: var(--accent)}
.dlist-row .cell-primary{font-weight: var(--weight-medium); color: var(--text-normal)}
.dlist-row .cell-num{font-family: var(--font-mono); color: var(--text-muted); font-size: var(--text-sm)}
.dlist-row .hand-marker{
  margin-left: var(--size-8);
  font-family: var(--font-mono);
  font-size: var(--text-xxs);
  color: var(--text-faint);
  font-weight: var(--weight-regular);
}

/* Ability grid */
.abilities{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: var(--size-4);
}
.ability{
  display: flex; justify-content: space-between; align-items: center;
  padding: var(--size-6) var(--size-10);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
}
.ability .ability-label{color: var(--text-muted)}
.ability .ability-value{
  font-family: var(--font-mono);
  font-weight: var(--weight-medium);
  color: var(--text-normal);
}
.set-group{margin-bottom: var(--size-16)}

/* Slots (training) */
.slots{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: var(--size-8);
}
.slot{
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  padding: var(--size-12) var(--size-16);
}
.slot-label{
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 var(--size-8);
}
.slot-meta{
  margin-top: var(--size-8);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-faint);
}
.slot select{width: 100%; font-size: var(--text-sm)}

/* Placeholder box */
.placeholder{
  color: var(--text-faint);
  font-size: var(--text-sm);
  padding: var(--size-16);
  text-align: center;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-s);
}

/* Sub-tabs (페이지 안 로컬 뷰) */
.subtabs{
  display: flex; gap: var(--size-4);
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--size-16);
}
.subtab{
  padding: var(--size-8) var(--size-12);
  font-size: var(--text-sm);
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: pointer;
}
.subtab:hover{color: var(--text-normal)}
.subtab.active{color: var(--text-normal); border-bottom-color: var(--accent); font-weight: var(--weight-medium)}

/* Selection (라인업/로테이션/뎁스 공용 좌우 레이아웃) */
.lineup-wrap, .rotation-wrap, .depth-wrap, .bullpen-wrap{
  display: grid; grid-template-columns: 1fr 320px; gap: var(--size-24)
}
@media (max-width: 900px){.lineup-wrap, .rotation-wrap, .depth-wrap, .bullpen-wrap{grid-template-columns: 1fr}}

/* Depth chart (포지션별 리스트) */
.depth-list{display: flex; flex-direction: column; gap: var(--size-4)}
.depth-pos{
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: var(--size-10) var(--size-12);
}
.depth-pos-head{
  display: flex; align-items: center; gap: var(--size-8);
  margin-bottom: var(--size-8);
}
.depth-pos-label{
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--accent);
  font-weight: var(--weight-semibold);
  min-width: 40px;
}
.depth-pos-name{
  font-size: var(--text-xs);
  color: var(--text-muted);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
}
.depth-slots{display: flex; flex-direction: column; gap: var(--size-2)}
.depth-slot{
  display: grid;
  grid-template-columns: 60px 1fr auto;
  gap: var(--size-8);
  padding: var(--size-6) var(--size-10);
  align-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
  cursor: pointer;
}
.depth-slot:hover{border-color: var(--accent)}
.depth-slot.empty{border-style: dashed; color: var(--text-faint)}
.depth-rank{
  font-family: var(--font-mono);
  color: var(--text-muted);
  font-size: var(--text-xs);
}
.depth-clear{
  padding: var(--size-2) var(--size-6);
  color: var(--text-faint);
  font-size: var(--text-md);
  border-radius: var(--radius-s);
}
.depth-clear:hover{background: var(--bg-hover); color: var(--text-normal)}

/* Bullpen (역할별) */
.bullpen-list{display: flex; flex-direction: column; gap: var(--size-8)}
.bullpen-role{
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: var(--size-10) var(--size-12);
}
.bullpen-role-head{
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--size-8);
}
.bullpen-role-name{
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--accent);
  font-weight: var(--weight-semibold);
}
.bullpen-role-count{
  font-size: var(--text-xs);
  color: var(--text-muted);
}
.bullpen-members{
  display: flex; flex-wrap: wrap; gap: var(--size-4);
  min-height: 32px;
}
.bullpen-chip{
  display: inline-flex; align-items: center; gap: var(--size-6);
  padding: var(--size-4) var(--size-8);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
  background: var(--bg-tertiary);
}
.bullpen-chip-x{
  color: var(--text-faint);
  cursor: pointer; padding: 0 2px;
}
.bullpen-chip-x:hover{color: var(--text-normal)}
.bullpen-empty{
  color: var(--text-faint);
  font-size: var(--text-xs);
  font-style: italic;
  padding: var(--size-4) 0;
}

.lineup-list{
  display: flex; flex-direction: column; gap: var(--size-4);
}
.lineup-slot{
  display: grid;
  grid-template-columns: 32px 60px 1fr auto;
  gap: var(--size-12);
  align-items: center;
  padding: var(--size-10) var(--size-12);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease);
}
.lineup-slot:hover{border-color: var(--accent)}
.lineup-slot.empty{border-style: dashed; color: var(--text-faint)}
.lineup-slot.empty:hover{color: var(--text-normal)}
.slot-order{
  font-family: var(--font-mono);
  font-size: var(--text-md);
  font-weight: var(--weight-semibold);
  color: var(--accent);
  text-align: center;
}
.slot-pos{
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--text-muted);
  font-weight: var(--weight-medium);
}
.slot-name{font-weight: var(--weight-medium)}
.slot-clear{
  padding: var(--size-2) var(--size-6);
  color: var(--text-faint);
  font-size: var(--text-md);
  border-radius: var(--radius-s);
}
.slot-clear:hover{background: var(--bg-hover); color: var(--text-normal)}

/* Player picker (오른쪽 사이드) */
.picker{
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  padding: var(--size-12) var(--size-16);
}
.picker-title{
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 var(--size-10);
}
.picker-hint{
  font-size: var(--text-xs);
  color: var(--text-faint);
  margin-bottom: var(--size-10);
}
.picker-list{
  max-height: 480px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: var(--size-2);
}
.picker-item{
  display: grid;
  grid-template-columns: 60px 1fr auto;
  gap: var(--size-8);
  padding: var(--size-6) var(--size-8);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
  cursor: pointer;
  align-items: center;
}
.picker-item:hover{background: var(--bg-hover)}
.picker-item.used{opacity: .35}
.picker-item.selected{background: var(--bg-selected); border: 1px solid var(--accent); padding: calc(var(--size-6) - 1px) calc(var(--size-8) - 1px)}
.picker-item .pi-pos{font-family: var(--font-mono); color: var(--text-muted); font-size: var(--text-xs)}
.picker-item .pi-name{font-weight: var(--weight-medium)}
.picker-item .pi-ovr{font-family: var(--font-mono); color: var(--text-muted); font-size: var(--text-xs)}

/* Empty state */
.empty{
  max-width: 480px;
  margin: var(--size-48) auto 0;
}
.empty-tiles{
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: var(--size-8);
  margin-top: var(--size-16);
}
.empty-tile{
  padding: var(--size-16) var(--size-20);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.empty-tile:hover{border-color: var(--accent); background: var(--bg-hover)}
.empty-tile-kind{
  font-size: var(--text-xxs);
  color: var(--text-faint);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  margin-bottom: var(--size-4);
}
.empty-tile-name{
  font-size: var(--text-base);
  font-weight: var(--weight-medium);
  color: var(--text-normal);
}

:1,"field_training":1,"motivation":14,"pitch_training":1,"run_training":1,"youth_development":14}},{"id":8,"name":"고형욱","kind":"gm","abilities":{"bat_training":1,"body_training":1,"field_training":1,"motivation":10,"pitch_training":1,"run_training":1,"youth_development":1}}],"registrations":[{"player":2026646054,"status":"active","since":"2026-03-01"},{"player":2026646041,"status":"active","since":"2026-03-01"},{"player":2026646050,"status":"active","since":"2026-03-01"},{"player":2026646049,"status":"active","since":"2026-03-01"},{"player":2026646063,"status":"active","since":"2026-03-01"},{"player":2026646048,"status":"active","since":"2026-03-01"},{"player":2026646028,"status":"active","since":"2026-03-01"},{"player":2026646046,"status":"active","since":"2026-03-01"},{"player":2026646020,"status":"active","since":"2026-03-01"},{"player":2026646021,"status":"active","since":"2026-03-01"},{"player":2026646047,"status":"active","since":"2026-03-01"},{"player":2026646008,"status":"active","since":"2026-03-01"},{"player":2026646012,"status":"active","since":"2026-03-01"},{"player":2026646032,"status":"active","since":"2026-03-01"},{"player":2026646044,"status":"active","since":"2026-03-01"},{"player":2026646034,"status":"active","since":"2026-03-01"},{"player":2026646053,"status":"active","since":"2026-03-01"},{"player":2026646009,"status":"active","since":"2026-03-01"},{"player":2026646014,"status":"active","since":"2026-03-01"},{"player":2026646022,"status":"active","since":"2026-03-01"},{"player":2026646010,"status":"active","since":"2026-03-01"},{"player":2026646001,"status":"active","since":"2026-03-01"},{"player":2026646023,"status":"active","since":"2026-03-01"},{"player":2026646006,"status":"active","since":"2026-03-01"},{"player":2026646002,"status":"active","since":"2026-03-01"},{"player":2026646017,"status":"active","since":"2026-03-01"},{"player":2026646029,"status":"active","since":"2026-03-01"},{"player":2026646036,"status":"active","since":"2026-03-01"},{"player":2026646043,"status":"active","since":"2026-03-01"},{"player":2026646027,"status":"active","since":"2026-03-01"}]}</script>
<script>
(function(){
  const POOL = JSON.parse(document.getElementById('pool').textContent);
  const C = POOL.constants;

  // 상수 룩업: pool.constants에서 라벨/매핑 조회. 하드코드 대체.
  const dict = arr => Object.fromEntries(arr);
  const SET_NAMES = dict(C.set_names);
  const KIND_LABELS = dict(C.staff_kinds);
  const STAFF_ABILITY_LABELS = dict(C.staff_abilities);
  const POSITION_LABELS = dict(C.positions);
  const DEPTH_RANK_LABELS = dict(C.depth_ranks);
  const CATEGORY_LABELS = Object.fromEntries(C.categories.map(([id, label]) => [id, label]));
  const IND_TRAINING_LABELS = dict(C.individual_trainings);
  // 스태프 종류 → 주 능력 id (bat_coach → bat_training)
  const KIND_MAIN_ABILITY = dict(C.staff_main_ability);
  // 훈련 카테고리 → coach kind, training ability
  const CATEGORY_INFO = Object.fromEntries(
    C.categories.map(([id, label, coachKind, ability]) => [id, { label, coachKind, ability }])
  );

  // 별점 규칙 (pool에서 온 표 기반)
  const STAR_ENV = Object.fromEntries(C.star_env_table);
  function starOf(v){
    const val = Math.max(1, Math.min(20, v || 1));
    for (const [star, upper] of C.ability_to_star_thresholds) {
      if (val <= upper) return star;
    }
    return 5;
  }

  const CATEGORIES = [
    { key:'players',   glyph:'PL', label:'선수단', home:'/players/overview' },
    { key:'selection', glyph:'SE', label:'편성',   home:'/selection/lineup' },
    { key:'staff',     glyph:'ST', label:'스태프', home:'/staff' },
    { key:'training',  glyph:'TR', label:'훈련',   home:'/training' },
  ];

  function routeContext(route){
    if (route.startsWith('/players') || route.startsWith('/player/')) return 'players';
    if (route.startsWith('/selection')) return 'selection';
    if (route.startsWith('/staff'))    return 'staff';
    if (route.startsWith('/training')) return 'training';
    return null;
  }

  const PLAYERS_SUBTABS = [
    { key:'overview', label:'개요' },
    { key:'list',     label:'리스트' },
    { key:'roster',   label:'로스터' },
  ];

  let tabs = [];
  let activeTabId = null;
  let nextTabId = 1;

  function makeTab(route){ return { id: nextTabId++, route, history:[route], histIdx:0 }; }
  function activeTab(){ return tabs.find(t => t.id === activeTabId); }

  function openTab(route){
    const t = makeTab(route);
    tabs.push(t); activeTabId = t.id;
    render();
  }
  function closeTab(id){
    const idx = tabs.findIndex(t => t.id === id);
    if (idx < 0) return;
    tabs.splice(idx,1);
    if (activeTabId === id) {
      activeTabId = tabs.length ? tabs[Math.max(0, idx-1)].id : null;
    }
    render();
  }
  function switchTo(route, opts={}){
    if (opts.newTab || !tabs.length){ openTab(route); return; }
    const catHomes = CATEGORIES.map(c => c.home);
    if (catHomes.includes(route)){
      const existing = tabs.find(t => t.route === route);
      if (existing){ activeTabId = existing.id; render(); return; }
    }
    const t = activeTab();
    if (!t){ openTab(route); return; }
    t.history = t.history.slice(0, t.histIdx+1);
    t.history.push(route);
    t.histIdx = t.history.length - 1;
    t.route = route;
    render();
  }
  function goBack(){
    const t = activeTab(); if (!t || t.histIdx <= 0) return;
    t.histIdx--; t.route = t.history[t.histIdx]; render();
  }
  function goForward(){
    const t = activeTab(); if (!t || t.histIdx >= t.history.length-1) return;
    t.histIdx++; t.route = t.history[t.histIdx]; render();
  }

  function parseRoute(route){ return route.split('/').filter(Boolean); }

  function breadcrumbFor(route){
    const parts = parseRoute(route);
    const crumbs = [];
    const ctx = routeContext(route);
    const cat = CATEGORIES.find(c => c.key === ctx);
    if (cat) crumbs.push({ label: cat.label, route: cat.home });
    if (parts[0] === 'players' && parts[1]) {
      const st = PLAYERS_SUBTABS.find(t => t.key === parts[1]);
      if (st) crumbs.push({ label: st.label, route });
    } else if (parts[0] === 'player' && parts[1]){
      const p = POOL.players.find(x => String(x.id) === parts[1]);
      crumbs.push({ label: p ? p.name : parts[1], route });
    } else if (parts[0] === 'staff' && parts[1]){
      const s = POOL.staff.find(x => String(x.id) === parts[1]);
      crumbs.push({ label: s ? s.name : parts[1], route });
    } else if (parts[0] === 'selection' && parts[1]) {
      const subLabels = { lineup:'라인업', rotation:'로테이션', bullpen:'불펜', depth:'뎁스 차트' };
      crumbs.push({ label: subLabels[parts[1]] || parts[1], route });
    }
    return crumbs;
  }

  function tabLabel(route){
    const parts = parseRoute(route);
    if (parts[0] === 'players')  return { glyph:'PL', name:'선수단' };
    if (parts[0] === 'staff' && !parts[1]) return { glyph:'ST', name:'스태프' };
    if (parts[0] === 'training') return { glyph:'TR', name:'훈련' };
    if (parts[0] === 'selection') {
      const names = { lineup:'라인업', rotation:'로테이션', bullpen:'불펜', depth:'뎁스' };
      return { glyph:'SE', name: names[parts[1]] || '편성' };
    }
    if (parts[0] === 'players' && parts[1]) {
      const names = { overview:'선수단 개요', list:'선수단 리스트', roster:'선수단 로스터' };
      return { glyph:'PL', name: names[parts[1]] || '선수단' };
    }
    if (parts[0] === 'player' && parts[1]){
      const p = POOL.players.find(x => String(x.id) === parts[1]);
      return { glyph:'PL', name: p ? p.name : `선수 ${parts[1]}` };
    }
    if (parts[0] === 'staff' && parts[1]){
      const s = POOL.staff.find(x => String(x.id) === parts[1]);
      return { glyph:'ST', name: s ? s.name : `스태프 ${parts[1]}` };
    }
    return { glyph:'·', name:'페이지' };
  }

  function render(){
    const t = activeTab();
    const ctx = t ? routeContext(t.route) : null;

    // Sidebar: 카테고리 + Lab 섹션 (자리 예약)
    document.getElementById('sidebar-items').innerHTML =
      CATEGORIES.map(c =>
        `<a class="sidebar-item ${c.key === ctx ? 'active' : ''}" data-route="${c.home}">
          <span class="item-glyph">${c.glyph}</span>
          <span class="item-label">${c.label}</span>
        </a>`
      ).join('') +
      `<div class="nav-divider"></div>
       <div class="nav-group-label">Lab</div>
       <a class="sidebar-item" style="opacity:.4;pointer-events:none">
         <span class="item-glyph">·</span>
         <span class="item-label">(자리 예약)</span>
       </a>`;
    document.querySelectorAll('.sidebar-item').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        switchTo(el.dataset.route, { newTab: e.metaKey || e.ctrlKey });
      });
    });

    // Tabbar
    const tabbar = document.getElementById('tabbar');
    tabbar.innerHTML = tabs.map(tab => {
      const lb = tabLabel(tab.route);
      return `<div class="tab ${tab.id===activeTabId?'active':''}" data-id="${tab.id}">
        <span class="tab-glyph">${lb.glyph}</span>
        <span class="tab-name">${lb.name}</span>
        <button class="tab-close" data-close="${tab.id}" title="닫기">×</button>
      </div>`;
    }).join('') + `<button class="tab-new" title="새 탭">+</button>`;
    tabbar.querySelectorAll('.tab').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.dataset.close) return;
        activeTabId = parseInt(el.dataset.id, 10); render();
      });
    });
    tabbar.querySelectorAll('.tab-close').forEach(b => {
      b.addEventListener('click', e => { e.stopPropagation(); closeTab(parseInt(b.dataset.close, 10)); });
    });
    tabbar.querySelector('.tab-new').addEventListener('click', () => openTab('/players'));

    // Nav buttons
    document.getElementById('nav-back').disabled = !t || t.histIdx <= 0;
    document.getElementById('nav-forward').disabled = !t || t.histIdx >= t.history.length - 1;

    // Breadcrumb
    const crumbs = t ? breadcrumbFor(t.route) : [];
    document.getElementById('crumbs').innerHTML = crumbs.map((c, i) => {
      const last = i === crumbs.length - 1;
      const sep = i > 0 ? '<span class="crumb-sep">/</span>' : '';
      return `${sep}<a class="crumb ${last?'last':''}" data-route="${c.route}">${c.label}</a>`;
    }).join('');
    document.querySelectorAll('.crumb').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        switchTo(el.dataset.route, { newTab: e.metaKey || e.ctrlKey });
      });
    });

    // Content
    if (t) renderContent(t.route);
    else renderEmpty();
  }

  function renderEmpty(){
    const el = document.getElementById('content');
    el.innerHTML = `
      <div class="empty">
        <h1 class="page-title">열린 탭이 없습니다</h1>
        <p class="page-sub">사이드바에서 카테고리를 고르거나 아래에서 선택하세요.</p>
        <div class="empty-tiles">
          ${CATEGORIES.map(c => `
            <a class="empty-tile" data-route="${c.home}">
              <div class="empty-tile-kind">카테고리</div>
              <div class="empty-tile-name">${c.label}</div>
            </a>`).join('')}
        </div>
      </div>`;
    bindRouteLinks(el);
  }

  function renderContent(route){
    const parts = parseRoute(route);
    const el = document.getElementById('content');
    if (parts[0] === 'players') el.innerHTML = viewPlayersHub(parts[1] || 'overview');
    else if (parts[0] === 'player') el.innerHTML = viewPlayer(parts[1]);
    else if (parts[0] === 'staff' && !parts[1]) el.innerHTML = viewStaffList();
    else if (parts[0] === 'staff' && parts[1]) el.innerHTML = viewStaff(parts[1]);
    else if (parts[0] === 'training') el.innerHTML = viewTraining();
    else if (parts[0] === 'selection') el.innerHTML = viewSelection(parts[1] || 'lineup');
    else el.innerHTML = `<div class="placeholder">알 수 없는 페이지: ${route}</div>`;
    bindRouteLinks(el);
    if (parts[0] === 'players') bindPlayersHub(el, parts[1] || 'overview');
    if (parts[0] === 'selection') bindSelection(el, parts[1] || 'lineup');
    if (parts[0] === 'player' && parts[1]) bindPlayerDetail(el, parseInt(parts[1], 10));
    if (parts[0] === 'staff' && !parts[1]) bindStaffFilters(el);
    if (parts[0] === 'training') bindTraining(el);
  }

  function bindRouteLinks(root){
    root.querySelectorAll('[data-route]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        switchTo(a.dataset.route, { newTab: e.metaKey || e.ctrlKey });
      });
    });
  }

  // 리스트 상태 (검색·필터·정렬)
  const listState = {
    players: { search: '', role: 'all', sortBy: 'name', sortDir: 'asc' },
    staff:   { search: '', kind: 'all', sortBy: 'name', sortDir: 'asc' },
  };

  function sortRows(items, sortBy, sortDir, keyFn){
    const dir = sortDir === 'asc' ? 1 : -1;
    return items.slice().sort((a,b) => {
      const va = keyFn(a, sortBy), vb = keyFn(b, sortBy);
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va).localeCompare(String(vb), 'ko') * dir;
    });
  }

  function viewPlayersHub(sub){
    const subtabs = PLAYERS_SUBTABS.map(t =>
      `<a class="subtab ${t.key===sub?'active':''}" data-route="/players/${t.key}">${t.label}</a>`
    ).join('');
    let body = '';
    if (sub === 'overview') body = viewPlayersOverview();
    else if (sub === 'list') body = viewPlayers();
    else if (sub === 'roster') body = viewPlayersRoster();
    else body = `<div class="placeholder">알 수 없는 뷰: ${sub}</div>`;
    return `<div class="subtabs">${subtabs}</div>${body}`;
  }

  function bindPlayersHub(el, sub){
    // 서브탭은 data-route를 가져 bindRouteLinks가 이미 처리. 중복 리스너 제거.
    if (sub === 'list') bindPlayersFilters(el);
    if (sub === 'roster') bindPlayersRoster(el);
  }

  // ── 개요 (Team Overview) ─────────────────────────────────────
  function viewPlayersOverview(){
    const players = POOL.players;
    const n = players.length;
    const avg = arr => arr.length ? (arr.reduce((a,b)=>a+b,0) / arr.length) : 0;
    const avgAge = avg(players.map(p => p.age));
    const avgOvr = avg(players.map(p => p.ovr));
    const avgTal = avg(players.map(p => p.talent_avg));
    const foreign = players.filter(p => p.foreign).length;

    // 역할별 인원
    const byRole = {};
    players.forEach(p => { byRole[p.role] = (byRole[p.role]||0) + 1; });

    // 포지션별 인원
    const byPos = {};
    players.forEach(p => { byPos[p.position] = (byPos[p.position]||0) + 1; });

    // 최고 재능 5명
    const topTalent = players.slice().sort((a,b) => b.talent_avg - a.talent_avg).slice(0, 5);
    // 최고 OVR 5명
    const topOvr = players.slice().sort((a,b) => b.ovr - a.ovr).slice(0, 5);
    // 최연소 5명 (유망주)
    const youngest = players.slice().sort((a,b) => a.age - b.age).slice(0, 5);

    const summaryCards = [
      ['등록 인원', `${n}명`],

    const listItem = p => `<div class="dlist-row" data-route="/player/${p.id}" style="grid-template-columns:2fr 60px 60px 60px">

    </div>`;

    return `
      ${summaryHtml}
      <div class="card">
        <h2 class="section-title">역할 구성</h2>
        <div>${roleChips}</div>
      </div>
      <div class="card">
        <h2 class="section-title">포지션 구성</h2>
        <table style="width:100%;border-collapse:collapse;font-size:var(--text-sm)">
          <tbody>${posRows}</tbody>
        </table>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:var(--size-12)">
        <div class="card">
          <h2 class="section-title">현재 상위 (OVR)</h2>
          <div class="dlist" style="border:0"><div class="dlist-row head" style="grid-template-columns:2fr 60px 60px 60px"><div>선수</div><div>나이</div><div>OVR</div><div>재능</div></div>${topOvr.map(listItem).join('')}</div>
        </div>
        <div class="card">
          <h2 class="section-title">잠재 상위 (재능)</h2>
          <div class="dlist" style="border:0"><div class="dlist-row head" style="grid-template-columns:2fr 60px 60px 60px"><div>선수</div><div>나이</div><div>OVR</div><div>재능</div></div>${topTalent.map(listItem).join('')}</div>
        </div>
        <div class="card">
          <h2 class="section-title">최연소</h2>
          <div class="dlist" style="border:0"><div class="dlist-row head" style="grid-template-columns:2fr 60px 60px 60px"><div>선수</div><div>나이</div><div>OVR</div><div>재능</div></div>${youngest.map(listItem).join('')}</div>
        </div>
      </div>
    `;
  }

  // ── 로스터 (등록 상태별) ─────────────────────────────────────
  const rosterEditKey = () => teamKey('roster_overrides');
  function loadRosterOverrides(){
    try { return JSON.parse(localStorage.getItem(rosterEditKey())) || {}; }
    catch { return {}; }
  }
  function saveRosterOverrides(obj){
    try { localStorage.setItem(rosterEditKey(), JSON.stringify(obj)); } catch {}
  }
  function currentStatusOf(pid){
    const overrides = loadRosterOverrides();
    if (overrides[pid]) return overrides[pid];
    const r = (POOL.registrations || []).find(x => x.player === pid);
    return r ? r.status : 'active';
  }
  function setStatusOf(pid, status){
    const overrides = loadRosterOverrides();
    overrides[pid] = status;
    saveRosterOverrides(overrides);
  }

  function viewPlayersRoster(){
    const statuses = (POOL.league?.statuses) || [['active','액티브']];
    // 그룹핑
    const groups = {};
    statuses.forEach(([id]) => groups[id] = []);
    POOL.players.forEach(p => {
      const st = currentStatusOf(p.id);
      if (!groups[st]) groups[st] = [];
      groups[st].push(p);
    });
    const activeLimit = POOL.league?.roster_active_limit;
    const activeCount = groups['active']?.length || 0;
    const overLimit = activeLimit && activeCount > activeLimit;

    const statusOpts = statuses.map(([id,label]) => `<option value="${id}">${label}</option>`).join('');

    const groupHtml = statuses.map(([id, label]) => {
      const list = groups[id] || [];
      const isActive = id === 'active';
      const badge = isActive && activeLimit ? `<span style="margin-left:8px;color:${overLimit?'var(--neg)':'var(--text-muted)'};font-family:var(--font-mono);font-size:var(--text-xs)">${activeCount} / ${activeLimit}</span>` : '';
      const rows = list.map(p => `<div class="dlist-row" style="grid-template-columns:2fr 60px 60px 60px 120px">
        <div class="cell-primary" data-route="/player/${p.id}">${p.name} <span class="hand-marker">${p.position}</span></div>
        <div class="cell-num">${p.age}</div>
        <div class="cell-num">${p.ovr}</div>
        <div class="cell-num">${p.talent_avg}</div>
        <div>
          <select data-roster-set="${p.id}" style="width:100%;font-size:var(--text-xs)">
            ${statuses.map(([sid, slabel]) => `<option value="${sid}" ${currentStatusOf(p.id)===sid?'selected':''}>${slabel}</option>`).join('')}
          </select>
        </div>
      </div>`).join('');
      return `<div class="card">
        <h2 class="section-title">${label}${badge}</h2>
        ${list.length ? `<div class="dlist" style="border:0">
          <div class="dlist-row head" style="grid-template-columns:2fr 60px 60px 60px 120px">
            <div>선수</div><div>나이</div><div>OVR</div><div>재능</div><div>상태 변경</div>
          </div>
          ${rows}
        </div>` : `<div class="placeholder">비어 있음</div>`}
      </div>`;
    }).join('');

    return `
      <div class="filterbar" style="gap:var(--size-12)">
        <span style="font-size:var(--text-sm);color:var(--text-muted)">리그 규정: 액티브 ${activeLimit || '—'}명</span>
        ${overLimit ? `<span style="color:var(--neg);font-size:var(--text-sm)">액티브 한도 초과</span>` : ''}
      </div>
      ${groupHtml}
    `;
  }

  function bindPlayersRoster(el){
    el.querySelectorAll('[data-roster-set]').forEach(sel => {
      sel.addEventListener('change', e => {
        const pid = parseInt(sel.dataset.rosterSet, 10);
        setStatusOf(pid, e.target.value);
        renderContent(activeTab().route);
      });
    });
    el.querySelectorAll('[data-route]').forEach(el2 => {
      // 이미 bindRouteLinks에서 처리되지만 셀렉트 안엔 없으니 추가 없음
    });
  }

  function viewPlayers(){
    const st = listState.players;
    let items = POOL.players;
    if (st.role !== 'all') items = items.filter(p => p.role === st.role);
    if (st.search) {
      const q = st.search.toLowerCase();
      items = items.filter(p => p.name.toLowerCase().includes(q));
    }
    const sortKey = (p, by) => {
      if (by === 'age') return p.age;
      if (by === 'talent') return p.talent_avg;
      if (by === 'ovr') return p.ovr;
      if (by === 'position') return p.position;
      return p.name;
    };
    items = sortRows(items, st.sortBy, st.sortDir, sortKey);

    const th = (key, label) => {
      const active = st.sortBy === key;
      const arrow = !active ? '↕' : (st.sortDir === 'asc' ? '↑' : '↓');
      return `<span class="sort-th ${active?'active':''}" data-sort="${key}">${label}<span class="sort-indicator">${arrow}</span></span>`;
    };

    const rows = items.map(p => `
      <div class="dlist-row" data-route="/player/${p.id}">
        <div class="cell-primary">${p.name}<span class="hand-marker">${p.throws}/${p.bats}</span></div>
        <div>${p.position}</div>
        <div class="cell-num">${p.age}</div>
        <div class="cell-num">${p.ovr}</div>
        <div class="cell-num">${p.talent_avg}</div>
      </div>`).join('');

    const roles = Array.from(new Set(POOL.players.map(p => p.role)));
    const roleOpts = ['<option value="all">전체 역할</option>']
      .concat(roles.map(r => `<option value="${r}" ${st.role===r?'selected':''}>${r}</option>`))
      .join('');

    return `
      <div class="filterbar">
        <input type="search" class="search" placeholder="이름 검색" value="${st.search}" id="filter-search">
        <select id="filter-role">${roleOpts}</select>
        <span class="count">${items.length} / ${POOL.players.length}</span>
      </div>
      <div class="dlist">
        <div class="dlist-row head">
          <div>${th('name','이름')}</div>
          <div>${th('position','포지션')}</div>
          <div>${th('age','나이')}</div>
          <div>${th('ovr','현재')}</div>
          <div>${th('talent','재능')}</div>
        </div>
        ${rows.length ? rows : `<div class="dlist-row" style="cursor:default"><div style="grid-column:1/-1;text-align:center;color:var(--text-faint);padding:var(--size-16)">일치하는 선수 없음</div></div>`}
      </div>`;
  }

  function bindPlayersFilters(el){
    const st = listState.players;
    const search = el.querySelector('#filter-search');
    if (search) search.addEventListener('input', e => {
      st.search = e.target.value;
      renderContent(activeTab().route);
      // 검색 후 포커스 유지
      const s = document.getElementById('filter-search');
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    });
    const role = el.querySelector('#filter-role');
    if (role) role.addEventListener('change', e => {
      st.role = e.target.value;
      renderContent(activeTab().route);
    });
    el.querySelectorAll('.sort-th').forEach(t => {
      t.addEventListener('click', () => {
        const key = t.dataset.sort;
        if (st.sortBy === key) st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc';
        else { st.sortBy = key; st.sortDir = 'asc'; }
        renderContent(activeTab().route);
      });
    });
  }

  // 개인 훈련 옵션 — 라벨은 pool.constants.individual_trainings에서
  const IND_TRAININGS = C.individual_trainings.map(([key, label]) => ({ key, label }));
  const IND_KEY = pid => `indiv:${pid}`;
  function loadIndiv(pid){
    try { return JSON.parse(localStorage.getItem(IND_KEY(pid))) || ['none','none']; }
    catch { return ['none','none']; }
  }
  function saveIndiv(pid, arr){ try { localStorage.setItem(IND_KEY(pid), JSON.stringify(arr)); } catch {} }

  function viewPlayer(id){
    const p = POOL.players.find(x => String(x.id) === id);
    if (!p) return `<div class="placeholder">선수 ${id} 없음</div>`;

    // 헤더 정보 카드
    const foreignBadge = p.foreign ? `<span style="font-size:var(--text-xs);color:var(--text-muted);padding:2px 6px;border:1px solid var(--border);border-radius:var(--radius-s);margin-left:8px">외국인</span>` : '';
    const headerCards = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--size-8);margin-bottom:var(--size-16)">
      ${[
        ['등번호', `#${p.number}`],
        ['포지션', p.position],
        ['나이', `${p.age}세`],
        ['좌우', `${p.throws}/${p.bats}`],
        ['현재 (OVR)', p.ovr],
        ['재능', p.talent_avg],
      ].map(([k,v]) => `<div style="padding:var(--size-10) var(--size-12);border:1px solid var(--border);border-radius:var(--radius-s);background:var(--bg-secondary)">
        <div style="font-size:var(--text-xxs);color:var(--text-muted);letter-spacing:var(--tracking-wide);text-transform:uppercase;margin-bottom:2px">${k}</div>
        <div style="font-family:var(--font-mono);font-weight:var(--weight-semibold);color:var(--text-normal);font-size:var(--text-md)">${v}</div>
      </div>`).join('')}
    </div>`;

    const groupsHtml = ['bat','run','field','pitch','body'].map(g => {
      const items = POOL.ability_labels.filter(a => a[2] === g);
      if (!items.length) return '';
      const inner = items.map(([aid, label]) => `
        <div class="ability">
          <span class="ability-label">${label}</span>
          <span class="ability-value">${p.ability_display[aid] || '·'}</span>
        </div>`).join('');
      return `<div class="set-group">
        <h3 class="section-title">${SET_NAMES[g]}</h3>
        <div class="abilities">${inner}</div>
      </div>`;
    }).join('');

    // 개인 훈련 편집
    const indiv = loadIndiv(p.id);
    const trainingSlots = [0,1].map(slotIdx => {
      const cur = indiv[slotIdx];
      const opts = IND_TRAININGS.map(t => `<option value="${t.key}" ${cur===t.key?'selected':''}>${t.label}</option>`).join('');
      return `<div style="display:flex;align-items:center;gap:var(--size-8);margin-bottom:var(--size-6)">
        <span style="font-size:var(--text-xs);color:var(--text-muted);width:60px">자리 ${slotIdx+1}</span>
        <select data-indiv-slot="${slotIdx}" style="flex:1;max-width:280px">${opts}</select>
      </div>`;
    }).join('');

    return `
      <h1 class="page-title">${p.name}${foreignBadge}</h1>
      <p class="page-sub">${p.role} · ${p.position} · ${p.age}세</p>
      ${headerCards}
      <div class="card">
        <h2 class="section-title">능력</h2>
        ${groupsHtml}
      </div>
      <div class="card">
        <h2 class="section-title">개인 훈련 (자리 2)</h2>
        ${trainingSlots}
        <p style="font-size:var(--text-xs);color:var(--text-faint);margin-top:8px">브라우저에 저장. 매치엔진/성장 코어 연결은 다음 이터레이션.</p>
      </div>
      <div class="card">
        <h2 class="section-title">성장 곡선</h2>
        <div class="placeholder">season 통과 시뮬 결과 · 다음 이터레이션</div>
      </div>`;
  }

  function bindPlayerDetail(el, pid){
    el.querySelectorAll('[data-indiv-slot]').forEach(sel => {
      sel.addEventListener('change', e => {
        const slot = parseInt(sel.dataset.indivSlot, 10);
        const cur = loadIndiv(pid);
        cur[slot] = e.target.value;
        saveIndiv(pid, cur);
      });
    });
  }

  // 스태프 상태
  const staffState = { search:'', kind:'all', sortBy:'kind', sortDir:'asc' };

  // 능력 라벨 축약(리스트용): 마지막 단어 앞 두 글자 등 필요 시. 여기선 pool 라벨 그대로.
  const MAIN_ABILITY_LABEL = Object.fromEntries(
    C.staff_abilities.map(([id, label]) => [id, label.replace(/ (훈련|육성|부여)$/, '').trim()])
  );

  function viewStaffList(){
    const st = staffState;
    let items = POOL.staff.slice();
    if (st.kind !== 'all') items = items.filter(s => s.kind === st.kind);
    if (st.search) {
      const q = st.search.toLowerCase();
      items = items.filter(s => s.name.toLowerCase().includes(q));
    }
    const mainOf = s => s.abilities[KIND_MAIN_ABILITY[s.kind] || 'motivation'] || 1;
    const keyFn = (s, by) => {
      if (by === 'kind') return KIND_LABELS[s.kind] || s.kind;
      if (by === 'main') return mainOf(s);
      if (by === 'motiv') return s.abilities.motivation || 1;
      return s.name;
    };
    items = sortRows(items, st.sortBy, st.sortDir, keyFn);

    const th = (key, label) => {
      const active = st.sortBy === key;
      const arrow = !active ? '↕' : (st.sortDir === 'asc' ? '↑' : '↓');
      return `<span class="sort-th ${active?'active':''}" data-sort="${key}">${label}<span class="sort-indicator">${arrow}</span></span>`;
    };

    const rows = items.map(s => {
      const mainKey = KIND_MAIN_ABILITY[s.kind] || 'motivation';
      const mainVal = s.abilities[mainKey] || 1;
      const mainLabel = MAIN_ABILITY_LABEL[mainKey] || '';
      return `<div class="dlist-row" data-route="/staff/${s.id}" style="grid-template-columns:2fr 1.5fr 1fr 1fr 1fr">
        <div class="cell-primary">${s.name}</div>
        <div>${KIND_LABELS[s.kind] || s.kind}</div>
        <div class="cell-num">${mainLabel} ${mainVal}</div>
        <div class="cell-num">${s.abilities.motivation || '-'}</div>
        <div class="cell-num">—</div>
      </div>`;

    const kinds = Array.from(new Set(POOL.staff.map(s => s.kind)));
    const kindOpts = ['<option value="all">전체 직책</option>']
      .concat(kinds.map(k => `<option value="${k}" ${st.kind===k?'selected':''}>${KIND_LABELS[k]||k}</option>`))
      .join('');

    return `
      <div class="filterbar">

        <select id="staff-kind">${kindOpts}</select>
        <span class="count">${items.length} / ${POOL.staff.length}</span>
      </div>
      <div class="dlist">
        <div class="dlist-row head" style="grid-template-columns:2fr 1.5fr 1fr 1fr 1fr">
          <div>${th('name','이름')}</div>
          <div>${th('kind','직책')}</div>
          <div>${th('main','주 능력')}</div>
          <div>${th('motiv','동기')}</div>
          <div>배치</div>
        </div>
        ${rows}
      </div>`;
  }

  function bindStaffFilters(el){
    const search = el.querySelector('#staff-search');
    if (search) search.addEventListener('input', e => {
      staffState.search = e.target.value;
      renderContent(activeTab().route);
      const s = document.getElementById('staff-search');
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    });
    const kindSel = el.querySelector('#staff-kind');

      staffState.kind = e.target.value;
      renderContent(activeTab().route);
    });
    el.querySelectorAll('.sort-th').forEach(t => t.addEventListener('click', () => {
      const key = t.dataset.sort;

      else { staffState.sortBy = key; staffState.sortDir = 'asc'; }
      renderContent(activeTab().route);
    }));
  }

  function viewStaff(id){
    const s = POOL.staff.find(x => String(x.id) === id);
    if (!s) return `<div class="placeholder">스태프 ${id} 없음</div>`;
    const labels = STAFF_ABILITY_LABELS;
    const mainKey = KIND_MAIN_ABILITY[s.kind] || 'motivation';
    const abInner = Object.entries(labels).map(([k,l]) => {
      const isMain = k === mainKey;
      return `<div class="ability" style="${isMain?'border-color:var(--accent)':''}">
        <span class="ability-label">${l}${isMain?' <span style="font-size:var(--text-xxs);color:var(--accent);margin-left:4px">MAIN</span>':''}</span>
        <span class="ability-value">${s.abilities[k] || 1}</span>
      </div>`;
    }).join('');

    // 현재 배치 (훈련 슬롯 편집 상태에서 읽음)
    const trainAssign = loadTrainingAssign();
    const assignedCat = Object.entries(trainAssign).find(([cat, sid]) => sid === s.id);
    const assignedText = assignedCat
      ? `${CATEGORIES_TRAIN.find(c=>c.key===assignedCat[0])?.label || assignedCat[0]} 슬롯에 배치됨`
      : '현재 배치 없음';

    return `
      <h1 class="page-title">${s.name}</h1>
      <p class="page-sub">${KIND_LABELS[s.kind] || s.kind}</p>

        <div class="abilities">${abInner}</div>
      </div>
      <div class="card">
        <h2 class="section-title">배치</h2>
        <p style="font-size:var(--text-sm);color:var(--text-normal)">${assignedText}</p>
        <p style="font-size:var(--text-xs);color:var(--text-faint);margin-top:6px">배치 편집은 <a class="crumb" style="display:inline;padding:2px 4px" data-route="/training">훈련</a>에서.</p>
      </div>`;
  }

  // ── 편성 (Selection) ─────────────────────────────────────────
  const SELECTION_TABS = [
    { key:'lineup',   label:'라인업', active:true },
    { key:'rotation', label:'로테이션', active:true },
    { key:'bullpen',  label:'불펜', active:true },
    { key:'depth',    label:'뎁스 차트', active:true },
  ];

  // 팀 컨텍스트 키. 나중에 다른 팀 지원 시 자동 분리.
  function teamKey(kind){
    return `${kind}:${POOL.team.franchise}:${POOL.team.season}`;
  }
  const lineupState = { versus: 'rhp' };  // 'rhp' or 'lhp'

  // selection crate JSON 직렬화와 일치. slots 안엔 order·player·position.
  function loadLineup(versus){
    try {
      const raw = localStorage.getItem(teamKey(`lineup:${versus}`));
      if (!raw) return new Array(C.lineup_size).fill(null);
      const obj = JSON.parse(raw);
      if (Array.isArray(obj)) return obj;  // 이전 형식 호환
      return obj.slots.map(s => s.player ?? null);
    } catch { return new Array(C.lineup_size).fill(null); }
  }
  function saveLineup(versus, arr){
    const slots = arr.map((pid, i) => ({
      order: i + 1,
      player: pid ?? null,
      position: pid != null ? (POOL.players.find(p => p.id === pid)?.position || null) : null,
    }));
    const payload = {
      team: { franchise: POOL.team.franchise, season: POOL.team.season },
      versus,
      slots,
    };
    try { localStorage.setItem(teamKey(`lineup:${versus}`), JSON.stringify(payload)); } catch {}
  }

  function isPositionPlayer(p){
    // 투수는 라인업 후보에서 제외 (DH 리그니까 야수만)
    return p.role !== '투수' && p.position !== 'SP' && p.position !== 'RP';
  }

  function viewSelection(sub){
    const subtabs = SELECTION_TABS.map(t =>
      `<a class="subtab ${t.key===sub?'active':''}" data-route="/selection/${t.key}">${t.label}${t.active?'':' <span style="opacity:.4">(준비 중)</span>'}</a>`
    ).join('');
    let body = '';
    if (sub === 'lineup') body = viewLineup();
    else if (sub === 'rotation') body = viewRotation();
    else if (sub === 'bullpen') body = viewBullpen();
    else if (sub === 'depth') body = viewDepth();
    else body = `<div class="placeholder">${SELECTION_TABS.find(t=>t.key===sub)?.label || sub}</div>`;
    return `<div class="subtabs">${subtabs}</div>${body}`;
  }

  function viewLineup(){
    const versus = lineupState.versus;
    const arr = loadLineup(versus);
    const used = new Set(arr.filter(Boolean));

    const slotHtml = arr.map((pid, idx) => {
      const p = pid != null ? POOL.players.find(x => x.id === pid) : null;
      const orderNum = idx + 1;
      if (!p) {
        return `<div class="lineup-slot empty" data-slot="${idx}">
          <div class="slot-order">${orderNum}</div>
          <div class="slot-pos">—</div>
          <div class="slot-name">비어 있음</div>
          <div></div>
        </div>`;
      }
      return `<div class="lineup-slot" data-slot="${idx}">
        <div class="slot-order">${orderNum}</div>
        <div class="slot-pos">${p.position}</div>
        <div class="slot-name">${p.name} <span class="hand-marker">${p.throws}/${p.bats}</span></div>
        <button class="slot-clear" data-clear="${idx}" title="비우기">×</button>
      </div>`;
    }).join('');

    const eligible = POOL.players.filter(isPositionPlayer);
    const pickerItems = eligible.map(p => {
      const isUsed = used.has(p.id);
      return `<div class="picker-item ${isUsed?'used':''}" data-pick="${p.id}">
        <div class="pi-pos">${p.position}</div>
        <div class="pi-name">${p.name}</div>
        <div class="pi-ovr">${p.ovr}</div>
      </div>`;
    }).join('');

    return `
      <div class="filterbar" style="justify-content:flex-start;gap:8px">
        <span style="font-size:var(--text-sm);color:var(--text-muted)">상대 투수</span>
        <button class="button ${versus==='rhp'?'button-primary':''}" data-versus="rhp">우투수</button>
        <button class="button ${versus==='lhp'?'button-primary':''}" data-versus="lhp">좌투수</button>
        <span class="count">${arr.filter(Boolean).length}/9</span>
      </div>
      <div class="lineup-wrap">
        <div class="lineup-list">${slotHtml}</div>
        <div class="picker">
          <h3 class="picker-title">야수 (${eligible.length})</h3>
          <p class="picker-hint">슬롯을 클릭하고 선수를 골라 배치. 이미 배치된 선수는 흐리게.</p>
          <div class="picker-list">${pickerItems}</div>
        </div>
      </div>
    `;
  }

  // ── 로테이션 (선발 5) ─────────────────────────────────────────
  function loadRotation(){
    try {
      const raw = localStorage.getItem(teamKey('rotation'));
      if (!raw) return new Array(C.rotation_size).fill(null);
      const obj = JSON.parse(raw);
      if (Array.isArray(obj)) return obj;
      return obj.starters || new Array(C.rotation_size).fill(null);
    } catch { return new Array(C.rotation_size).fill(null); }
  }
  function saveRotation(arr){
    const payload = {
      team: { franchise: POOL.team.franchise, season: POOL.team.season },
      starters: arr.map(x => x ?? null),
    };
    try { localStorage.setItem(teamKey('rotation'), JSON.stringify(payload)); } catch {}
  }
  function isSP(p){ return p.position === 'SP'; }

  function viewRotation(){
    const arr = loadRotation();
    const used = new Set(arr.filter(Boolean));
    const rotationLabels = ['1선발','2선발','3선발','4선발','5선발'];
    const slotHtml = arr.map((pid, idx) => {
      const p = pid != null ? POOL.players.find(x => x.id === pid) : null;
      if (!p) return `<div class="lineup-slot empty" data-slot="${idx}">
        <div class="slot-order">${idx+1}</div>
        <div class="slot-pos">${rotationLabels[idx]}</div>
        <div class="slot-name">비어 있음</div>
        <div></div>
      </div>`;
      return `<div class="lineup-slot" data-slot="${idx}">
        <div class="slot-order">${idx+1}</div>
        <div class="slot-pos">${rotationLabels[idx]}</div>
        <div class="slot-name">${p.name} <span class="hand-marker">${p.throws}/${p.bats}</span></div>
        <button class="slot-clear" data-clear="${idx}" title="비우기">×</button>
      </div>`;
    }).join('');

    const eligible = POOL.players.filter(isSP);
    const pickerItems = eligible.map(p => {
      const isUsed = used.has(p.id);
      return `<div class="picker-item ${isUsed?'used':''}" data-pick="${p.id}">
        <div class="pi-pos">SP</div>
        <div class="pi-name">${p.name}</div>
        <div class="pi-ovr">${p.ovr}</div>
      </div>`;
    }).join('');

    return `
      <div class="filterbar" style="justify-content:flex-start">
        <span class="count">${arr.filter(Boolean).length}/5</span>
      </div>
      <div class="rotation-wrap">
        <div class="lineup-list">${slotHtml}</div>
        <div class="picker">
          <h3 class="picker-title">선발 후보 (${eligible.length})</h3>
          <p class="picker-hint">슬롯을 클릭하고 선수를 골라 배치.</p>
          <div class="picker-list">${pickerItems}</div>
        </div>
      </div>
    `;
  }

  // ── 불펜 (역할별) ──────────────────────────────────────────────
  const BULLPEN_ROLES = C.bullpen_roles.map(([key, label, short]) => ({ key, label, short }));
  function loadBullpen(){
    try {
      const raw = JSON.parse(localStorage.getItem(teamKey('bullpen'))) || {};
      // 새 형식: { team, by_role }. 이전 형식: { closer:[], ... }
      const map = raw.by_role || raw;
      const out = {};
      BULLPEN_ROLES.forEach(r => out[r.key] = Array.isArray(map[r.key]) ? map[r.key] : []);
      return out;
    } catch {
      const out = {}; BULLPEN_ROLES.forEach(r => out[r.key] = []); return out;
    }
  }
  function saveBullpen(obj){
    const payload = {
      team: { franchise: POOL.team.franchise, season: POOL.team.season },
      by_role: obj,
    };
    try { localStorage.setItem(teamKey('bullpen'), JSON.stringify(payload)); } catch {}
  }
  function isRP(p){ return p.position === 'RP'; }

  function viewBullpen(){
    const state = loadBullpen();
    const usedAll = new Set(Object.values(state).flat());
    const rolesHtml = BULLPEN_ROLES.map(r => {
      const members = state[r.key];
      const chips = members.map(pid => {
        const p = POOL.players.find(x => x.id === pid);
        if (!p) return '';
        return `<span class="bullpen-chip">${p.name} <span class="hand-marker">${p.throws}</span> <span class="bullpen-chip-x" data-bpx="${r.key}:${pid}">×</span></span>`;
      }).join('');
      return `<div class="bullpen-role">
        <div class="bullpen-role-head">
          <div><span class="bullpen-role-name">${r.short}</span> <span style="color:var(--text-muted);font-size:var(--text-sm);margin-left:6px">${r.label}</span></div>
          <div class="bullpen-role-count">${members.length}명 · 클릭해 여기에 추가</div>
        </div>
        <div class="bullpen-members" data-role-target="${r.key}">
          ${chips || `<div class="bullpen-empty">비어 있음</div>`}
        </div>
      </div>`;
    }).join('');

    const eligible = POOL.players.filter(isRP);
    const pickerItems = eligible.map(p => {
      const isUsed = usedAll.has(p.id);
      return `<div class="picker-item ${isUsed?'used':''}" data-pick="${p.id}">
        <div class="pi-pos">RP</div>
        <div class="pi-name">${p.name}</div>
        <div class="pi-ovr">${p.ovr}</div>
      </div>`;
    }).join('');

    const totalAssigned = Object.values(state).flat().length;
    return `
      <div class="filterbar" style="justify-content:flex-start">
        <span class="count">${totalAssigned}명 배치</span>
      </div>
      <div class="bullpen-wrap">
        <div class="bullpen-list">${rolesHtml}</div>
        <div class="picker">
          <h3 class="picker-title">구원 투수 (${eligible.length})</h3>
          <p class="picker-hint">역할 영역을 먼저 클릭하고 선수를 골라 추가. 다시 다른 역할로 옮기면 자동 이동.</p>
          <div class="picker-list">${pickerItems}</div>
        </div>
      </div>
    `;
  }

  // ── 뎁스 차트 ─────────────────────────────────────────────────
  const DEPTH_POSITIONS = C.offensive_positions.map(id => ({ key: id, label: POSITION_LABELS[id] || id }));
  const DEPTH_RANKS = C.depth_ranks.map(([id, label]) => label);
  const DEPTH_RANK_IDS = C.depth_ranks.map(([id]) => id);
  function loadDepth(){
    try {
      const raw = JSON.parse(localStorage.getItem(teamKey('depth_chart'))) || {};
      const map = raw.by_position || raw;
      const out = {};
      DEPTH_POSITIONS.forEach(pos => {
        out[pos.key] = Array.isArray(map[pos.key]) ? map[pos.key].slice(0,3) : [null,null,null];
        while (out[pos.key].length < 3) out[pos.key].push(null);
      });
      return out;
    } catch {
      const out = {}; DEPTH_POSITIONS.forEach(pos => out[pos.key] = [null,null,null]); return out;
    }
  }
  function saveDepth(obj){
    const payload = {
      team: { franchise: POOL.team.franchise, season: POOL.team.season },
      by_position: obj,
    };
    try { localStorage.setItem(teamKey('depth_chart'), JSON.stringify(payload)); } catch {}
  }

  function viewDepth(){
    const state = loadDepth();
    const positionsHtml = DEPTH_POSITIONS.map(pos => {
      const slots = state[pos.key].map((pid, rankIdx) => {
        const p = pid != null ? POOL.players.find(x => x.id === pid) : null;
        if (!p) return `<div class="depth-slot empty" data-depth-slot="${pos.key}:${rankIdx}">
          <div class="depth-rank">${DEPTH_RANKS[rankIdx]}</div>
          <div>비어 있음</div>
          <div></div>
        </div>`;
        return `<div class="depth-slot" data-depth-slot="${pos.key}:${rankIdx}">
          <div class="depth-rank">${DEPTH_RANKS[rankIdx]}</div>
          <div>${p.name} <span class="hand-marker">${p.throws}/${p.bats}</span></div>
          <button class="depth-clear" data-depth-clear="${pos.key}:${rankIdx}" title="비우기">×</button>
        </div>`;
      }).join('');
      return `<div class="depth-pos">
        <div class="depth-pos-head">
          <div class="depth-pos-label">${pos.key}</div>
          <div class="depth-pos-name">${pos.label}</div>
        </div>
        <div class="depth-slots">${slots}</div>
      </div>`;
    }).join('');

    const eligible = POOL.players.filter(isPositionPlayer);
    const pickerItems = eligible.map(p => `
      <div class="picker-item" data-pick="${p.id}">
        <div class="pi-pos">${p.position}</div>
        <div class="pi-name">${p.name}</div>
        <div class="pi-ovr">${p.ovr}</div>
      </div>`).join('');

    return `
      <div class="filterbar" style="justify-content:flex-start">
        <span style="font-size:var(--text-sm);color:var(--text-muted)">포지션별 주전·백업·긴급</span>
      </div>
      <div class="depth-wrap">
        <div class="depth-list">${positionsHtml}</div>
        <div class="picker">
          <h3 class="picker-title">야수 (${eligible.length})</h3>
          <p class="picker-hint">슬롯을 클릭한 뒤 선수를 골라 배치. 한 선수가 여러 포지션 백업으로 등록될 수 있음.</p>
          <div class="picker-list">${pickerItems}</div>
        </div>
      </div>
    `;
  }

  // ── 편성 이벤트 바인딩 (라인업·로테이션·불펜·뎁스 공용) ─────
  let selectedSlot = null;         // for lineup/rotation
  let selectedBullpenRole = null;
  let selectedDepthSlot = null;    // "POS:rank"

  function bindSelection(el, sub){
    // 서브탭 라우팅은 bindRouteLinks가 처리.
    if (sub === 'lineup') return bindLineup(el);
    if (sub === 'rotation') return bindRotation(el);
    if (sub === 'bullpen') return bindBullpen(el);
    if (sub === 'depth') return bindDepth(el);
  }

  function bindLineup(el){
    el.querySelectorAll('[data-versus]').forEach(b => b.addEventListener('click', () => {
      lineupState.versus = b.dataset.versus; selectedSlot = null;
      renderContent(activeTab().route);
    }));
    el.querySelectorAll('.lineup-slot').forEach(s => s.addEventListener('click', e => {
      if (e.target.dataset.clear) return;
      selectedSlot = parseInt(s.dataset.slot, 10);
      el.querySelectorAll('.lineup-slot').forEach(x => x.style.borderColor = '');
      s.style.borderColor = 'var(--accent)';
    }));
    el.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(b.dataset.clear, 10);
      const arr = loadLineup(lineupState.versus);
      arr[idx] = null;
      saveLineup(lineupState.versus, arr);
      renderContent(activeTab().route);
    }));
    el.querySelectorAll('[data-pick]').forEach(item => item.addEventListener('click', () => {
      const pid = parseInt(item.dataset.pick, 10);
      const arr = loadLineup(lineupState.versus);
      if (selectedSlot == null) {
        const empty = arr.findIndex(x => x == null);
        if (empty < 0) return;
        selectedSlot = empty;
      }
      for (let i = 0; i < arr.length; i++) if (arr[i] === pid) arr[i] = null;
      arr[selectedSlot] = pid;
      saveLineup(lineupState.versus, arr);
      selectedSlot = null;
      renderContent(activeTab().route);
    }));
  }

  function bindRotation(el){
    el.querySelectorAll('.lineup-slot').forEach(s => s.addEventListener('click', e => {
      if (e.target.dataset.clear) return;
      selectedSlot = parseInt(s.dataset.slot, 10);
      el.querySelectorAll('.lineup-slot').forEach(x => x.style.borderColor = '');
      s.style.borderColor = 'var(--accent)';
    }));
    el.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(b.dataset.clear, 10);
      const arr = loadRotation();
      arr[idx] = null; saveRotation(arr);
      renderContent(activeTab().route);
    }));
    el.querySelectorAll('[data-pick]').forEach(item => item.addEventListener('click', () => {
      const pid = parseInt(item.dataset.pick, 10);
      const arr = loadRotation();
      if (selectedSlot == null) {
        const empty = arr.findIndex(x => x == null);
        if (empty < 0) return;
        selectedSlot = empty;
      }
      for (let i = 0; i < arr.length; i++) if (arr[i] === pid) arr[i] = null;
      arr[selectedSlot] = pid;
      saveRotation(arr);
      selectedSlot = null;
      renderContent(activeTab().route);
    }));
  }

  function bindBullpen(el){
    // 역할 영역 클릭 = 대상 지정
    el.querySelectorAll('[data-role-target]').forEach(area => area.addEventListener('click', () => {
      selectedBullpenRole = area.dataset.roleTarget;
      el.querySelectorAll('.bullpen-role').forEach(r => r.style.borderColor = '');
      area.closest('.bullpen-role').style.borderColor = 'var(--accent)';
    }));
    // 칩 × 제거
    el.querySelectorAll('[data-bpx]').forEach(x => x.addEventListener('click', e => {
      e.stopPropagation();
      const [role, pidStr] = x.dataset.bpx.split(':');
      const pid = parseInt(pidStr, 10);
      const state = loadBullpen();
      state[role] = state[role].filter(id => id !== pid);
      saveBullpen(state);
      renderContent(activeTab().route);
    }));
    // 픽커 = 선택 역할에 추가 (다른 역할에서 자동 제거)
    el.querySelectorAll('[data-pick]').forEach(item => item.addEventListener('click', () => {
      const pid = parseInt(item.dataset.pick, 10);
      const state = loadBullpen();
      if (!selectedBullpenRole) {
        // 미선택 시 middle에 추가
        selectedBullpenRole = 'middle';
      }
      // 어느 역할에 있으면 제거
      BULLPEN_ROLES.forEach(r => { state[r.key] = state[r.key].filter(id => id !== pid); });
      state[selectedBullpenRole].push(pid);
      saveBullpen(state);
      renderContent(activeTab().route);
    }));
  }

  function bindDepth(el){
    el.querySelectorAll('.depth-slot').forEach(s => s.addEventListener('click', e => {
      if (e.target.dataset.depthClear) return;
      selectedDepthSlot = s.dataset.depthSlot;
      el.querySelectorAll('.depth-slot').forEach(x => x.style.borderColor = '');
      s.style.borderColor = 'var(--accent)';
    }));
    el.querySelectorAll('[data-depth-clear]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const [pos, rankStr] = b.dataset.depthClear.split(':');
      const rank = parseInt(rankStr, 10);
      const state = loadDepth();
      state[pos][rank] = null;
      saveDepth(state);
      renderContent(activeTab().route);
    }));
    el.querySelectorAll('[data-pick]').forEach(item => item.addEventListener('click', () => {
      if (!selectedDepthSlot) return;
      const pid = parseInt(item.dataset.pick, 10);
      const [pos, rankStr] = selectedDepthSlot.split(':');
      const rank = parseInt(rankStr, 10);
      const state = loadDepth();
      // 같은 포지션 안에서만 중복 제거 (다른 포지션 백업 허용)
      for (let i = 0; i < 3; i++) if (state[pos][i] === pid) state[pos][i] = null;
      state[pos][rank] = pid;
      saveDepth(state);
      selectedDepthSlot = null;
      renderContent(activeTab().route);
    }));
  }

  // 훈련 카테고리 — pool.constants.categories에서
  const CATEGORIES_TRAIN = C.categories.map(([key, label, kind, ability]) => ({ key, label, kind, ability }));
  const TRAIN_KEY = 'training_assign';
  function loadTrainingAssign(){
    try { return JSON.parse(localStorage.getItem(TRAIN_KEY)) || {}; } catch { return {}; }
  }
  function saveTrainingAssign(obj){ try { localStorage.setItem(TRAIN_KEY, JSON.stringify(obj)); } catch {} }

  function viewTraining(){
    const assign = loadTrainingAssign();
    const cards = CATEGORIES_TRAIN.map(s => {
      const coaches = POOL.staff.filter(x => x.kind === s.kind);
      const curId = assign[s.key];
      const cur = curId != null ? POOL.staff.find(c => c.id === curId) : null;
      const opts = ['<option value="">(비어 있음)</option>'].concat(
        coaches.map(c => `<option value="${c.id}" ${cur && cur.id===c.id?'selected':''}>${c.name} (${c.abilities[s.ability]||1})</option>`)
      ).join('');
      const abilityVal = cur ? (cur.abilities[s.ability] || 1) : 0;
      const stars = cur ? starOf(abilityVal) : 1;
      const env = STAR_ENV[stars];
      return `<div class="slot">
        <div class="slot-label">${s.label}</div>
        <select data-slot="${s.key}">${opts}</select>
        <div class="slot-meta">${cur ? `능력 ${abilityVal} · ${stars}성 · env ${env.toFixed(2)}` : '비어 있음 · 1성 · env 0.85'}</div>
      </div>`;
    }).join('');

    const summary = CATEGORIES_TRAIN.map(s => {
      const curId = assign[s.key];
      const cur = curId != null ? POOL.staff.find(c => c.id === curId) : null;
      const stars = cur ? starOf(cur.abilities[s.ability] || 1) : 1;
      const motivStars = cur ? starOf(cur.abilities.motivation || 1) : 1;
      return `<tr>
        <td style="padding:6px 12px;color:var(--text-muted)">${s.label}</td>
        <td style="padding:6px 12px">${cur ? cur.name : '—'}</td>
        <td style="padding:6px 12px;font-family:var(--font-mono);text-align:right">${stars}성</td>
        <td style="padding:6px 12px;font-family:var(--font-mono);text-align:right">${STAR_ENV[stars].toFixed(2)}</td>
        <td style="padding:6px 12px;font-family:var(--font-mono);text-align:right">${motivStars}성</td>
      </tr>`;
    }).join('');

    return `
      <p class="page-sub">팀 훈련 5슬롯 · 코치 배치 → 별점 → 환경 요인 계산</p>
      <div class="slots">${cards}</div>
      <div class="card" style="margin-top: var(--size-16)">
        <h2 class="section-title">결과 요약</h2>
        <table style="width:100%;border-collapse:collapse;font-size:var(--text-sm)">
          <thead>
            <tr style="color:var(--text-muted);text-align:left">
              <th style="padding:6px 12px;font-weight:var(--weight-medium);font-size:var(--text-xs);text-transform:uppercase">카테고리</th>
              <th style="padding:6px 12px;font-weight:var(--weight-medium);font-size:var(--text-xs);text-transform:uppercase">배치</th>
              <th style="padding:6px 12px;font-weight:var(--weight-medium);font-size:var(--text-xs);text-transform:uppercase;text-align:right">별점</th>
              <th style="padding:6px 12px;font-weight:var(--weight-medium);font-size:var(--text-xs);text-transform:uppercase;text-align:right">환경 요인</th>
              <th style="padding:6px 12px;font-weight:var(--weight-medium);font-size:var(--text-xs);text-transform:uppercase;text-align:right">동기</th>
            </tr>
          </thead>
          <tbody>${summary}</tbody>
        </table>
        <p style="font-size:var(--text-xs);color:var(--text-faint);margin-top:12px">별점→env: 1성 0.85 · 3성 1.00 · 5성 1.15. 이 값이 성장 코어의 env 요인이 됩니다.</p>
      </div>`;
  }

  function bindTraining(el){
    el.querySelectorAll('[data-slot]').forEach(sel => {
      sel.addEventListener('change', e => {
        const slot = sel.dataset.slot;
        const val = e.target.value;
        const assign = loadTrainingAssign();
        if (val === '') delete assign[slot];
        else {
          const numVal = parseInt(val, 10);
          Object.keys(assign).forEach(k => { if (assign[k] === numVal) delete assign[k]; });
          assign[slot] = numVal;
        }
        saveTrainingAssign(assign);
        renderContent(activeTab().route);
      });
    });
  }

  document.getElementById('nav-back').addEventListener('click', goBack);
  document.getElementById('nav-forward').addEventListener('click', goForward);
  window.toggleSidebar = () => document.getElementById('app').classList.toggle('sidebar-collapsed');
  window.advanceYear = () => alert('시즌 진행 · 다음 이터레이션');
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
    if ((e.metaKey || e.ctrlKey) && e.key === 'ArrowRight') { e.preventDefault(); goForward(); }
  });

  // 팀·시즌 표시
  if (POOL.team) {
    document.getElementById('topbar-team').textContent = POOL.team.name;
    document.getElementById('topbar-season').textContent = `${POOL.team.season} 시즌`;
  }

  openTab('/players');
})();
</script>
</body></html>
