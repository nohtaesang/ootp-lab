  function bindRouteLinks(root){
    root.querySelectorAll('[data-route]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        switchTo(a.dataset.route, { newTab: e.metaKey || e.ctrlKey });
      });
    });
  }

  // 리스트 상태 (검색·필터·정렬)
  const listState = {
    players: { search: '', role: 'all', sortBy: 'name', sortDir: 'asc' },
    staff:   { search: '', kind: 'all', sortBy: 'name', sortDir: 'asc' },
  };

  function sortRows(items, sortBy, sortDir, keyFn){
    const dir = sortDir === 'asc' ? 1 : -1;
    return items.slice().sort((a,b) => {
      const va = keyFn(a, sortBy), vb = keyFn(b, sortBy);
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va).localeCompare(String(vb), 'ko') * dir;
    });
  }

  function viewPlayersHub(sub){
    const subtabs = PLAYERS_SUBTABS.map(t =>
      `<a class="subtab ${t.key===sub?'active':''}" data-route="/players/${t.key}">${t.label}</a>`
    ).join('');
    let body = '';
    if (sub === 'overview') body = viewPlayersOverview();
    else if (sub === 'list') body = viewPlayers();
    else if (sub === 'roster') body = viewPlayersRoster();
    else body = `<div class="placeholder">알 수 없는 뷰: ${sub}</div>`;
    return `<div class="subtabs">${subtabs}</div>${body}`;
  }

  function bindPlayersHub(el, sub){
    // 서브탭은 data-route를 가져 bindRouteLinks가 이미 처리. 중복 리스너 제거.
    if (sub === 'list') bindPlayersFilters(el);
    if (sub === 'roster') bindPlayersRoster(el);
  }

  // ── 개요 (Team Overview) ─────────────────────────────────────
  function viewPlayersOverview(){
    const players    = POOL.players;
    const constants  = POOL.constants || {};
    const league     = POOL.league || {};
    const positions  = constants.positions || [];
    const offPos     = constants.offensive_positions || [];
    const posLabelOf = id => (positions.find(p => p[0] === id) || [id, id])[1];
    const abilityLabels = POOL.ability_labels || [];

    const n = players.length;
    const batters  = players.filter(p => p.role === '야수');
    const pitchers = players.filter(p => p.role === '투수');
    const foreign  = players.filter(p => p.foreign).length;
    const rosterLimit  = league.roster_active_limit || 0;
    const foreignLimit = league.foreign_max || 0;

    // ── 부문별 전력 (bat/pitch/field/run/body) ──
    const catFilter = {
      bat:   p => p.role === '야수',
      pitch: p => p.role === '투수',
      field: p => p.role === '야수',
      run:   p => p.role === '야수',
      body:  () => true,
    };
    const catLabels = { bat:'타격', pitch:'투구', field:'수비', run:'주루', body:'체력' };
    const catAbilities = {};
    abilityLabels.forEach(([key, _label, cat]) => {
      (catAbilities[cat] = catAbilities[cat] || []).push(key);
    });
    const catStats = Object.keys(catLabels).map(cat => {
      const target = players.filter(catFilter[cat] || (() => true));
      const abilities = catAbilities[cat] || [];
      let sum = 0, cnt = 0;
      target.forEach(p => {
        abilities.forEach(k => {
          const v = p.ability_display && p.ability_display[k];
          if (typeof v === 'number') { sum += v; cnt++; }
        });
      });
      return { cat, label: catLabels[cat], avg: cnt ? sum / cnt : 0 };
    });
    const powerMax = Math.max(...catStats.map(x => x.avg), 1);
    const sortedCat = catStats.slice().sort((a,b) => b.avg - a.avg);
    const strong = sortedCat[0];
    const weak = sortedCat[sortedCat.length - 1];

    // ── 포지션 커버리지 ──
    const listByPos = id => players.filter(p => p.position === id).sort((a,b) => b.ovr - a.ovr);
    const offRows = offPos.map(id => {
      const list = listByPos(id);
      const starter = list[0] || null;
      const backup  = list[1] || null;
      let status = 'good';
      if (!starter) status = 'empty';
      else if (!backup) status = 'need-backup';
      return { id, label: posLabelOf(id), starter, backup, status };
    });
    const rotation = listByPos('SP').slice(0, 5);
    const bullpen  = listByPos('RP').slice(0, 5);
    const rotationLack = Math.max(0, 5 - rotation.length);

    // ── 핵심 선수 · 육성 후보 (겹침 제거) ──
    const key3 = players.slice().sort((a,b) => b.ovr - a.ovr).slice(0, 3);
    const keyIds = new Set(key3.map(p => p.id));
    const dev3 = players
      .filter(p => p.age <= 25 && !keyIds.has(p.id))
      .sort((a,b) => b.talent_avg - a.talent_avg)
      .slice(0, 3);

    // ── 접이식 구성 통계 ──
    const avgAge = n ? players.reduce((s,p) => s + p.age, 0) / n : 0;
    const leftThrows = pitchers.filter(p => p.throws === 'L').length;
    const leftBats   = batters.filter(p => p.bats === 'L' || p.bats === 'S').length;
    const buckets = [
      { label:'20세 이하', test: p => p.age <= 20 },
      { label:'21~25세',  test: p => p.age >= 21 && p.age <= 25 },
      { label:'26~30세',  test: p => p.age >= 26 && p.age <= 30 },
      { label:'31~35세',  test: p => p.age >= 31 && p.age <= 35 },
      { label:'36세 이상', test: p => p.age >= 36 },
    ].map(b => ({...b, count: players.filter(b.test).length}));
    const ageMax = Math.max(1, ...buckets.map(x => x.count));

    // ── Render helpers ──
    const playerLink = p => p
      ? `<a class="cov-name" data-route="/player/${p.id}">${p.name}<span class="cov-ovr">${p.ovr}</span></a>`
      : `<span class="cov-empty">—</span>`;
    const statusLabel = { good:'충분', 'need-backup':'백업 필요', empty:'공백' };

    const powerCells = catStats.map(c => `
      <div class="power-cell">
        <div class="power-label">${c.label}</div>
        <div class="power-value">${c.avg.toFixed(1)}</div>
        <div class="power-bar"><div class="power-fill" style="width:${(c.avg/powerMax*100).toFixed(0)}%"></div></div>
      </div>`).join('');

    const covRows = offRows.map(r => `
      <tr>
        <td class="cov-code">${r.id}</td>
        <td class="cov-pos">${r.label}</td>
        <td>${playerLink(r.starter)}</td>
        <td>${playerLink(r.backup)}</td>
        <td><span class="cov-status status-${r.status}">${statusLabel[r.status]}</span></td>
      </tr>`).join('');

    const rotationLine = rotation.length
      ? rotation.map(playerLink).join('<span class="cov-sep">·</span>')
      : '<span class="cov-empty">없음</span>';
    const bullpenLine  = bullpen.length
      ? bullpen.map(playerLink).join('<span class="cov-sep">·</span>')
      : '<span class="cov-empty">없음</span>';

    const miniItem = (p, metric) => `
      <a class="mini-player" data-route="/player/${p.id}">
        <span class="mini-name">${p.name}</span>
        <span class="mini-meta">${p.position} · ${p.age}세</span>
        <span class="mini-value">${metric}</span>
      </a>`;
    const keyList = key3.map(p => miniItem(p, p.ovr)).join('');
    const devList = dev3.length
      ? dev3.map(p => miniItem(p, p.talent_avg)).join('')
      : '<div class="cov-empty" style="padding:var(--size-6)">25세 이하 선수 없음</div>';

    const ageBars = buckets.map(b => `
      <div class="dist-row">
        <span class="dist-label">${b.label}</span>
        <div class="dist-bar"><div class="dist-fill" style="width:${b.count/ageMax*100}%"></div></div>
        <span class="dist-count">${b.count}</span>
      </div>`).join('');

    return `
      <div class="home-page">
        <header class="home-header">
          <div>
            <h1 class="home-title">선수단 개요</h1>
            <p class="home-subtitle">부문 전력 · 포지션 커버리지 · 핵심 인물</p>
          </div>
          <div class="home-header-meta">
            <span class="home-meta-item"><span class="home-meta-label">등록</span><b class="${rosterLimit && n > rosterLimit ? 'meta-over' : ''}">${n}${rosterLimit ? ` <span class="meta-of">/ ${rosterLimit}</span>` : ''}</b></span>
            <span class="home-meta-item"><span class="home-meta-label">야수</span><b>${batters.length}</b></span>
            <span class="home-meta-item"><span class="home-meta-label">투수</span><b>${pitchers.length}</b></span>
            <span class="home-meta-item"><span class="home-meta-label">외국인</span><b class="${foreignLimit && foreign > foreignLimit ? 'meta-over' : ''}">${foreign}${foreignLimit ? ` <span class="meta-of">/ ${foreignLimit}</span>` : ''}</b></span>
          </div>
        </header>

        <section class="home-grid">
          <article class="home-card home-card-wide">
            <h3>부문별 전력</h3>
            <div class="power-grid">${powerCells}</div>
            <p class="power-summary">강점 <b>${strong.label}</b> ${strong.avg.toFixed(1)} · 약점 <b>${weak.label}</b> ${weak.avg.toFixed(1)}</p>
          </article>

          <article class="home-card home-card-wide">
            <h3>포지션 커버리지 · 야수</h3>
            <table class="cov-table">
              <thead><tr><th>코드</th><th>포지션</th><th>주전</th><th>백업</th><th>상태</th></tr></thead>
              <tbody>${covRows}</tbody>
            </table>
          </article>

          <article class="home-card home-card-wide">
            <h3>포지션 커버리지 · 투수</h3>
            <div class="rot-block">
              <div class="rot-label">선발 로테이션 (상위 5)</div>
              <div class="cov-line">${rotationLine}</div>
              ${rotationLack > 0 ? `<p class="alert-line">로테이션 ${rotationLack}명 부족</p>` : ''}
            </div>
            <div class="rot-block">
              <div class="rot-label">불펜 (상위 5)</div>
              <div class="cov-line">${bullpenLine}</div>
            </div>
          </article>

          <article class="home-card">
            <h3>핵심 선수 · OVR 상위 3</h3>
            <div class="mini-list">${keyList}</div>
          </article>

          <article class="home-card">
            <h3>육성 후보 · 25세 이하 재능 상위 3</h3>
            <div class="mini-list">${devList}</div>
          </article>

          <article class="home-card home-card-wide">
            <details class="fold">
              <summary>구성 통계 (연령대 · 손·타 · 평균)</summary>
              <div class="fold-body">
                <div class="stats-2">
                  <div>
                    <h4>연령대</h4>
                    <div class="dist">${ageBars}</div>
                  </div>
                  <div>
                    <h4>손·타 / 평균</h4>
                    <div class="home-kpi">
                      <div class="kpi"><span class="kpi-label">평균 나이</span><b class="kpi-value">${avgAge.toFixed(1)}</b></div>
                      <div class="kpi"><span class="kpi-label">좌투 / 투수</span><b class="kpi-value">${leftThrows}<span class="kpi-of">/ ${pitchers.length}</span></b></div>
                      <div class="kpi"><span class="kpi-label">좌타·양타 / 야수</span><b class="kpi-value">${leftBats}<span class="kpi-of">/ ${batters.length}</span></b></div>
                    </div>
                  </div>
                </div>
              </div>
            </details>
          </article>
        </section>
      </div>
    `;
  }

  // ── 로스터 (등록 상태별) ─────────────────────────────────────
  const rosterEditKey = () => teamKey('roster_overrides');
  function loadRosterOverrides(){
    try { return JSON.parse(localStorage.getItem(rosterEditKey())) || {}; }
    catch { return {}; }
  }
  function saveRosterOverrides(obj){
    try { localStorage.setItem(rosterEditKey(), JSON.stringify(obj)); } catch {}
  }
  function currentStatusOf(pid){
    const overrides = loadRosterOverrides();
    if (overrides[pid]) return overrides[pid];
    const r = (POOL.registrations || []).find(x => x.player === pid);
    return r ? r.status : 'active';
  }
  function setStatusOf(pid, status){
    const overrides = loadRosterOverrides();
    overrides[pid] = status;
    saveRosterOverrides(overrides);
  }

  function viewPlayersRoster(){
    const statuses = (POOL.league?.statuses) || [['active','액티브']];
    // 그룹핑
    const groups = {};
    statuses.forEach(([id]) => groups[id] = []);
    POOL.players.forEach(p => {
      const st = currentStatusOf(p.id);
      if (!groups[st]) groups[st] = [];
      groups[st].push(p);
    });
    const activeLimit = POOL.league?.roster_active_limit;
    const activeCount = groups['active']?.length || 0;
    const overLimit = activeLimit && activeCount > activeLimit;

    const statusOpts = statuses.map(([id,label]) => `<option value="${id}">${label}</option>`).join('');

    const groupHtml = statuses.map(([id, label]) => {
      const list = groups[id] || [];
      const isActive = id === 'active';
      const badge = isActive && activeLimit ? `<span style="margin-left:8px;color:${overLimit?'var(--neg)':'var(--text-muted)'};font-family:var(--font-mono);font-size:var(--text-xs)">${activeCount} / ${activeLimit}</span>` : '';
      const rows = list.map(p => `<div class="dlist-row" style="grid-template-columns:2fr 60px 60px 60px 120px">
        <div class="cell-primary" data-route="/player/${p.id}">${p.name} <span class="hand-marker">${p.position}</span></div>
        <div class="cell-num">${p.age}</div>
        <div class="cell-num">${p.ovr}</div>
        <div class="cell-num">${p.talent_avg}</div>
        <div>
          <select data-roster-set="${p.id}" style="width:100%;font-size:var(--text-xs)">
            ${statuses.map(([sid, slabel]) => `<option value="${sid}" ${currentStatusOf(p.id)===sid?'selected':''}>${slabel}</option>`).join('')}
          </select>
        </div>
      </div>`).join('');
      return `<div class="card">
        <h2 class="section-title">${label}${badge}</h2>
        ${list.length ? `<div class="dlist" style="border:0">
          <div class="dlist-row head" style="grid-template-columns:2fr 60px 60px 60px 120px">
            <div>선수</div><div>나이</div><div>OVR</div><div>재능</div><div>상태 변경</div>
          </div>
          ${rows}
        </div>` : `<div class="placeholder">비어 있음</div>`}
      </div>`;
    }).join('');

    return `
      <div class="filterbar" style="gap:var(--size-12)">
        <span style="font-size:var(--text-sm);color:var(--text-muted)">리그 규정: 액티브 ${activeLimit || '—'}명</span>
        ${overLimit ? `<span style="color:var(--neg);font-size:var(--text-sm)">액티브 한도 초과</span>` : ''}
      </div>
      ${groupHtml}
    `;
  }

  function bindPlayersRoster(el){
    el.querySelectorAll('[data-roster-set]').forEach(sel => {
      sel.addEventListener('change', e => {
        const pid = parseInt(sel.dataset.rosterSet, 10);
        setStatusOf(pid, e.target.value);
        renderContent(activeTab().route);
      });
    });
    el.querySelectorAll('[data-route]').forEach(el2 => {
      // 이미 bindRouteLinks에서 처리되지만 셀렉트 안엔 없으니 추가 없음
    });
  }

  function viewPlayers(){
    const st = listState.players;
    let items = POOL.players;
    if (st.role !== 'all') items = items.filter(p => p.role === st.role);
    if (st.search) {
      const q = st.search.toLowerCase();
      items = items.filter(p => p.name.toLowerCase().includes(q));
    }
    const sortKey = (p, by) => {
      if (by === 'age') return p.age;
      if (by === 'talent') return p.talent_avg;
      if (by === 'ovr') return p.ovr;
      if (by === 'position') return p.position;
      return p.name;
    };
    items = sortRows(items, st.sortBy, st.sortDir, sortKey);

    const th = (key, label) => {
      const active = st.sortBy === key;
      const arrow = !active ? '↕' : (st.sortDir === 'asc' ? '↑' : '↓');
      return `<span class="sort-th ${active?'active':''}" data-sort="${key}">${label}<span class="sort-indicator">${arrow}</span></span>`;
    };

    const rows = items.map(p => `
      <div class="dlist-row" data-route="/player/${p.id}">
        <div class="cell-primary">${p.name}<span class="hand-marker">${p.throws}/${p.bats}</span></div>
        <div>${p.position}</div>
        <div class="cell-num">${p.age}</div>
        <div class="cell-num">${p.ovr}</div>
        <div class="cell-num">${p.talent_avg}</div>
      </div>`).join('');

    const roles = Array.from(new Set(POOL.players.map(p => p.role)));
    const roleOpts = ['<option value="all">전체 역할</option>']
      .concat(roles.map(r => `<option value="${r}" ${st.role===r?'selected':''}>${r}</option>`))
      .join('');

    return `
      <div class="filterbar">
        <input type="search" class="search" placeholder="이름 검색" value="${st.search}" id="filter-search">
        <select id="filter-role">${roleOpts}</select>
        <span class="count">${items.length} / ${POOL.players.length}</span>
      </div>
      <div class="dlist">
        <div class="dlist-row head">
          <div>${th('name','이름')}</div>
          <div>${th('position','포지션')}</div>
          <div>${th('age','나이')}</div>
          <div>${th('ovr','현재')}</div>
          <div>${th('talent','재능')}</div>
        </div>
        ${rows.length ? rows : `<div class="dlist-row" style="cursor:default"><div style="grid-column:1/-1;text-align:center;color:var(--text-faint);padding:var(--size-16)">일치하는 선수 없음</div></div>`}
      </div>`;
  }

  function bindPlayersFilters(el){
    const st = listState.players;
    const search = el.querySelector('#filter-search');
    if (search) search.addEventListener('input', e => {
      st.search = e.target.value;
      renderContent(activeTab().route);
      // 검색 후 포커스 유지
      const s = document.getElementById('filter-search');
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    });
    const role = el.querySelector('#filter-role');
    if (role) role.addEventListener('change', e => {
      st.role = e.target.value;
      renderContent(activeTab().route);
    });
    el.querySelectorAll('.sort-th').forEach(t => {
      t.addEventListener('click', () => {
        const key = t.dataset.sort;
        if (st.sortBy === key) st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc';
        else { st.sortBy = key; st.sortDir = 'asc'; }
        renderContent(activeTab().route);
      });
    });
  }

  // 개인 훈련 옵션 — 라벨은 pool.constants.individual_trainings에서
  const IND_TRAININGS = C.individual_trainings.map(([key, label]) => ({ key, label }));
  const IND_KEY = pid => `indiv:${pid}`;
  function loadIndiv(pid){
    try { return JSON.parse(localStorage.getItem(IND_KEY(pid))) || ['none','none']; }
    catch { return ['none','none']; }
  }
  function saveIndiv(pid, arr){ try { localStorage.setItem(IND_KEY(pid), JSON.stringify(arr)); } catch {} }

  // 메인 수비 포지션 유저 지정 (localStorage 오버라이드).
  // 게임 시뮬 시 팀 훈련이 이 포지션의 skill을 자동으로 올린다(#131 후속).
  const MAIN_DEF_KEY = pid => `main_defense:${pid}`;
  function loadMainDefense(pid, fallback){
    try { return localStorage.getItem(MAIN_DEF_KEY(pid)) || fallback || ''; }
    catch { return fallback || ''; }
  }
  function saveMainDefense(pid, pos){
    try { localStorage.setItem(MAIN_DEF_KEY(pid), pos); } catch {}
  }
  const OFFENSIVE_POSITIONS = C.offensive_positions || ['C','1B','2B','3B','SS','LF','CF','RF','DH'];

  function viewPlayer(id){
    const p = POOL.players.find(x => String(x.id) === id);
    if (!p) return `<div class="placeholder">선수 ${id} 없음</div>`;

    // 헤더 정보 카드
    const foreignBadge = p.foreign ? `<span style="font-size:var(--text-xs);color:var(--text-muted);padding:2px 6px;border:1px solid var(--border);border-radius:var(--radius-s);margin-left:8px">외국인</span>` : '';
    const headerCards = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--size-8);margin-bottom:var(--size-16)">
      ${[
        ['등번호', `#${p.number}`],
        ['포지션', p.position],
        ['나이', `${p.age}세`],
        ['좌우', `${p.throws}/${p.bats}`],
        ['현재 (OVR)', p.ovr],
        ['재능', p.talent_avg],
      ].map(([k,v]) => `<div style="padding:var(--size-10) var(--size-12);border:1px solid var(--border);border-radius:var(--radius-s);background:var(--bg-secondary)">
        <div style="font-size:var(--text-xxs);color:var(--text-muted);letter-spacing:var(--tracking-wide);text-transform:uppercase;margin-bottom:2px">${k}</div>
        <div style="font-family:var(--font-mono);font-weight:var(--weight-semibold);color:var(--text-normal);font-size:var(--text-md)">${v}</div>
      </div>`).join('')}
    </div>`;

    const groupsHtml = ['bat','run','field','pitch','body'].map(g => {
      const items = POOL.ability_labels.filter(a => a[2] === g);
      if (!items.length) return '';
      const inner = items.map(([aid, label]) => `
        <div class="ability">
          <span class="ability-label">${label}</span>
          <span class="ability-value">${p.ability_display[aid] || '·'}</span>
        </div>`).join('');
      return `<div class="set-group">
        <h3 class="section-title">${SET_NAMES[g]}</h3>
        <div class="abilities">${inner}</div>
      </div>`;
    }).join('');

    // 포지션 능숙도 & 메인 수비 셀렉터
    const posApt = p.position_apt || {};
    const posSkill = p.position_skill || {};
    const candidates = new Set(p.main_defense_candidates || []);
    const savedMain = loadMainDefense(p.id, p.main_defense || p.position);
    const posRows = OFFENSIVE_POSITIONS.filter(id => posApt[id] !== undefined || posSkill[id] !== undefined).map(id => {
      const label = POSITION_LABELS[id] || id;
      const apt = posApt[id] ?? '·';
      const skill = posSkill[id] ?? '·';
      const isMain = id === savedMain;
      const isCandidate = candidates.has(id);
      const cls = isMain ? 'pos-row main' : (isCandidate ? 'pos-row candidate' : 'pos-row');
      return `<div class="${cls}">
        <span class="pos-code">${id}</span>
        <span class="pos-label">${label}${isMain ? ' <span class="pos-badge">메인</span>' : ''}</span>
        <span class="pos-num">${apt}</span>
        <span class="pos-num">${skill}</span>
      </div>`;
    }).join('');
    const threshold = p.main_defense_threshold || 12;
    const mainDefOpts = OFFENSIVE_POSITIONS.filter(id => posSkill[id] !== undefined).map(id => {
      const label = POSITION_LABELS[id] || id;
      const skill = posSkill[id] ?? 0;
      const eligible = candidates.has(id);
      const sel = id === savedMain ? 'selected' : '';
      const hint = eligible ? `숙련 ${skill}` : `숙련 ${skill} · 권장 ${threshold}+`;
      return `<option value="${id}" ${sel}>${label} · ${hint}</option>`;
    }).join('');
    const positionCard = `<div class="card">
      <h2 class="section-title">포지션 · 메인 수비</h2>
      <div class="main-def-block">
        <label class="main-def-label">메인 수비 포지션</label>
        <select id="main-def-sel" class="main-def-sel">${mainDefOpts}</select>
        <p class="main-def-hint">팀 훈련이 이 포지션의 숙련을 올려요. 다른 포지션은 개인 훈련으로. 권장 숙련 ${threshold} 이상 — 그보다 낮으면 실전 수비가 처참할 수 있어요.</p>
      </div>
      <div class="pos-grid">
        <div class="pos-head-row">
          <span class="pos-head">코드</span>
          <span class="pos-head">포지션</span>
          <span class="pos-head pos-num">적성 (천장)</span>
          <span class="pos-head pos-num">숙련 (현재)</span>
        </div>
        ${posRows}
      </div>
    </div>`;

    // 개인 훈련 편집
    const indiv = loadIndiv(p.id);
    const trainingSlots = [0,1].map(slotIdx => {
      const cur = indiv[slotIdx];
      const opts = IND_TRAININGS.map(t => `<option value="${t.key}" ${cur===t.key?'selected':''}>${t.label}</option>`).join('');
      return `<div style="display:flex;align-items:center;gap:var(--size-8);margin-bottom:var(--size-6)">
        <span style="font-size:var(--text-xs);color:var(--text-muted);width:60px">자리 ${slotIdx+1}</span>
        <select data-indiv-slot="${slotIdx}" style="flex:1;max-width:280px">${opts}</select>
      </div>`;
    }).join('');

    return `
      <h1 class="page-title">${p.name}${foreignBadge}</h1>
      <p class="page-sub">${p.role} · ${p.position} · ${p.age}세</p>
      ${headerCards}
      <div class="card">
        <h2 class="section-title">능력</h2>
        ${groupsHtml}
      </div>
      ${positionCard}
      <div class="card">
        <h2 class="section-title">개인 훈련 (자리 2)</h2>
        ${trainingSlots}
        <p style="font-size:var(--text-xs);color:var(--text-faint);margin-top:8px">브라우저에 저장. 매치엔진/성장 코어 연결은 다음 이터레이션.</p>
      </div>
      <div class="card">
        <h2 class="section-title">성장 곡선</h2>
        <div class="placeholder">season 통과 시뮬 결과 · 다음 이터레이션</div>
      </div>`;
  }

  function bindPlayerDetail(el, pid){
    el.querySelectorAll('[data-indiv-slot]').forEach(sel => {
      sel.addEventListener('change', e => {
        const slot = parseInt(sel.dataset.indivSlot, 10);
        const cur = loadIndiv(pid);
        cur[slot] = e.target.value;
        saveIndiv(pid, cur);
      });
    });
    const mainSel = el.querySelector('#main-def-sel');
    if (mainSel) {
      mainSel.addEventListener('change', e => {
        saveMainDefense(pid, e.target.value);
        renderContent(activeTab().route);
      });
    }
  }

  // 스태프 상태
  const staffState = { search:'', kind:'all', sortBy:'kind', sortDir:'asc' };

  // 능력 라벨 축약(리스트용): 마지막 단어 앞 두 글자 등 필요 시. 여기선 pool 라벨 그대로.
  const MAIN_ABILITY_LABEL = Object.fromEntries(
    C.staff_abilities.map(([id, label]) => [id, label.replace(/ (훈련|육성|부여)$/, '').trim()])
  );

  function viewStaffList(){
    const st = staffState;
    let items = POOL.staff.slice();
    if (st.kind !== 'all') items = items.filter(s => s.kind === st.kind);
    if (st.search) {
      const q = st.search.toLowerCase();
      items = items.filter(s => s.name.toLowerCase().includes(q));
    }
    const mainOf = s => s.abilities[KIND_MAIN_ABILITY[s.kind] || 'motivation'] || 1;
    const keyFn = (s, by) => {
      if (by === 'kind') return KIND_LABELS[s.kind] || s.kind;
      if (by === 'main') return mainOf(s);
      if (by === 'motiv') return s.abilities.motivation || 1;
      return s.name;
    };
    items = sortRows(items, st.sortBy, st.sortDir, keyFn);

    const th = (key, label) => {
      const active = st.sortBy === key;
      const arrow = !active ? '↕' : (st.sortDir === 'asc' ? '↑' : '↓');
      return `<span class="sort-th ${active?'active':''}" data-sort="${key}">${label}<span class="sort-indicator">${arrow}</span></span>`;
    };

    const rows = items.map(s => {
      const mainKey = KIND_MAIN_ABILITY[s.kind] || 'motivation';
      const mainVal = s.abilities[mainKey] || 1;
      const mainLabel = MAIN_ABILITY_LABEL[mainKey] || '';
      return `<div class="dlist-row" data-route="/staff/${s.id}" style="grid-template-columns:2fr 1.5fr 1fr 1fr 1fr">
        <div class="cell-primary">${s.name}</div>
        <div>${KIND_LABELS[s.kind] || s.kind}</div>
        <div class="cell-num">${mainLabel} ${mainVal}</div>
        <div class="cell-num">${s.abilities.motivation || '-'}</div>
        <div class="cell-num">—</div>
      </div>`;
    }).join('');

    const kinds = Array.from(new Set(POOL.staff.map(s => s.kind)));
    const kindOpts = ['<option value="all">전체 직책</option>']
      .concat(kinds.map(k => `<option value="${k}" ${st.kind===k?'selected':''}>${KIND_LABELS[k]||k}</option>`))
      .join('');

    return `
      <div class="filterbar">
        <input type="search" class="search" placeholder="이름 검색" value="${st.search}" id="staff-search">
        <select id="staff-kind">${kindOpts}</select>
        <span class="count">${items.length} / ${POOL.staff.length}</span>
      </div>
      <div class="dlist">
        <div class="dlist-row head" style="grid-template-columns:2fr 1.5fr 1fr 1fr 1fr">
          <div>${th('name','이름')}</div>
          <div>${th('kind','직책')}</div>
          <div>${th('main','주 능력')}</div>
          <div>${th('motiv','동기')}</div>
          <div>배치</div>
        </div>
        ${rows}
      </div>`;
  }

  function bindStaffFilters(el){
    const search = el.querySelector('#staff-search');
    if (search) search.addEventListener('input', e => {
      staffState.search = e.target.value;
      renderContent(activeTab().route);
      const s = document.getElementById('staff-search');
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    });
    const kindSel = el.querySelector('#staff-kind');
    if (kindSel) kindSel.addEventListener('change', e => {
      staffState.kind = e.target.value;
      renderContent(activeTab().route);
    });
    el.querySelectorAll('.sort-th').forEach(t => t.addEventListener('click', () => {
      const key = t.dataset.sort;
      if (staffState.sortBy === key) staffState.sortDir = staffState.sortDir === 'asc' ? 'desc' : 'asc';
      else { staffState.sortBy = key; staffState.sortDir = 'asc'; }
      renderContent(activeTab().route);
    }));
  }

  function viewStaff(id){
    const s = POOL.staff.find(x => String(x.id) === id);
    if (!s) return `<div class="placeholder">스태프 ${id} 없음</div>`;
    const labels = STAFF_ABILITY_LABELS;
    const mainKey = KIND_MAIN_ABILITY[s.kind] || 'motivation';
    const abInner = Object.entries(labels).map(([k,l]) => {
      const isMain = k === mainKey;
      return `<div class="ability" style="${isMain?'border-color:var(--accent)':''}">
        <span class="ability-label">${l}${isMain?' <span style="font-size:var(--text-xxs);color:var(--accent);margin-left:4px">MAIN</span>':''}</span>
        <span class="ability-value">${s.abilities[k] || 1}</span>
      </div>`;
    }).join('');

    // 현재 배치 (훈련 슬롯 편집 상태에서 읽음)
    const trainAssign = loadTrainingAssign();
    const assignedCat = Object.entries(trainAssign).find(([cat, sid]) => sid === s.id);
    const assignedText = assignedCat
      ? `${CATEGORIES_TRAIN.find(c=>c.key===assignedCat[0])?.label || assignedCat[0]} 슬롯에 배치됨`
      : '현재 배치 없음';

    return `
      <h1 class="page-title">${s.name}</h1>
      <p class="page-sub">${KIND_LABELS[s.kind] || s.kind}</p>
      <div class="card">
        <h2 class="section-title">능력 (1–20)</h2>
        <div class="abilities">${abInner}</div>
      </div>
      <div class="card">
        <h2 class="section-title">배치</h2>
        <p style="font-size:var(--text-sm);color:var(--text-normal)">${assignedText}</p>
        <p style="font-size:var(--text-xs);color:var(--text-faint);margin-top:6px">배치 편집은 <a class="crumb" style="display:inline;padding:2px 4px" data-route="/training">훈련</a>에서.</p>
      </div>`;
  }

  // ── 편성 (Selection) ─────────────────────────────────────────
  const SELECTION_TABS = [
    { key:'lineup',   label:'라인업', active:true },
    { key:'rotation', label:'로테이션', active:true },
    { key:'bullpen',  label:'불펜', active:true },
    { key:'depth',    label:'뎁스 차트', active:true },
  ];

  // 팀 컨텍스트 키. 나중에 다른 팀 지원 시 자동 분리.
  function teamKey(kind){
    return `${kind}:${POOL.team.franchise}:${POOL.team.season}`;
  }
  const lineupState = { versus: 'rhp' };  // 'rhp' or 'lhp'

  // selection crate JSON 직렬화와 일치. slots 안엔 order·player·position.
  function loadLineup(versus){
    try {
      const raw = localStorage.getItem(teamKey(`lineup:${versus}`));
      if (!raw) return new Array(C.lineup_size).fill(null);
      const obj = JSON.parse(raw);
      if (Array.isArray(obj)) return obj;  // 이전 형식 호환
      return obj.slots.map(s => s.player ?? null);
    } catch { return new Array(C.lineup_size).fill(null); }
  }
  function saveLineup(versus, arr){
    const slots = arr.map((pid, i) => ({
      order: i + 1,
      player: pid ?? null,
      position: pid != null ? (POOL.players.find(p => p.id === pid)?.position || null) : null,
    }));
    const payload = {
      team: { franchise: POOL.team.franchise, season: POOL.team.season },
      versus,
      slots,
    };
    try { localStorage.setItem(teamKey(`lineup:${versus}`), JSON.stringify(payload)); } catch {}
  }

  function isPositionPlayer(p){
    // 투수는 라인업 후보에서 제외 (DH 리그니까 야수만)
    return p.role !== '투수' && p.position !== 'SP' && p.position !== 'RP';
  }

  function viewSelection(sub){
    const subtabs = SELECTION_TABS.map(t =>
      `<a class="subtab ${t.key===sub?'active':''}" data-route="/selection/${t.key}">${t.label}${t.active?'':' <span style="opacity:.4">(준비 중)</span>'}</a>`
    ).join('');
    let body = '';
    if (sub === 'lineup') body = viewLineup();
    else if (sub === 'rotation') body = viewRotation();
    else if (sub === 'bullpen') body = viewBullpen();
    else if (sub === 'depth') body = viewDepth();
    else body = `<div class="placeholder">${SELECTION_TABS.find(t=>t.key===sub)?.label || sub}</div>`;
    return `<div class="subtabs">${subtabs}</div>${body}`;
  }

  function viewLineup(){
    const versus = lineupState.versus;
    const arr = loadLineup(versus);
    const used = new Set(arr.filter(Boolean));

    const slotHtml = arr.map((pid, idx) => {
      const p = pid != null ? POOL.players.find(x => x.id === pid) : null;
      const orderNum = idx + 1;
      if (!p) {
        return `<div class="lineup-slot empty" data-slot="${idx}">
          <div class="slot-order">${orderNum}</div>
          <div class="slot-pos">—</div>
          <div class="slot-name">비어 있음</div>
          <div></div>
        </div>`;
      }
      return `<div class="lineup-slot" data-slot="${idx}">
        <div class="slot-order">${orderNum}</div>
        <div class="slot-pos">${p.position}</div>
        <div class="slot-name">${p.name} <span class="hand-marker">${p.throws}/${p.bats}</span></div>
        <button class="slot-clear" data-clear="${idx}" title="비우기">×</button>
      </div>`;
    }).join('');

    const eligible = POOL.players.filter(isPositionPlayer);
    const pickerItems = eligible.map(p => {
      const isUsed = used.has(p.id);
      return `<div class="picker-item ${isUsed?'used':''}" data-pick="${p.id}">
        <div class="pi-pos">${p.position}</div>
        <div class="pi-name">${p.name}</div>
        <div class="pi-ovr">${p.ovr}</div>
      </div>`;
    }).join('');

    return `
      <div class="filterbar" style="justify-content:flex-start;gap:8px">
        <span style="font-size:var(--text-sm);color:var(--text-muted)">상대 투수</span>
        <button class="button ${versus==='rhp'?'button-primary':''}" data-versus="rhp">우투수</button>
        <button class="button ${versus==='lhp'?'button-primary':''}" data-versus="lhp">좌투수</button>
        <span class="count">${arr.filter(Boolean).length}/9</span>
      </div>
      <div class="lineup-wrap">
        <div class="lineup-list">${slotHtml}</div>
        <div class="picker">
          <h3 class="picker-title">야수 (${eligible.length})</h3>
          <p class="picker-hint">슬롯을 클릭하고 선수를 골라 배치. 이미 배치된 선수는 흐리게.</p>
          <div class="picker-list">${pickerItems}</div>
        </div>
      </div>
    `;
  }

  // ── 로테이션 (선발 5) ─────────────────────────────────────────
  function loadRotation(){
    try {
      const raw = localStorage.getItem(teamKey('rotation'));
      if (!raw) return new Array(C.rotation_size).fill(null);
      const obj = JSON.parse(raw);
      if (Array.isArray(obj)) return obj;
      return obj.starters || new Array(C.rotation_size).fill(null);
    } catch { return new Array(C.rotation_size).fill(null); }
  }
  function saveRotation(arr){
    const payload = {
      team: { franchise: POOL.team.franchise, season: POOL.team.season },
      starters: arr.map(x => x ?? null),
    };
    try { localStorage.setItem(teamKey('rotation'), JSON.stringify(payload)); } catch {}
  }
  function isSP(p){ return p.position === 'SP'; }

  function viewRotation(){
    const arr = loadRotation();
    const used = new Set(arr.filter(Boolean));
    const rotationLabels = ['1선발','2선발','3선발','4선발','5선발'];
    const slotHtml = arr.map((pid, idx) => {
      const p = pid != null ? POOL.players.find(x => x.id === pid) : null;
      if (!p) return `<div class="lineup-slot empty" data-slot="${idx}">
        <div class="slot-order">${idx+1}</div>
        <div class="slot-pos">${rotationLabels[idx]}</div>
        <div class="slot-name">비어 있음</div>
        <div></div>
      </div>`;
      return `<div class="lineup-slot" data-slot="${idx}">
        <div class="slot-order">${idx+1}</div>
        <div class="slot-pos">${rotationLabels[idx]}</div>
        <div class="slot-name">${p.name} <span class="hand-marker">${p.throws}/${p.bats}</span></div>
        <button class="slot-clear" data-clear="${idx}" title="비우기">×</button>
      </div>`;
    }).join('');

    const eligible = POOL.players.filter(isSP);
    const pickerItems = eligible.map(p => {
      const isUsed = used.has(p.id);
      return `<div class="picker-item ${isUsed?'used':''}" data-pick="${p.id}">
        <div class="pi-pos">SP</div>
        <div class="pi-name">${p.name}</div>
        <div class="pi-ovr">${p.ovr}</div>
      </div>`;
    }).join('');

    return `
      <div class="filterbar" style="justify-content:flex-start">
        <span class="count">${arr.filter(Boolean).length}/5</span>
      </div>
      <div class="rotation-wrap">
        <div class="lineup-list">${slotHtml}</div>
        <div class="picker">
          <h3 class="picker-title">선발 후보 (${eligible.length})</h3>
          <p class="picker-hint">슬롯을 클릭하고 선수를 골라 배치.</p>
          <div class="picker-list">${pickerItems}</div>
        </div>
      </div>
    `;
  }

  // ── 불펜 (역할별) ──────────────────────────────────────────────
  const BULLPEN_ROLES = C.bullpen_roles.map(([key, label, short]) => ({ key, label, short }));
  function loadBullpen(){
    try {
      const raw = JSON.parse(localStorage.getItem(teamKey('bullpen'))) || {};
      // 새 형식: { team, by_role }. 이전 형식: { closer:[], ... }
      const map = raw.by_role || raw;
      const out = {};
      BULLPEN_ROLES.forEach(r => out[r.key] = Array.isArray(map[r.key]) ? map[r.key] : []);
      return out;
    } catch {
      const out = {}; BULLPEN_ROLES.forEach(r => out[r.key] = []); return out;
    }
  }
  function saveBullpen(obj){
    const payload = {
      team: { franchise: POOL.team.franchise, season: POOL.team.season },
      by_role: obj,
    };
    try { localStorage.setItem(teamKey('bullpen'), JSON.stringify(payload)); } catch {}
  }
  function isRP(p){ return p.position === 'RP'; }

  function viewBullpen(){
    const state = loadBullpen();
    const usedAll = new Set(Object.values(state).flat());
    const rolesHtml = BULLPEN_ROLES.map(r => {
      const members = state[r.key];
      const chips = members.map(pid => {
        const p = POOL.players.find(x => x.id === pid);
        if (!p) return '';
        return `<span class="bullpen-chip">${p.name} <span class="hand-marker">${p.throws}</span> <span class="bullpen-chip-x" data-bpx="${r.key}:${pid}">×</span></span>`;
      }).join('');
      return `<div class="bullpen-role">
        <div class="bullpen-role-head">
          <div><span class="bullpen-role-name">${r.short}</span> <span style="color:var(--text-muted);font-size:var(--text-sm);margin-left:6px">${r.label}</span></div>
          <div class="bullpen-role-count">${members.length}명 · 클릭해 여기에 추가</div>
        </div>
        <div class="bullpen-members" data-role-target="${r.key}">
          ${chips || `<div class="bullpen-empty">비어 있음</div>`}
        </div>
      </div>`;
    }).join('');

    const eligible = POOL.players.filter(isRP);
    const pickerItems = eligible.map(p => {
      const isUsed = usedAll.has(p.id);
      return `<div class="picker-item ${isUsed?'used':''}" data-pick="${p.id}">
        <div class="pi-pos">RP</div>
        <div class="pi-name">${p.name}</div>
        <div class="pi-ovr">${p.ovr}</div>
      </div>`;
    }).join('');

    const totalAssigned = Object.values(state).flat().length;
    return `
      <div class="filterbar" style="justify-content:flex-start">
        <span class="count">${totalAssigned}명 배치</span>
      </div>
      <div class="bullpen-wrap">
        <div class="bullpen-list">${rolesHtml}</div>
        <div class="picker">
          <h3 class="picker-title">구원 투수 (${eligible.length})</h3>
          <p class="picker-hint">역할 영역을 먼저 클릭하고 선수를 골라 추가. 다시 다른 역할로 옮기면 자동 이동.</p>
          <div class="picker-list">${pickerItems}</div>
        </div>
      </div>
    `;
  }

  // ── 뎁스 차트 ─────────────────────────────────────────────────
  const DEPTH_POSITIONS = C.offensive_positions.map(id => ({ key: id, label: POSITION_LABELS[id] || id }));
  const DEPTH_RANKS = C.depth_ranks.map(([id, label]) => label);
  const DEPTH_RANK_IDS = C.depth_ranks.map(([id]) => id);
  function loadDepth(){
    try {
      const raw = JSON.parse(localStorage.getItem(teamKey('depth_chart'))) || {};
      const map = raw.by_position || raw;
      const out = {};
      DEPTH_POSITIONS.forEach(pos => {
        out[pos.key] = Array.isArray(map[pos.key]) ? map[pos.key].slice(0,3) : [null,null,null];
        while (out[pos.key].length < 3) out[pos.key].push(null);
      });
      return out;
    } catch {
      const out = {}; DEPTH_POSITIONS.forEach(pos => out[pos.key] = [null,null,null]); return out;
    }
  }
  function saveDepth(obj){
    const payload = {
      team: { franchise: POOL.team.franchise, season: POOL.team.season },
      by_position: obj,
    };
    try { localStorage.setItem(teamKey('depth_chart'), JSON.stringify(payload)); } catch {}
  }

  function viewDepth(){
    const state = loadDepth();
    const positionsHtml = DEPTH_POSITIONS.map(pos => {
      const slots = state[pos.key].map((pid, rankIdx) => {
        const p = pid != null ? POOL.players.find(x => x.id === pid) : null;
        if (!p) return `<div class="depth-slot empty" data-depth-slot="${pos.key}:${rankIdx}">
          <div class="depth-rank">${DEPTH_RANKS[rankIdx]}</div>
          <div>비어 있음</div>
          <div></div>
        </div>`;
        return `<div class="depth-slot" data-depth-slot="${pos.key}:${rankIdx}">
          <div class="depth-rank">${DEPTH_RANKS[rankIdx]}</div>
          <div>${p.name} <span class="hand-marker">${p.throws}/${p.bats}</span></div>
          <button class="depth-clear" data-depth-clear="${pos.key}:${rankIdx}" title="비우기">×</button>
        </div>`;
      }).join('');
      return `<div class="depth-pos">
        <div class="depth-pos-head">
          <div class="depth-pos-label">${pos.key}</div>
          <div class="depth-pos-name">${pos.label}</div>
        </div>
        <div class="depth-slots">${slots}</div>
      </div>`;
    }).join('');

    const eligible = POOL.players.filter(isPositionPlayer);
    const pickerItems = eligible.map(p => `
      <div class="picker-item" data-pick="${p.id}">
        <div class="pi-pos">${p.position}</div>
        <div class="pi-name">${p.name}</div>
        <div class="pi-ovr">${p.ovr}</div>
      </div>`).join('');

    return `
      <div class="filterbar" style="justify-content:flex-start">
        <span style="font-size:var(--text-sm);color:var(--text-muted)">포지션별 주전·백업·긴급</span>
      </div>
      <div class="depth-wrap">
        <div class="depth-list">${positionsHtml}</div>
        <div class="picker">
          <h3 class="picker-title">야수 (${eligible.length})</h3>
          <p class="picker-hint">슬롯을 클릭한 뒤 선수를 골라 배치. 한 선수가 여러 포지션 백업으로 등록될 수 있음.</p>
          <div class="picker-list">${pickerItems}</div>
        </div>
      </div>
    `;
  }

  // ── 편성 이벤트 바인딩 (라인업·로테이션·불펜·뎁스 공용) ─────
  let selectedSlot = null;         // for lineup/rotation
  let selectedBullpenRole = null;
  let selectedDepthSlot = null;    // "POS:rank"

  function bindSelection(el, sub){
    // 서브탭 라우팅은 bindRouteLinks가 처리.
    if (sub === 'lineup') return bindLineup(el);
    if (sub === 'rotation') return bindRotation(el);
    if (sub === 'bullpen') return bindBullpen(el);
    if (sub === 'depth') return bindDepth(el);
  }

  function bindLineup(el){
    el.querySelectorAll('[data-versus]').forEach(b => b.addEventListener('click', () => {
      lineupState.versus = b.dataset.versus; selectedSlot = null;
      renderContent(activeTab().route);
    }));
    el.querySelectorAll('.lineup-slot').forEach(s => s.addEventListener('click', e => {
      if (e.target.dataset.clear) return;
      selectedSlot = parseInt(s.dataset.slot, 10);
      el.querySelectorAll('.lineup-slot').forEach(x => x.style.borderColor = '');
      s.style.borderColor = 'var(--accent)';
    }));
    el.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(b.dataset.clear, 10);
      const arr = loadLineup(lineupState.versus);
      arr[idx] = null;
      saveLineup(lineupState.versus, arr);
      renderContent(activeTab().route);
    }));
    el.querySelectorAll('[data-pick]').forEach(item => item.addEventListener('click', () => {
      const pid = parseInt(item.dataset.pick, 10);
      const arr = loadLineup(lineupState.versus);
      if (selectedSlot == null) {
        const empty = arr.findIndex(x => x == null);
        if (empty < 0) return;
        selectedSlot = empty;
      }
      for (let i = 0; i < arr.length; i++) if (arr[i] === pid) arr[i] = null;
      arr[selectedSlot] = pid;
      saveLineup(lineupState.versus, arr);
      selectedSlot = null;
      renderContent(activeTab().route);
    }));
  }

  function bindRotation(el){
    el.querySelectorAll('.lineup-slot').forEach(s => s.addEventListener('click', e => {
      if (e.target.dataset.clear) return;
      selectedSlot = parseInt(s.dataset.slot, 10);
      el.querySelectorAll('.lineup-slot').forEach(x => x.style.borderColor = '');
      s.style.borderColor = 'var(--accent)';
    }));
    el.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(b.dataset.clear, 10);
      const arr = loadRotation();
      arr[idx] = null; saveRotation(arr);
      renderContent(activeTab().route);
    }));
    el.querySelectorAll('[data-pick]').forEach(item => item.addEventListener('click', () => {
      const pid = parseInt(item.dataset.pick, 10);
      const arr = loadRotation();
      if (selectedSlot == null) {
        const empty = arr.findIndex(x => x == null);
        if (empty < 0) return;
        selectedSlot = empty;
      }
      for (let i = 0; i < arr.length; i++) if (arr[i] === pid) arr[i] = null;
      arr[selectedSlot] = pid;
      saveRotation(arr);
      selectedSlot = null;
      renderContent(activeTab().route);
    }));
  }

  function bindBullpen(el){
    // 역할 영역 클릭 = 대상 지정
    el.querySelectorAll('[data-role-target]').forEach(area => area.addEventListener('click', () => {
      selectedBullpenRole = area.dataset.roleTarget;
      el.querySelectorAll('.bullpen-role').forEach(r => r.style.borderColor = '');
      area.closest('.bullpen-role').style.borderColor = 'var(--accent)';
    }));
    // 칩 × 제거
    el.querySelectorAll('[data-bpx]').forEach(x => x.addEventListener('click', e => {
      e.stopPropagation();
      const [role, pidStr] = x.dataset.bpx.split(':');
      const pid = parseInt(pidStr, 10);
      const state = loadBullpen();
      state[role] = state[role].filter(id => id !== pid);
      saveBullpen(state);
      renderContent(activeTab().route);
    }));
    // 픽커 = 선택 역할에 추가 (다른 역할에서 자동 제거)
    el.querySelectorAll('[data-pick]').forEach(item => item.addEventListener('click', () => {
      const pid = parseInt(item.dataset.pick, 10);
      const state = loadBullpen();
      if (!selectedBullpenRole) {
        // 미선택 시 middle에 추가
        selectedBullpenRole = 'middle';
      }
      // 어느 역할에 있으면 제거
      BULLPEN_ROLES.forEach(r => { state[r.key] = state[r.key].filter(id => id !== pid); });
      state[selectedBullpenRole].push(pid);
      saveBullpen(state);
      renderContent(activeTab().route);
    }));
  }

  function bindDepth(el){
    el.querySelectorAll('.depth-slot').forEach(s => s.addEventListener('click', e => {
      if (e.target.dataset.depthClear) return;
      selectedDepthSlot = s.dataset.depthSlot;
      el.querySelectorAll('.depth-slot').forEach(x => x.style.borderColor = '');
      s.style.borderColor = 'var(--accent)';
    }));
    el.querySelectorAll('[data-depth-clear]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const [pos, rankStr] = b.dataset.depthClear.split(':');
      const rank = parseInt(rankStr, 10);
      const state = loadDepth();
      state[pos][rank] = null;
      saveDepth(state);
      renderContent(activeTab().route);
    }));
    el.querySelectorAll('[data-pick]').forEach(item => item.addEventListener('click', () => {
      if (!selectedDepthSlot) return;
      const pid = parseInt(item.dataset.pick, 10);
      const [pos, rankStr] = selectedDepthSlot.split(':');
      const rank = parseInt(rankStr, 10);
      const state = loadDepth();
      // 같은 포지션 안에서만 중복 제거 (다른 포지션 백업 허용)
      for (let i = 0; i < 3; i++) if (state[pos][i] === pid) state[pos][i] = null;
      state[pos][rank] = pid;
      saveDepth(state);
      selectedDepthSlot = null;
      renderContent(activeTab().route);
    }));
  }

  // 훈련 카테고리 — pool.constants.categories에서
  const CATEGORIES_TRAIN = C.categories.map(([key, label, kind, ability]) => ({ key, label, kind, ability }));
  const TRAIN_KEY = 'training_assign';
  function loadTrainingAssign(){
    try { return JSON.parse(localStorage.getItem(TRAIN_KEY)) || {}; } catch { return {}; }
  }
  function saveTrainingAssign(obj){ try { localStorage.setItem(TRAIN_KEY, JSON.stringify(obj)); } catch {} }

  function viewTraining(){
    const assign = loadTrainingAssign();
    const cards = CATEGORIES_TRAIN.map(s => {
      const coaches = POOL.staff.filter(x => x.kind === s.kind);
      const curId = assign[s.key];
      const cur = curId != null ? POOL.staff.find(c => c.id === curId) : null;
      const opts = ['<option value="">(비어 있음)</option>'].concat(
        coaches.map(c => `<option value="${c.id}" ${cur && cur.id===c.id?'selected':''}>${c.name} (${c.abilities[s.ability]||1})</option>`)
      ).join('');
      const abilityVal = cur ? (cur.abilities[s.ability] || 1) : 0;
      const stars = cur ? starOf(abilityVal) : 1;
      const env = STAR_ENV[stars];
      return `<div class="slot">
        <div class="slot-label">${s.label}</div>
        <select data-slot="${s.key}">${opts}</select>
        <div class="slot-meta">${cur ? `능력 ${abilityVal} · ${stars}성 · env ${env.toFixed(2)}` : '비어 있음 · 1성 · env 0.85'}</div>
      </div>`;
    }).join('');

    const summary = CATEGORIES_TRAIN.map(s => {
      const curId = assign[s.key];
      const cur = curId != null ? POOL.staff.find(c => c.id === curId) : null;
      const stars = cur ? starOf(cur.abilities[s.ability] || 1) : 1;
      const motivStars = cur ? starOf(cur.abilities.motivation || 1) : 1;
      return `<tr>
        <td style="padding:6px 12px;color:var(--text-muted)">${s.label}</td>
        <td style="padding:6px 12px">${cur ? cur.name : '—'}</td>
        <td style="padding:6px 12px;font-family:var(--font-mono);text-align:right">${stars}성</td>
        <td style="padding:6px 12px;font-family:var(--font-mono);text-align:right">${STAR_ENV[stars].toFixed(2)}</td>
        <td style="padding:6px 12px;font-family:var(--font-mono);text-align:right">${motivStars}성</td>
      </tr>`;
    }).join('');

    return `
      <p class="page-sub">팀 훈련 5슬롯 · 코치 배치 → 별점 → 환경 요인 계산</p>
      <div class="slots">${cards}</div>
      <div class="card" style="margin-top: var(--size-16)">
        <h2 class="section-title">결과 요약</h2>
        <table style="width:100%;border-collapse:collapse;font-size:var(--text-sm)">
          <thead>
            <tr style="color:var(--text-muted);text-align:left">
              <th style="padding:6px 12px;font-weight:var(--weight-medium);font-size:var(--text-xs);text-transform:uppercase">카테고리</th>
              <th style="padding:6px 12px;font-weight:var(--weight-medium);font-size:var(--text-xs);text-transform:uppercase">배치</th>
              <th style="padding:6px 12px;font-weight:var(--weight-medium);font-size:var(--text-xs);text-transform:uppercase;text-align:right">별점</th>
              <th style="padding:6px 12px;font-weight:var(--weight-medium);font-size:var(--text-xs);text-transform:uppercase;text-align:right">환경 요인</th>
              <th style="padding:6px 12px;font-weight:var(--weight-medium);font-size:var(--text-xs);text-transform:uppercase;text-align:right">동기</th>
            </tr>
          </thead>
          <tbody>${summary}</tbody>
        </table>
        <p style="font-size:var(--text-xs);color:var(--text-faint);margin-top:12px">별점→env: 1성 0.85 · 3성 1.00 · 5성 1.15. 이 값이 성장 코어의 env 요인이 됩니다.</p>
      </div>`;
  }

  function bindTraining(el){
    el.querySelectorAll('[data-slot]').forEach(sel => {
      sel.addEventListener('change', e => {
        const slot = sel.dataset.slot;
        const val = e.target.value;
        const assign = loadTrainingAssign();
        if (val === '') delete assign[slot];
        else {
          const numVal = parseInt(val, 10);
          Object.keys(assign).forEach(k => { if (assign[k] === numVal) delete assign[k]; });
          assign[slot] = numVal;
        }
        saveTrainingAssign(assign);
        renderContent(activeTab().route);
      });
    });
  }

  document.getElementById('nav-back').addEventListener('click', goBack);
  document.getElementById('nav-forward').addEventListener('click', goForward);
  window.toggleSidebar = () => document.getElementById('app').classList.toggle('sidebar-collapsed');
  window.advanceYear  = () => alert('진행 · 다음 이터레이션');
  window.openOptions  = () => alert('옵션 · 다음 이터레이션');
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
    if ((e.metaKey || e.ctrlKey) && e.key === 'ArrowRight') { e.preventDefault(); goForward(); }
  });

  // 브랜드: 팀 로고 (팀 컬러 원형 배지) + 팀명·시즌
  if (POOL.team) {
    const t = POOL.team;
    const logo = document.getElementById('brand-logo');
    const initial = (t.short || t.name || '?').trim().charAt(0);
    logo.textContent = initial;
    if (t.color_primary) {
      const c2 = t.color_secondary || t.color_primary;
      logo.style.background = `linear-gradient(135deg, ${t.color_primary}, ${c2})`;
    }
    document.getElementById('brand-team').textContent = t.name || '';
  }

  // 사이드바 리사이즈 (드래그로 폭 조정 · localStorage 저장)
  (function initSidebarResize(){
    const MIN_W = 180, MAX_W = 400, KEY = 'game.sidebarWidth';
    const app = document.getElementById('app');
    const handle = document.getElementById('sidebar-resize');
    const saved = parseInt(localStorage.getItem(KEY) || '', 10);
    if (saved >= MIN_W && saved <= MAX_W) app.style.setProperty('--sidebar-w', saved + 'px');
    handle.addEventListener('mousedown', (e) => {
      if (app.classList.contains('sidebar-collapsed')) return;
      const startX = e.clientX;
      const startW = parseInt(getComputedStyle(app).getPropertyValue('--sidebar-w'), 10) || 240;
      handle.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      const onMove = (ev) => {
        const w = Math.max(MIN_W, Math.min(MAX_W, startW + (ev.clientX - startX)));
        app.style.setProperty('--sidebar-w', w + 'px');
      };
      const onUp = () => {
        handle.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        const w = parseInt(app.style.getPropertyValue('--sidebar-w'), 10);
        if (w) localStorage.setItem(KEY, String(w));
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      e.preventDefault();
    });
    // 더블클릭으로 기본값 복원
    handle.addEventListener('dblclick', () => {
      app.style.removeProperty('--sidebar-w');
      localStorage.removeItem(KEY);
    });
  })();

  const startRoute = (location.hash || '').replace(/^#/, '') || '/';
  if (/[?&]sidebar=collapsed(&|$)/.test(location.search)) {
    document.getElementById('app').classList.add('sidebar-collapsed');
  }
  openTab(startRoute);
})();
</script>
</body></html>
