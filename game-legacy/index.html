<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OOTP Game (v1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Pretendard:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shared/tokens.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.474.0/dist/umd/lucide.min.js"></script>
<style>
/* ============================================================
 * 게임 앱 컴포넌트 CSS.
 * 모든 색·간격·타이포는 shared/tokens.css의 role 토큰을 참조.
 * 여기에는 원시값(hex/px)과 :root 정의가 없다 (Phase 1, 2026-09-10).
 * ============================================================ */

/* ── 셸 전용 reset (tokens.css의 reset보다 우선하는 게임 앱 특유 규칙) ── */
*, *::before, *::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background: var(--bg-primary);
  color: var(--text-normal);
  font-family: var(--font-interface);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}
button{
  font: inherit; color: inherit; cursor: pointer;
  border: 0; background: transparent; padding: 0; margin: 0;
}
a{color: inherit; text-decoration: none}
input, select, textarea{
  font: inherit; color: inherit;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: var(--size-6) var(--size-8);
}
input:focus, select:focus{
  outline: none;
  border-color: var(--accent);
}
::selection{background: var(--accent); color: var(--text-on-accent)}

/* ============================================================
 * APP SHELL — grid areas
 *   ┌──────── topbar (전체 폭) ────────┐
 *   │                                  │
 *   ├── sidebar ────┬── main ──────────┤
 *   │               │                  │
 *   └───────────────┴──────────────────┘
 * ============================================================ */
.app{
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--tabbar-h) 1fr;
  grid-template-areas:
    "topbar  topbar"
    "sidebar main";
  height: 100vh;
}
.app.sidebar-collapsed{grid-template-columns: var(--sidebar-w-collapsed) 1fr}
/* dev 모드 · 우측 검증 패널 슬롯 추가 (?dev=1) */
.app{--dev-panel-w: 320px}
.app.dev-mode{
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--dev-panel-w);
  grid-template-areas:
    "topbar  topbar  topbar"
    "sidebar main    devpanel";
}
.app.dev-mode.sidebar-collapsed{grid-template-columns: var(--sidebar-w-collapsed) minmax(0, 1fr) var(--dev-panel-w)}

/* ── Topbar (전체 폭, 3열: 브랜드 · 탭바 · 컨트롤) ── */
.topbar{
  grid-area: topbar;
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr) auto;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
  background: var(--bg-tertiary);
  min-width: 0;
  z-index: 2;
}
.app.sidebar-collapsed .topbar{grid-template-columns: var(--sidebar-w-collapsed) minmax(0, 1fr) auto}
.topbar-brand{
  display: flex; align-items: center;
  gap: var(--size-8);
  padding: 0 var(--size-8) 0 var(--size-12);
  border-right: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-normal);
  min-width: 0;
}
.app.sidebar-collapsed .topbar-brand{padding: 0; justify-content: center}
.app.sidebar-collapsed .topbar-brand .brand-info{display: none}
.app.sidebar-collapsed .topbar-brand .brand-logo{display: none}
.brand-logo{
  width: 22px; height: 22px;
  border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff;
  font-weight: var(--weight-bold);
  font-size: var(--text-xs);
  flex-shrink: 0;
  letter-spacing: 0;
  background: var(--primary);
  line-height: 1;
}
.brand-info{
  display: flex; align-items: baseline;
  gap: var(--size-6);
  min-width: 0;
  flex: 1;
}
.brand-team{
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  color: var(--text-normal);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.brand-season{
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  flex-shrink: 0;
}
.topbar-toggle{
  width: 22px; height: 22px;
  padding: 0;
  border: 0;
  background: transparent;
  border-radius: var(--radius-s);
  color: var(--text-muted);
  line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease);
  flex-shrink: 0;
}
.topbar-toggle svg{width: 16px; height: 16px; stroke-width: 1.75}
.topbar-toggle:hover{background: var(--bg-hover); color: var(--text-normal)}
.app.sidebar-collapsed .topbar-toggle{transform: rotate(180deg)}
.topbar-right{
  display: flex; align-items: center; justify-content: flex-end;
  gap: var(--size-6);
  padding: 0 var(--size-12);
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  min-width: 0;
  white-space: nowrap;
}
.topbar-icon-btn{
  width: 30px; height: 30px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  background: transparent;
  border: 0;
  border-radius: var(--radius-s);
  cursor: pointer;
  line-height: 1;
}
.topbar-icon-btn svg{width: 16px; height: 16px; stroke-width: 1.75}
.topbar-icon-btn:hover{background: var(--bg-hover); color: var(--text-normal)}
.topbar-advance svg{width: 14px; height: 14px; stroke-width: 2}
.topbar-advance{
  display: inline-flex; align-items: center; gap: var(--size-6);
  padding: var(--size-6) var(--size-12);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  color: var(--primary-on);
  border: 0;
  background: var(--primary);
  cursor: pointer;
}
.topbar-advance:hover{filter: brightness(1.1)}

/* ── Sidebar ── */
.sidebar{
  grid-area: sidebar;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  min-width: 0;
  overflow: hidden;
  position: relative;
}
.sidebar-resize{
  position: absolute;
  top: 0; right: -3px; bottom: 0;
  width: 6px;
  cursor: col-resize;
  z-index: 3;
  background: transparent;
  transition: background var(--dur-fast) var(--ease);
}
.sidebar-resize:hover,
.sidebar-resize.dragging{background: var(--primary); opacity: 0.5}
.app.sidebar-collapsed .sidebar-resize{display: none}

.sidebar-nav{
  flex: 1;
  padding: var(--size-8) var(--size-6);
  display: flex; flex-direction: column; gap: var(--size-2);
  overflow-y: auto;
}
.nav-group-label{
  padding: var(--size-12) var(--size-10) var(--size-4);
  font-size: var(--text-xxs);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-faint);
}
.app.sidebar-collapsed .nav-group-label{display: none}
.nav-divider{
  height: 1px; background: var(--border);
  margin: var(--size-8) var(--size-8);
}
.sidebar-item{
  display: flex; align-items: center; gap: var(--size-10);
  padding: var(--size-6) var(--size-10);
  min-height: 32px;
  border-radius: var(--radius-s);
  color: var(--text-muted);
  font-size: var(--text-base);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.sidebar-item:hover{background: var(--bg-hover); color: var(--text-normal)}
.sidebar-item.active{background: var(--bg-selected); color: var(--text-normal); font-weight: var(--weight-medium)}
.sidebar-item .item-glyph{
  width: 18px; height: 18px;
  flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-muted);
}
.sidebar-item .item-glyph svg{width: 100%; height: 100%; stroke-width: 1.75}
.sidebar-item.active .item-glyph{color: var(--accent)}
.sidebar-item .item-external{
  margin-left: auto;
  width: 12px; height: 12px;
  color: var(--text-faint);
  display: inline-flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
}
.sidebar-item .item-external svg{width: 100%; height: 100%; stroke-width: 1.75}
.app.sidebar-collapsed .sidebar-item .item-external{display: none}
.app.sidebar-collapsed .sidebar-item{justify-content: center; padding: var(--size-6) 0}
.app.sidebar-collapsed .sidebar-item .item-label{display: none}

/* sidebar-footer 제거됨 — topbar로 이동 */
.button{
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--size-6);
  padding: var(--size-6) var(--size-12);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--text-normal);
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.button:hover{background: var(--bg-hover); border-color: var(--border-strong)}
.button-primary{
  background: var(--accent); color: var(--text-on-accent); border-color: transparent;
}
.button-primary:hover{background: var(--accent); filter: brightness(1.1); border-color: transparent}
.button-ghost{background: transparent; border-color: transparent; color: var(--text-muted)}
.button-ghost:hover{background: var(--bg-hover); color: var(--text-normal)}
.app.sidebar-collapsed .button .button-label{display: none}

/* ── Main ── */
.main{
  grid-area: main;
  display: grid;
  grid-template-rows: var(--navbar-h) 1fr;
  min-width: 0;
  overflow: hidden;
}

.tabbar{
  display: flex; align-items: stretch;
  background: var(--bg-primary);
  overflow-x: auto;
  scrollbar-width: none;
  min-width: 0;
  height: var(--tabbar-h);
}
.tabbar::-webkit-scrollbar{display: none}

.tab{
  display: flex; align-items: center; gap: var(--size-8);
  padding: 0 var(--size-8) 0 var(--size-12);
  height: var(--tabbar-h);
  font-size: var(--text-sm);
  color: var(--text-muted);
  font-weight: var(--weight-regular);
  border-right: 1px solid var(--border);
  /* 크롬 감각: 탭 늘어나면 flex-shrink로 균등 축소. 최소는 아이콘+× 보일 정도. */
  flex: 1 1 180px;
  min-width: 44px;
  max-width: 200px;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease);
  position: relative;
  overflow: hidden;
}
.tab:hover{background: var(--bg-hover); color: var(--text-normal)}
.tab.active{
  background: var(--bg-secondary);
  color: var(--text-normal);
  font-weight: var(--weight-medium);
}
.tab.active::before{
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px; background: var(--accent);
}
.tab .tab-glyph{
  width: 16px; height: 16px;
  color: var(--text-muted);
  flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
}
.tab .tab-glyph svg{width: 100%; height: 100%; stroke-width: 1.75}
.tab.active .tab-glyph{color: var(--accent)}
.tab .tab-name{
  overflow: hidden; text-overflow: ellipsis;
  flex: 1 1 auto; min-width: 0;
}
/* 탭이 매우 작아지면 비활성 탭의 close 버튼과 이름 숨김 (아이콘만 남음) */
.tab:not(.active){container-type: inline-size}
@container (max-width: 80px) {
  .tab-name{display: none}
  .tab-close{display: none}
}
.tab .tab-close{
  width: 18px; height: 18px;
  border-radius: var(--radius-s);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1;
  color: var(--text-muted);
  flex: 0 0 auto;
}
.tab .tab-close:hover{background: var(--bg-active); color: var(--text-normal)}
.tab-new{
  padding: 0 var(--size-12);
  font-size: var(--text-lg);
  line-height: 1;
  color: var(--text-muted);
}
.tab-new:hover{background: var(--bg-hover); color: var(--text-normal)}

.navbar{
  display: flex; align-items: center;
  gap: var(--size-4);
  padding: 0 var(--size-12);
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border);
  font-size: var(--text-sm);
}
.navbar-btn{
  padding: var(--size-4) var(--size-6);
  border-radius: var(--radius-s);
  color: var(--text-muted);
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px;
  font-size: var(--text-md);
  line-height: 1;
}
.navbar-btn:hover:not(:disabled){background: var(--bg-hover); color: var(--text-normal)}
.navbar-btn:disabled{opacity: .35; cursor: not-allowed}
.crumbs{
  display: flex; align-items: center; gap: var(--size-4);
  overflow: hidden; flex: 1;
  margin-left: var(--size-6);
}
.crumb{
  color: var(--text-muted);
  padding: var(--size-2) var(--size-6);
  border-radius: var(--radius-s);
  white-space: nowrap;
}
.crumb:hover{background: var(--bg-hover); color: var(--text-normal)}
.crumb.last{color: var(--text-normal); font-weight: var(--weight-medium); pointer-events: none}
.crumb.last:hover{background: transparent}
.crumb-sep{color: var(--text-faint); font-size: var(--text-xs)}

.content{
  overflow: auto;
  padding: var(--size-24) var(--size-32);
  min-width: 0;
  background: var(--bg-primary);
}

/* ============================================================
 * COMPONENTS
 * ============================================================ */

/* Typography helpers */
.page-title{
  font-size: var(--text-2xl);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-tight);
  color: var(--text-normal);
  margin: 0 0 var(--size-4);
}
.page-sub{
  color: var(--text-muted);
  font-size: var(--text-sm);
  margin: 0 0 var(--size-24);
}
.section-title{
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 var(--size-10);
}

/* Card */
.card{
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  padding: var(--size-16) var(--size-20);
  margin-bottom: var(--size-12);
}

/* Filter bar */
.filterbar{
  display: flex; align-items: center; gap: var(--size-8);
  margin-bottom: var(--size-12);
  padding: 0;
}
.filterbar .search{
  flex: 1;
  max-width: 320px;
  padding: var(--size-6) var(--size-10);
  font-size: var(--text-sm);
}
.filterbar select{
  padding: var(--size-6) var(--size-10);
  font-size: var(--text-sm);
}
.filterbar .count{
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

/* Data list */
.dlist{
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  overflow: hidden;
}
.dlist-row{
  display: grid;
  grid-template-columns: 2fr 1.4fr 60px 100px 2.4fr;
  gap: var(--size-12);
  padding: var(--size-10) var(--size-16);
  align-items: center;
  border-bottom: 1px solid var(--border);
  font-size: var(--text-base);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
/* 역할 필터별 스탯 컬럼 폭: 야수/투수 = 4개 · 전체 = 요약 1개 */
.dlist-row.role-야수, .dlist-row.role-투수{
  grid-template-columns: 2fr 1.4fr 60px 100px 70px 60px 70px 70px;
}
.cell-status{color: var(--text-muted); font-size: var(--text-xs)}
.cell-stat{color: var(--text-muted); font-family: var(--font-mono); font-size: var(--text-xs); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis}
.dlist-row:last-child{border-bottom: 0}
.dlist-row:hover{background: var(--bg-hover)}
.dlist-row.head{
  background: var(--bg-tertiary);
  color: var(--text-muted);
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  padding: var(--size-8) var(--size-16);
  cursor: default;
}
.dlist-row.head:hover{background: var(--bg-tertiary)}
.dlist-row.head .sort-th{
  display: inline-flex; align-items: center; gap: var(--size-4);
  cursor: pointer;
  user-select: none;
}
.dlist-row.head .sort-th:hover{color: var(--text-normal)}
.dlist-row.head .sort-th.active{color: var(--text-normal)}
.dlist-row.head .sort-indicator{
  opacity: 0.6;
  font-size: var(--text-xxs);
}
.dlist-row.head .sort-th.active .sort-indicator{opacity: 1; color: var(--accent)}
.dlist-row .cell-primary{font-weight: var(--weight-medium); color: var(--text-normal)}
.dlist-row .cell-num{font-family: var(--font-mono); color: var(--text-muted); font-size: var(--text-sm)}
.dlist-row .hand-marker{
  margin-left: var(--size-8);
  font-family: var(--font-mono);
  font-size: var(--text-xxs);
  color: var(--text-faint);
  font-weight: var(--weight-regular);
}

/* Ability grid */
.abilities{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: var(--size-4);
}
.ability{
  display: flex; justify-content: space-between; align-items: center;
  padding: var(--size-6) var(--size-10);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
}
.ability .ability-label{color: var(--text-muted)}
.ability .ability-value{
  font-family: var(--font-mono);
  font-weight: var(--weight-medium);
  color: var(--text-normal);
}
.set-group{margin-bottom: var(--size-16)}

/* 포지션 · 메인 수비 카드 */
.main-def-block{margin-bottom: var(--size-16); padding-bottom: var(--size-12); border-bottom: 1px solid var(--border)}
.main-def-label{display: block; font-size: var(--text-xs); color: var(--text-muted); letter-spacing: var(--tracking-wide); text-transform: uppercase; margin-bottom: var(--size-6)}
.main-def-sel{
  width: 100%; max-width: 360px;
  background: var(--bg-tertiary); color: var(--text-normal);
  border: 1px solid var(--border); border-radius: var(--radius-s);
  padding: var(--size-6) var(--size-10);
  font-size: var(--text-sm);
}
.main-def-sel:focus{border-color: var(--primary); outline: 0}
.main-def-sel option:disabled{color: var(--text-faint)}
.main-def-hint{margin: var(--size-8) 0 0; font-size: var(--text-xs); color: var(--text-muted)}
.pos-grid{font-size: var(--text-sm); border-top: 1px solid var(--border)}
.pos-row, .pos-head-row{
  display: grid;
  grid-template-columns: 44px 1fr 90px 90px 110px 90px;
  align-items: center;
  gap: var(--size-8);
  padding: var(--size-6) var(--size-8);
  border-bottom: 1px solid var(--border);
}
.pos-head-row{color: var(--text-muted)}
.pos-head{font-size: var(--text-xs); letter-spacing: var(--tracking-wide); text-transform: uppercase; font-weight: var(--weight-medium)}
.pos-code{font-family: var(--font-mono); color: var(--text-muted); font-size: var(--text-xs)}
.pos-label{color: var(--text-normal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: var(--size-6)}
.pos-num{font-family: var(--font-mono); text-align: right; color: var(--text-normal); font-variant-numeric: tabular-nums}
.pos-row.main{background: var(--bg-selected); border-radius: var(--radius-s)}
.pos-row:not(.main):not(.candidate) .pos-num{color: var(--text-muted)}
.pos-badge{
  display: inline-block; margin-left: var(--size-6);
  padding: 1px var(--size-6); border-radius: var(--radius-s);
  font-size: var(--text-xxs); font-weight: var(--weight-medium);
  color: var(--primary-on); background: var(--primary);
  letter-spacing: var(--tracking-wide); text-transform: uppercase;
}

/* Slots (training) */
.slots{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: var(--size-8);
}
.slot{
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  padding: var(--size-12) var(--size-16);
}
.slot-label{
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 var(--size-8);
}
.slot-meta{
  margin-top: var(--size-8);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-faint);
}
.slot select{width: 100%; font-size: var(--text-sm)}

/* Placeholder box */
.placeholder{
  color: var(--text-faint);
  font-size: var(--text-sm);
  padding: var(--size-16);
  text-align: center;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-s);
}

/* ─── 성장 로그 (#167 λ) ─── */
.growth-log{display: flex; flex-direction: column; gap: var(--size-10)}
.growth-row{border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--bg-secondary)}
.growth-row-head{
  display: flex; align-items: center; gap: var(--size-12);
  padding: var(--size-8) var(--size-12);
  border-bottom: 1px solid var(--border);
  background: var(--bg-primary);
  border-top-left-radius: var(--radius-s);
  border-top-right-radius: var(--radius-s);
}
.growth-year{font-family: var(--font-mono); color: var(--text-normal); font-size: var(--text-md); font-weight: var(--weight-semibold)}
.growth-age{color: var(--text-muted); font-size: var(--text-xs); font-family: var(--font-mono)}
.growth-status{
  font-size: var(--text-xxs); color: var(--text-muted);
  padding: 2px 6px; border: 1px solid var(--border);
  border-radius: var(--radius-s); text-transform: uppercase;
  letter-spacing: var(--tracking-wide);
}
.growth-games{margin-left: auto; color: var(--text-muted); font-size: var(--text-xs); font-family: var(--font-mono)}
.growth-row-body{padding: var(--size-8) var(--size-12); display: grid; grid-template-columns: 1fr 1fr; gap: var(--size-6) var(--size-16)}
.growth-line{display: flex; gap: var(--size-8); align-items: baseline; font-size: var(--text-xs)}
.growth-label{color: var(--text-muted); min-width: 40px; font-size: var(--text-xxs); text-transform: uppercase; letter-spacing: var(--tracking-wide)}
.growth-val{color: var(--text-normal); font-family: var(--font-mono)}
/* 편성 스코프 안내 */
.scope-note{
  display: flex; align-items: center; gap: var(--size-10);
  padding: var(--size-8) var(--size-16);
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
  font-size: var(--text-xs);
}
.scope-tag{
  padding: 2px var(--size-8); border-radius: var(--radius-s);
  background: var(--accent); color: var(--text-on-accent);
  font-weight: var(--weight-semibold);
  font-size: var(--text-xxs); letter-spacing: var(--tracking-wide);
}
.scope-desc{color: var(--text-muted)}

/* ── Dev 검증 패널 (?dev=1) ── */
.dev-panel{
  grid-area: devpanel;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  display: none;                 /* 기본은 안 보임. dev-mode에서만 열림. */
  flex-direction: column;
  overflow-y: auto;
  padding: var(--size-12);
  gap: var(--size-12);
}
.app.dev-mode .dev-panel{display: flex}
.dev-panel-head{
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: var(--size-8);
  border-bottom: 1px solid var(--border);
}
.dev-panel-title{
  font-size: var(--text-xs);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wide);
  font-weight: var(--weight-semibold);
}
.dev-panel-subtitle{
  font-size: var(--text-xxs);
  color: var(--text-faint);
  font-family: var(--font-mono);
}
.dev-card{
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: var(--size-10) var(--size-12);
  display: flex; flex-direction: column; gap: var(--size-6);
}
.dev-card-title{
  font-size: var(--text-xxs);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wide);
}
.dev-card-body{font-size: var(--text-xs); color: var(--text-normal); font-family: var(--font-mono)}
.dev-card-row{display: flex; justify-content: space-between; gap: var(--size-8); padding: 2px 0}
.dev-card-row b{color: var(--text-normal); font-weight: var(--weight-semibold)}
.dev-card-row .muted{color: var(--text-muted)}
.dev-actions{display: flex; gap: var(--size-6); flex-wrap: wrap}
.dev-btn{
  padding: var(--size-6) var(--size-10);
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  font-size: var(--text-xs);
  color: var(--text-normal);
  cursor: pointer;
}
.dev-btn:hover{background: var(--bg-hover)}
.dev-btn:disabled{opacity: 0.5; cursor: wait}
.dev-btn-primary{background: var(--accent); color: var(--text-on-accent); border-color: var(--accent)}
.dev-btn-primary:hover{filter: brightness(1.1); background: var(--accent)}
.dev-log{
  font-size: var(--text-xxs); color: var(--text-muted);
  font-family: var(--font-mono);
  max-height: 80px; overflow-y: auto;
  padding: var(--size-6); background: var(--bg-tertiary);
  border-radius: var(--radius-s);
  white-space: pre-wrap;
}
.dev-outlier-row{
  display: grid; grid-template-columns: 1fr auto;
  padding: 2px 0; font-size: var(--text-xxs); font-family: var(--font-mono);
  color: var(--text-normal); gap: var(--size-6);
}
.dev-outlier-row .name{color: var(--accent); cursor: pointer}
.dev-outlier-row .name:hover{text-decoration: underline}
.dev-outlier-row .val{color: var(--text-muted)}

.growth-cells{
  display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: var(--size-4) var(--size-8);
  padding: var(--size-6) var(--size-12) var(--size-10);
  border-top: 1px dashed var(--border);
}
.growth-cell{
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--text-xxs); color: var(--text-muted);
  font-family: var(--font-mono);
}
.growth-cell-label{color: var(--text-muted)}
.growth-cell-delta{color: var(--text-faint); font-size: 10px}
.arr{font-family: var(--font-mono); font-size: var(--text-xs)}
.arr-up2{color: #2ea43f}
.arr-up1{color: #6ab569}
.arr-flat{color: var(--text-faint); opacity: 0.5}
.arr-dn1{color: #d97757}
.arr-dn2{color: #c04a2b}

/* ─── 팀 홈 (대시보드) ─── */
.home-page{padding: var(--size-20) var(--size-24); max-width: 1280px; margin: 0 auto; overflow-y: auto}
.home-header{display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--size-24); padding-bottom: var(--size-16); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: var(--size-16)}
.home-title{margin: 0; font-size: var(--text-2xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight)}
.home-subtitle{margin: var(--size-4) 0 0; color: var(--text-muted); font-size: var(--text-sm)}
.home-header-meta{display: flex; gap: var(--size-20)}
.home-meta-item{display: flex; flex-direction: column; align-items: flex-end}
.home-meta-label{font-size: var(--text-xs); color: var(--text-muted); letter-spacing: var(--tracking-wide); text-transform: uppercase}
.home-meta-item b{font-family: var(--font-mono); font-size: var(--text-lg); font-weight: var(--weight-semibold)}

.home-grid{display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--size-16); align-items: start}

/* 카드 없는 세로 스택 개요 (선수단 개요 전용) · 밀도 압축 */
.overview-stack{display: flex; flex-direction: column; gap: var(--size-16)}
.sec{display: flex; flex-direction: column; gap: var(--size-8)}
.sec-title{
  margin: 0; padding-bottom: var(--size-4);
  border-bottom: 1px solid var(--border);
  font-size: var(--text-xs); font-weight: var(--weight-semibold);
  color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-wide);
}
/* 야수 커버리지 컴팩트: 행 padding 축소 */
.cov-compact th, .cov-compact td{padding: 3px var(--size-8) !important}
.cov-compact th{font-size: 10px !important}
.cov-compact td{font-size: var(--text-xs)}

/* 투수 커버리지: 한 행 = 역할 · 인원 · 이름 나열 */
.pit-rows{display: flex; flex-direction: column; gap: var(--size-4)}
.pit-row{
  display: grid; grid-template-columns: 60px 90px 1fr;
  align-items: baseline; gap: var(--size-10);
  font-size: var(--text-xs);
}
.pit-role{color: var(--text-normal); font-weight: var(--weight-medium)}
.pit-count{color: var(--text-faint); font-family: var(--font-mono); font-size: 10px}
.home-card{background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-m); padding: var(--size-16)}
.home-card h3{margin: 0 0 var(--size-12); font-size: var(--text-md); font-weight: var(--weight-semibold); color: var(--text-normal); letter-spacing: -0.005em}
.home-card-cta{grid-column: span 2; background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary))}
@media (max-width: 800px){.home-card-cta{grid-column: span 1}}
.home-empty{margin: 0; color: var(--text-faint); font-size: var(--text-sm); font-style: italic}

/* Hero CTA */
.home-cta-body{display: flex; flex-direction: column; gap: var(--size-12)}
.home-cta-context{margin: 0; color: var(--text-muted); font-size: var(--text-sm); line-height: var(--leading-normal)}
.home-cta-actions{display: flex; gap: var(--size-8); flex-wrap: wrap}
.btn-primary{background: var(--primary); color: var(--primary-on); border: 0; border-radius: var(--radius-s); padding: var(--size-8) var(--size-16); font-size: var(--text-sm); font-weight: var(--weight-semibold); cursor: pointer; transition: transform var(--dur-fast), background var(--dur-fast)}
.btn-primary:hover{filter: brightness(1.1)}
.btn-secondary{background: transparent; color: var(--text-normal); border: 1px solid var(--border-strong); border-radius: var(--radius-s); padding: var(--size-8) var(--size-16); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer}
.btn-secondary:hover{background: var(--bg-hover)}

/* 알림 인박스 */
.home-inbox{list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--size-8)}
.home-inbox-item{display: flex; align-items: flex-start; gap: var(--size-8); font-size: var(--text-sm); color: var(--text-normal); line-height: var(--leading-normal)}
.dot{flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px}
.dot-danger{background: var(--danger-text)}
.dot-attention{background: var(--attention-text)}
.dot-info{background: var(--info-text)}
.dot-success{background: var(--success-text)}
.home-inbox-text{flex: 1 1 auto}

/* 팀 지표 KPI */
.home-kpi{display: flex; flex-direction: column; gap: var(--size-4)}
.kpi{display: flex; justify-content: space-between; align-items: baseline; padding: var(--size-6) 0; border-bottom: 1px solid var(--border)}
.kpi:last-child{border-bottom: 0}
.kpi-label{color: var(--text-muted); font-size: var(--text-sm)}
.kpi-value{font-family: var(--font-mono); font-size: var(--text-xl); font-weight: var(--weight-semibold); color: var(--text-normal); font-variant-numeric: tabular-nums}
.kpi-value-sm{font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-medium)}

/* 캘린더 */
.home-calendar{list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--size-8)}
.home-cal-item{display: flex; gap: var(--size-12); font-size: var(--text-sm)}
.home-cal-date{font-family: var(--font-mono); color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 96px}
.home-cal-label{color: var(--text-normal)}

/* Empty state */
.home-empty-state{display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--size-24) 0; color: var(--text-faint); text-align: center}
.home-empty-glyph{font-size: var(--text-2xl); line-height: 1; margin-bottom: var(--size-8); opacity: .5}
.home-empty-state p{margin: 0; font-size: var(--text-sm)}
.home-card-wide{grid-column: span 2}
@media (max-width: 800px){.home-card-wide{grid-column: span 1}}

/* 분포 막대 (개요 카드) */
.dist{display: flex; flex-direction: column; gap: var(--size-8)}
.dist-row{display: grid; grid-template-columns: 70px 1fr 32px; align-items: center; gap: var(--size-8); font-size: var(--text-xs); padding: 2px 0}
.dist-label{color: var(--text-normal); display: flex; align-items: baseline; gap: var(--size-8)}
.dist-code{font-family: var(--font-mono); color: var(--text-muted); font-size: var(--text-xs); letter-spacing: var(--tracking-wide); min-width: 22px}
.dist-bar{height: 6px; background: var(--bg-tertiary); border-radius: 999px; overflow: hidden}
.dist-fill{height: 100%; background: var(--primary); border-radius: 999px}
.dist-count{font-family: var(--font-mono); text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums}
.kpi-of{margin-left: 4px; font-size: var(--text-sm); color: var(--text-muted); font-weight: var(--weight-normal); font-family: var(--font-sans)}
.meta-of{font-size: var(--text-xs); color: var(--text-faint); font-weight: var(--weight-normal); font-family: var(--font-sans)}
.meta-over{color: var(--danger-text)}

/* 부문별 전력 · 한 줄 5칸 · 컴팩트 */
.power-grid{
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: var(--size-12);
}
@media (max-width: 700px){.power-grid{grid-template-columns: repeat(3, 1fr)}}
.power-cell{
  display: flex; align-items: baseline; gap: var(--size-8);
}
.power-label{
  font-size: var(--text-xs); color: var(--text-muted);
  min-width: 32px;
}
.power-value{
  font-family: var(--font-mono); font-size: var(--text-lg);
  font-weight: var(--weight-semibold); color: var(--text-normal);
  font-variant-numeric: tabular-nums; line-height: 1;
}

/* 포지션 커버리지 */
.cov-table{width: 100%; border-collapse: collapse; font-size: var(--text-sm)}
.cov-table th{text-align: left; padding: var(--size-6) var(--size-8); color: var(--text-muted); font-weight: var(--weight-medium); font-size: var(--text-xs); letter-spacing: var(--tracking-wide); text-transform: uppercase; border-bottom: 1px solid var(--border)}
.cov-table td{padding: var(--size-6) var(--size-8); border-bottom: 1px solid var(--border); color: var(--text-normal)}
.cov-table tr:last-child td{border-bottom: 0}
.cov-code{font-family: var(--font-mono); color: var(--text-muted); font-size: var(--text-xs); width: 40px}
.cov-pos{color: var(--text-muted); width: 80px}
.cov-count{color: var(--text-muted); font-family: var(--font-mono); font-size: var(--text-xs); text-align: right; width: 50px; white-space: nowrap}
.cov-name{color: var(--text-normal); display: inline-flex; align-items: baseline; gap: var(--size-6); text-decoration: none}
.cov-name:hover{color: var(--primary)}
.cov-ovr{font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); font-variant-numeric: tabular-nums}
.cov-empty{color: var(--text-faint); font-style: italic}
.cov-sep{color: var(--text-faint); margin: 0 var(--size-6)}
.cov-line{display: flex; flex-wrap: wrap; gap: 2px var(--size-4); font-size: var(--text-sm); align-items: baseline}
.cov-status{display: inline-block; padding: 1px var(--size-6); border-radius: var(--radius-s); font-size: var(--text-xs); font-weight: var(--weight-medium); border: 1px solid currentColor}
.status-good{color: var(--success-text)}
.status-need-backup{color: var(--attention-text)}
.status-empty{color: var(--danger-text)}
.alert-line{margin: var(--size-6) 0 0; font-size: var(--text-xs); color: var(--danger-text)}
.rot-block{display: flex; flex-direction: column; gap: var(--size-4); padding: var(--size-6) 0}
.rot-block + .rot-block{border-top: 1px dashed var(--border)}
.rot-label{font-size: var(--text-xs); color: var(--text-muted); font-weight: var(--weight-medium)}
.rot-label{font-size: var(--text-xs); color: var(--text-muted); letter-spacing: var(--tracking-wide); text-transform: uppercase}

/* 미니 선수 리스트 */
.mini-list{display: flex; flex-direction: column; gap: var(--size-2)}
.mini-player{display: grid; grid-template-columns: 1fr auto auto; align-items: baseline; gap: var(--size-10); padding: var(--size-6) var(--size-8); border-radius: var(--radius-s); color: var(--text-normal); text-decoration: none}
.mini-player:hover{background: var(--bg-hover)}
.mini-name{font-weight: var(--weight-medium)}
.mini-meta{font-size: var(--text-xs); color: var(--text-muted)}
.mini-value{font-family: var(--font-mono); font-size: var(--text-md); font-weight: var(--weight-semibold); color: var(--text-normal); font-variant-numeric: tabular-nums}

/* 접이식 */
.fold summary{cursor: pointer; font-weight: var(--weight-semibold); color: var(--text-normal); padding: var(--size-4) 0; list-style: none; display: flex; align-items: center; gap: var(--size-6)}
.fold summary::-webkit-details-marker{display: none}
.fold summary::before{content: '›'; color: var(--text-muted); transition: transform var(--dur-fast) var(--ease); font-family: var(--font-mono); font-size: var(--text-md)}
.fold[open] summary::before{transform: rotate(90deg)}
.fold-body{padding-top: var(--size-16)}
.stats-2{display: grid; grid-template-columns: 1fr 1fr; gap: var(--size-20)}
.stats-2 h4{margin: 0 0 var(--size-4); font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-wide)}
@media (max-width: 700px){.stats-2{grid-template-columns: 1fr}}

/* Sub-tabs (페이지 안 로컬 뷰) */
.subtabs{
  display: flex; gap: var(--size-4);
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--size-16);
}
.subtab{
  padding: var(--size-8) var(--size-12);
  font-size: var(--text-sm);
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: pointer;
}
.subtab:hover{color: var(--text-normal)}
.subtab.active{color: var(--text-normal); border-bottom-color: var(--accent); font-weight: var(--weight-medium)}

/* Selection (라인업/로테이션/뎁스 공용 좌우 레이아웃) */
.lineup-wrap, .rotation-wrap, .depth-wrap, .bullpen-wrap{
  display: grid; grid-template-columns: 1fr 320px; gap: var(--size-24)
}
@media (max-width: 900px){.lineup-wrap, .rotation-wrap, .depth-wrap, .bullpen-wrap{grid-template-columns: 1fr}}

/* Depth chart (포지션별 리스트) */
.depth-list{display: flex; flex-direction: column; gap: var(--size-4)}
.depth-pos{
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: var(--size-10) var(--size-12);
}
.depth-pos-head{
  display: flex; align-items: center; gap: var(--size-8);
  margin-bottom: var(--size-8);
}
.depth-pos-label{
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--accent);
  font-weight: var(--weight-semibold);
  min-width: 40px;
}
.depth-pos-name{
  font-size: var(--text-xs);
  color: var(--text-muted);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
}
.depth-slots{display: flex; flex-direction: column; gap: var(--size-2)}
.depth-slot{
  display: grid;
  grid-template-columns: 60px 1fr auto;
  gap: var(--size-8);
  padding: var(--size-6) var(--size-10);
  align-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
  cursor: pointer;
}
.depth-slot:hover{border-color: var(--accent)}
.depth-slot.empty{border-style: dashed; color: var(--text-faint)}
.depth-rank{
  font-family: var(--font-mono);
  color: var(--text-muted);
  font-size: var(--text-xs);
}
.depth-clear{
  padding: var(--size-2) var(--size-6);
  color: var(--text-faint);
  font-size: var(--text-md);
  border-radius: var(--radius-s);
}
.depth-clear:hover{background: var(--bg-hover); color: var(--text-normal)}

/* Bullpen (역할별) */
.bullpen-list{display: flex; flex-direction: column; gap: var(--size-8)}
.bullpen-role{
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: var(--size-10) var(--size-12);
}
.bullpen-role-head{
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--size-8);
}
.bullpen-role-name{
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--accent);
  font-weight: var(--weight-semibold);
}
.bullpen-role-count{
  font-size: var(--text-xs);
  color: var(--text-muted);
}
.bullpen-members{
  display: flex; flex-wrap: wrap; gap: var(--size-4);
  min-height: 32px;
}
.bullpen-chip{
  display: inline-flex; align-items: center; gap: var(--size-6);
  padding: var(--size-4) var(--size-8);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
  background: var(--bg-tertiary);
}
.bullpen-chip-x{
  color: var(--text-faint);
  cursor: pointer; padding: 0 2px;
}
.bullpen-chip-x:hover{color: var(--text-normal)}
.bullpen-empty{
  color: var(--text-faint);
  font-size: var(--text-xs);
  font-style: italic;
  padding: var(--size-4) 0;
}

.lineup-list{
  display: flex; flex-direction: column; gap: var(--size-4);
}
.lineup-slot{
  display: grid;
  grid-template-columns: 32px 60px 1fr auto;
  gap: var(--size-12);
  align-items: center;
  padding: var(--size-10) var(--size-12);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease);
}
.lineup-slot:hover{border-color: var(--accent)}
.lineup-slot.empty{border-style: dashed; color: var(--text-faint)}
.lineup-slot.empty:hover{color: var(--text-normal)}
.slot-order{
  font-family: var(--font-mono);
  font-size: var(--text-md);
  font-weight: var(--weight-semibold);
  color: var(--accent);
  text-align: center;
}
.slot-pos{
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--text-muted);
  font-weight: var(--weight-medium);
}
.slot-name{font-weight: var(--weight-medium)}
.slot-clear{
  padding: var(--size-2) var(--size-6);
  color: var(--text-faint);
  font-size: var(--text-md);
  border-radius: var(--radius-s);
}
.slot-clear:hover{background: var(--bg-hover); color: var(--text-normal)}

/* Player picker (오른쪽 사이드) */
.picker{
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  padding: var(--size-12) var(--size-16);
}
.picker-title{
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 var(--size-10);
}
.picker-hint{
  font-size: var(--text-xs);
  color: var(--text-faint);
  margin-bottom: var(--size-10);
}
.picker-list{
  max-height: 480px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: var(--size-2);
}
.picker-item{
  display: grid;
  grid-template-columns: 60px 1fr auto;
  gap: var(--size-8);
  padding: var(--size-6) var(--size-8);
  border-radius: var(--radius-s);
  font-size: var(--text-sm);
  cursor: pointer;
  align-items: center;
}
.picker-item:hover{background: var(--bg-hover)}
.picker-item.used{opacity: .35}
.picker-item.selected{background: var(--bg-selected); border: 1px solid var(--accent); padding: calc(var(--size-6) - 1px) calc(var(--size-8) - 1px)}
.picker-item .pi-pos{font-family: var(--font-mono); color: var(--text-muted); font-size: var(--text-xs)}
.picker-item .pi-name{font-weight: var(--weight-medium)}
.picker-item .pi-ovr{font-family: var(--font-mono); color: var(--text-muted); font-size: var(--text-xs)}

/* Empty state */
.empty{
  max-width: 480px;
  margin: var(--size-48) auto 0;
}
.empty-tiles{
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: var(--size-8);
  margin-top: var(--size-16);
}
.empty-tile{
  padding: var(--size-16) var(--size-20);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.empty-tile:hover{border-color: var(--accent); background: var(--bg-hover)}
.empty-tile-kind{
  font-size: var(--text-xxs);
  color: var(--text-faint);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  margin-bottom: var(--size-4);
}
.empty-tile-name{
  font-size: var(--text-base);
  font-weight: var(--weight-medium);
  color: var(--text-normal);
}
</style>
