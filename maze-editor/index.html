<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>maze3 맵 제작</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=a440311d">
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <button class="btn quiet" data-cmd="library" title="내 맵 목록 (Esc)">목록</button>
    <div class="title"><span id="map-name"></span><span id="dirty" class="dirty" hidden>수정됨</span></div>
    <div class="spacer"></div>
    <button class="btn quiet" data-cmd="skin" title="외관 순환"><span id="skin-name"></span></button>
    <button class="btn quiet" data-pane="size">크기</button>
    <button class="btn quiet" data-pane="spawn">시야·적 진입</button>
    <button class="btn quiet" data-cmd="marks" id="marks-btn" title="기지·연결 표시 (V)">표시 V</button>
    <button class="btn quiet" data-pane="menu">더보기</button>
    <button class="btn primary" data-cmd="save" title="Ctrl+S">저장</button>
  </header>
  <aside class="tools">
    <div class="caption">그리기</div>
    <div class="grid2" id="modes"></div>
    <label class="field" id="brush-field"><span>크기 · 칸</span><input id="brush" type="number" min="1" value="1" inputmode="numeric"></label>
    <div id="shape-options" hidden>
      <div class="grid2"><button class="btn on" id="shape-solid">채움</button><button class="btn" id="shape-outline">테두리</button></div>
      <label class="field" id="thickness-field" hidden><span>두께 · 칸</span><input id="thickness" type="number" min="1" value="1"></label>
    </div>
    <div id="selection-options" hidden>
      <div class="grid2"><button class="btn on" id="select-box">사각 선택</button><button class="btn" id="select-region">덩어리 선택</button></div>
      <div class="grid2"><button class="btn" data-cmd="copy" title="Ctrl+C">복사</button><button class="btn" data-cmd="paste" title="Ctrl+V">붙여넣기</button></div>
      <button class="btn wide quiet" data-cmd="deselect">선택 해제 · Esc</button>
      <div id="offset-options" hidden>
        <div class="caption">평평한 산 띠</div>
        <div class="grid2"><button class="btn on" id="offset-in">안쪽 변환</button><button class="btn" id="offset-out">바깥 확장</button></div>
        <label class="field"><span>폭 · 칸</span><input id="offset-amount" type="number" min="1" value="1"></label>
        <button class="btn wide" data-cmd="offset">미리보기</button>
        <button class="btn wide primary" data-cmd="offset-apply" hidden>띠 적용</button>
      </div>
      <div class="faint tool-note">지형만 선택 · 기지는 H로 이동</div>
    </div>
    <div class="caption" id="terrain-caption">지형</div>
    <div class="grid3" id="terrain"></div>
    <button class="btn wide" id="base-tool" data-tool="base">기지 배치 <kbd>H</kbd></button>
    <button class="btn wide quiet" id="base-remove" data-cmd="base-remove" hidden>기지 제거</button>
    <div class="grid2">
      <button class="btn" data-cmd="undo" title="Ctrl+Z">되돌리기</button>
      <button class="btn" data-cmd="redo" title="Ctrl+Shift+Z">다시</button>
    </div>
    <button class="btn wide" data-cmd="fit">전체 보기 <kbd>F</kbd></button>
    <div class="check" id="check"></div>
    <div class="legend" id="legend"></div>
  </aside>
  <main class="stage" id="stage">
    <canvas id="view"></canvas>
  </main>
  <section class="pane" id="pane" hidden></section>
  <footer class="status"><span id="status"></span><span class="spacer"></span><span id="recovery" class="faint"></span></footer>
</div>
<div id="modal-root"></div>
<div id="boot" class="boot">불러오는 중…</div>
<script type="module" src="src/main.js?v=a440311d"></script>
</body>
</html>
