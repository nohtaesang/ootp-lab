<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상황 놀이터</title>
<!-- 디자인 토큰: build.sh 가 web/shared/design/tokens.css 를 옆에 복사한다(없어도 아래 기본값으로 그린다) -->
<link rel="stylesheet" href="tokens.css">
<style>
  :root {
    --lab-bg: var(--bg-canvas, #1d1d1f);
    --lab-panel: var(--bg-surface, #262628);
    --lab-card: var(--bg-raised, #303033);
    --lab-line: var(--border, #4a4a4c);
    --lab-text: var(--text-normal, #f5f5f5);
    --lab-muted: var(--text-muted, #bdbdbd);
    --lab-accent: var(--primary, #5b5bd6);
    --lab-accent-on: var(--primary-on, #ffffff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--lab-bg); color: var(--lab-text); font-family: var(--font-sans, system-ui, sans-serif); font-size: var(--text-md, 14px); }
  .app { display: grid; grid-template-columns: 1fr 320px; height: 100%; }
  .stage { position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .stage.placing canvas { cursor: crosshair; }
  .result { position: absolute; left: 16px; top: 16px; display: flex; gap: 8px; pointer-events: none; }
  .result span { background: var(--lab-panel); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .panel { background: var(--lab-panel); padding: 16px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { color: var(--lab-muted); font-size: var(--text-sm, 12px); }
  select, input[type=number], button { font: inherit; color: var(--lab-text); background: var(--lab-bg); border: 1px solid var(--lab-line); border-radius: 8px; padding: 8px 10px; min-height: 36px; }
  select { width: 100%; }
  input[type=number] { width: 88px; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--lab-accent); }
  button { cursor: pointer; }
  button.on { background: var(--lab-accent); color: var(--lab-accent-on); border-color: var(--lab-accent); }
  .seg { display: flex; gap: 4px; }
  .seg button { flex: 1; padding: 8px 6px; }
  .check { display: flex; gap: 4px; align-items: center; color: var(--lab-text); font-size: var(--text-md, 14px); }
  .time { font-variant-numeric: tabular-nums; color: var(--lab-muted); min-width: 64px; text-align: right; }
  .hide { display: none !important; }
  input[type=text] { font: inherit; color: var(--lab-text); background: var(--lab-bg); border: 1px solid var(--lab-line); border-radius: 8px; padding: 8px 10px; min-height: 36px; }
  .card { background: var(--lab-card); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card.quiet { background: transparent; padding: 0 2px; }
  .h:empty { display: none; }
  .prev { font-size: var(--text-sm, 12px); color: var(--lab-muted); line-height: 1.5; }
  .h { color: var(--lab-muted); font-size: var(--text-sm, 12px); font-weight: 600; }
  .nav { display: flex; align-items: center; gap: 8px; }
  .nav .pos { flex: 1; text-align: center; color: var(--lab-muted); font-variant-numeric: tabular-nums; }
  .title { font-size: var(--text-lg, 16px); font-weight: 600; line-height: 1.4; min-height: 2.8em; }
  button.ghost { background: transparent; }
  .seg.big button { min-height: 48px; font-weight: 600; }
  .seg.small button { min-height: 32px; padding: 4px 6px; font-size: var(--text-sm, 12px); }
  #scene { color: var(--lab-muted); font-size: var(--text-sm, 12px); min-height: 32px; padding: 4px 8px; }
  .all { margin-top: auto; padding-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; }
    .panel { padding: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="field"></canvas>
    <div class="result hide" id="result"></div>
  </div>
  <div class="panel">
    <section class="card">
      <div class="nav">
        <button id="prev" class="ghost" aria-label="이전">‹ 이전</button>
        <span class="pos" id="pos"></span>
        <button id="next" class="ghost" aria-label="다음">다음 ›</button>
      </div>
      <div class="title" id="title"></div>
      <div class="h" id="changed"></div>
      <div class="prev hide" id="prevBox"><span class="h">지난번</span> <span id="prevNote"></span></div>
      <div class="seg dev hide" id="variant">
        <button data-v="normal" class="on">보통</button>
        <button data-v="borderline">경계</button>
        <button data-v="error">실책</button>
      </div>
      <select id="scene" class="dev hide" aria-label="장면"></select>
    </section>
    <section class="card" id="verdictBox">
      <div class="h" id="vstale"></div>
      <div class="seg big" id="verdict">
        <button data-j="ok">괜찮다</button>
        <button data-j="ask">애매하다</button>
        <button data-j="odd">어색하다</button>
      </div>
      <input type="text" id="vnote" placeholder="누가 · 언제 · 무엇">
    </section>
    <section class="card">
            <div class="row">
        <button id="play">▶</button>
        <input type="range" id="scrub" min="0" max="1000" value="0" style="flex:1">
        <span class="time" id="clock">0.0</span>
      </div>
      <div class="seg small dev hide" id="rate">
        <button data-r="0.25">0.25×</button>
        <button data-r="0.5">0.5×</button>
        <button data-r="1" class="on">1×</button>
      </div>
    </section>
    <section class="card quiet hide" id="tools">
      <div class="h">도구</div>
      <div class="row"><button id="parts" class="ghost">부품</button><button id="place" class="ghost">놓기</button></div>
      <div class="group hide" id="placeBox">
        <div class="seg small" id="kind">
          <button data-k="ground" class="on">땅볼</button>
          <button data-k="liner">직선</button>
          <button data-k="fly">뜬공</button>
          <button data-k="pop">팝</button>
        </div>
        <div class="row"><label for="ev">속도</label><input type="number" id="ev" value="140" min="40" max="190" step="5"></div>
        <div class="row">
          <label>주자</label>
          <span class="check"><input type="checkbox" id="r1">1루</span>
          <span class="check"><input type="checkbox" id="r2">2루</span>
          <span class="check"><input type="checkbox" id="r3">3루</span>
        </div>
        <div class="row"><label for="outs">아웃</label>
          <select id="outs" style="width:auto"><option>0</option><option>1</option><option>2</option></select>
          <label for="seed">시드</label><input type="number" id="seed" value="1">
        </div>
      </div>
    </section>
    <section class="all">
      <span class="h">전체 <span id="vcount"></span></span>
      <button id="vcopy">전체 복사</button>
    </section>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
